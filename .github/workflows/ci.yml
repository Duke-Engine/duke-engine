# The gate on master, and the release to Maven Central when a version is tagged.
#
# The engine is a library: what a release produces is jars in a repository, not
# an installer. The games built on it have release pipelines of their own, in
# their own repositories — see Duke-Engine/duke-dungeon.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version. What it publishes is whatever `version` says in
# build.gradle.kts, so the two are kept in step by hand — a tag that disagrees
# with the build file publishes the build file's version, not the tag's.

name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch or tag. A second push while the first is still running
  # cancels it — except for tags, where a cancelled run is a half-made release.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ---------------------------------------------------------------------------
  # The gate. Runs on everything, including pull requests.
  # ---------------------------------------------------------------------------
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide the other two
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # No display anywhere in the suite: asset loading needs none, which is what
      # lets a broken model fail a build rather than fail in front of a player.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
        shell: bash

      - name: Keep the reports when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/**'
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The release. Only for a tag, and only once the gate has passed everywhere.
  #
  # Needs four secrets, none of which are in this repository:
  #
  #   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  a token from
  #       central.sonatype.com, under View Account → Generate User Token
  #   SIGNING_KEY            the ascii-armoured secret key, whole
  #   SIGNING_KEY_PASSWORD   its passphrase
  #
  # Central will not take an unsigned artifact, so a missing key fails here
  # rather than halfway through the upload.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to Maven Central
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
