; ---------------------------------------------------------------------------
; The dark.
;
; Three states, and they are meant to be told apart at a glance: never been
; there (nothing drawn at all -- not the floor, not the walls, not what is
; standing on them), been there and left (dim: the walls are still drawn so the
; way back can be found, and the engine's own fog has already taken the monsters
; out of the snapshot), and in sight now (everything).
;
; LineOfSight is the important one. Without it the light is a circle that does
; not care what it is shining through, so standing in a corridor lights the rooms
; on both sides of it and there is nothing left to discover. With it, a straight
; line is drawn from the hero to every cell and stone stops it -- the wall itself
; is seen, what is behind it is not. Pure arithmetic over the grid the pathfinder
; already keeps: no shader, and nothing the simulation can feel.
;
; Tint is what the dark is made of. Black is a hole in the screen; a cold grey
; blue is a room somebody has stopped lighting, which is the thing being drawn.
;
; How it is drawn: the dark is a TEXTURE, stretched over the whole map as one
; sheet and blended over everything under it -- floor, walls, chests, whatever is
; standing in a room he has left. It used to be a brightness per cell painted flat
; across every tile in that cell, and however carefully the cells themselves were
; softened the floor still came out as a field of ten-unit squares. A sheet has
; its own resolution and the card fills in between its texels, so the edge of the
; light is smooth at the size of a pixel rather than the size of a tile. No shader
; anywhere in it.
; ---------------------------------------------------------------------------

DungeonFog Sight
  LineOfSight = Yes
  ; The three shades, as percentages of a room in full sight. Unseen at 0 is the
  ; black a crawler wants; raise it and the whole floor plan is faintly there from
  ; the first frame, which is a different game. Remembered is low enough to read
  ; as memory rather than as light, high enough to find the way back through.
  UnseenPercent = 0
  RememberedPercent = 30
  VisiblePercent = 100
  ; How many cells the edge of the light is smeared over. One is the old hard
  ; staircase softened by a single cell; two is a torch rather than a spotlight.
  SoftenCells = 2
  ; How fast the dark gives way, as a share of what is left each second. Per
  ; second rather than per frame, or a faster machine would open the map faster.
  OpenPerSecond = 7
  ; How many texels across the sheet is, whatever size the map is. Nothing to do
  ; with cells: this is the resolution the dark is DRAWN at, and it is the number
  ; that decides whether the edge of the light is smooth or stepped. 256 over a
  ; dungeon floor is several texels to a cell. Higher costs a little more to push
  ; to the card each frame and nothing else.
  TextureSize = 256
  ; The colour of nothing: cold, and slightly blue, so unlit stone reads as stone
  ; rather than as a gap. Also the window's own background, exactly -- the sheet
  ; at full strength and the void beyond the map are the same dark, and any
  ; difference between them draws the map's outline on the screen.
  Tint = 0x121821
End

; ---------------------------------------------------------------------------
; What the floor is built from.
;
; The kit is Kenney's Modular Dungeon Kit (CC0). Its pieces are a floor tile and
; walls that stand on a tile's EDGE — so a wall is drawn on the line between open
; ground and stone, which is exactly where the pathfinder stops the hero. The
; picture and the collision are then the same wall.
;
; TileSize is what the kit was modelled at. A cell is 10 world units, so a kit
; authored at 4 is scaled by 2.5 — the only number here that has to be right.
;
; Naming no Floor turns the whole thing off and the dungeon is drawn in plain
; coloured blocks again, which is what it looked like before any of this.
; ---------------------------------------------------------------------------

DungeonTiles Kenney
  Folder = Models/dungeon/
  Floor = template-floor.glb
  Wall = template-wall.glb
  ; Fills the square notch where two walls meet at a right angle.
  Corner = template-wall-corner.glb
  TileSize = 4
  ; How tall a wall piece stands, in the same units. It is what the lid over the
  ; rock is laid at: without one you look over the wall into an empty hole, and
  ; the room reads as a house with the roof off.
  WallHeight = 4
End

; ---------------------------------------------------------------------------
; Where the monsters' movement comes from.
;
; The creature kit ships rigged models with no animation; the animation library
; ships animation with no creature. They meet because both were built on the same
; standard humanoid skeleton — every joint the monsters have, the library
; animates. So one library moves the whole bestiary, and a new monster needs no
; animation work at all.
;
; The clips named here are the defaults. A DungeonMonster block may name its own
; Idle, Walk, Attack or Hurt instead — the runner jogs rather than walks. Only
; the ones that need to differ do: every creature strikes the same way on
; purpose, so a blow is recognisable whichever of them threw it.
;
; Idle and Walk are STATES and loop. Attack and Hurt are MOMENTS and play once,
; over whatever the creature was doing: the blow when its weapon lets go, the
; flinch when its health drops. Nothing in a snapshot says "is swinging right
; now", and a moment played on a loop is not the same thing slower.
;
; A clip is fetched by name, so a name that is not in the library simply leaves
; that monster standing still rather than failing. The library's own names are
; listed at quaternius.com/animviewer.html.
;
; Naming no Library turns animation off and the monsters stand in their modelling
; pose, which is what they did before this existed.
; ---------------------------------------------------------------------------

DungeonAnimations Universal
  Library = Models/monsters/UAL1_Standard.glb
  Idle = Idle_Loop
  Walk = Walk_Loop
  ; An overhead swing: the arm goes up and comes down. Everything down here
  ; strikes the same way, from the smallest to the boss, so a blow reads as a
  ; blow wherever it comes from — a monster that merely twitches at you does not
  ; look like it hit anything, whatever the health bar says.
  ;
  ; Played ONCE, on the frame the weapon lets go — not on a loop while the
  ; monster "is attacking", which is true from the moment it notices the hero
  ; until the fight ends. The clip used to run on its own tempo, so a monster
  ; that strikes every 1.6 seconds threw a one-second punch and none of them was
  ; the blow.
  ;
  ; This one runs 1.53 seconds. The creatures strike every 0.73 to 1.60 (their
  ; ReloadFrames in creatures.ini, 30 frames to the second), so the quick ones
  ; begin the swing again before they have finished it. That is the price of one
  ; swing for everything, and it is the one that was asked for.
  Attack = Sword_Attack
  ; Played once as it falls, before the body is taken away.
  Death = Death01
  ; Hurt = Hit_Chest
  ;
  ; A flinch when something takes health off it. OFF on purpose, not forgotten:
  ; a flinch and a swing are the same one-shot channel, so a monster being shot
  ; while it swings drops the swing — the hit it was landing simply stops being
  ; drawn, and hitting a monster reads as cancelling its attack. It comes back
  ; as something the player buys rather than as something every arrow does for
  ; free. Naming it here is all it takes to switch on.
End

; ---------------------------------------------------------------------------
; The hero.
;
; A different creature kit from the monsters, on a different skeleton, with its
; animations delivered one movement per file — which is how animation sites hand
; their work out. Each of those files carries the same exporter-generated clip
; name inside it, so the FILE is what says which is the run and which is the
; punch. That is why these are paths rather than names, unlike DungeonAnimations
; above where one library holds many clips and names tell them apart.
;
; The two skeletons never meet and do not need to: a creature is animated from a
; library built on its own rig.
;
; Facing turns the model's forward onto the engine's. A quarter out and he walks
; sideways, a half out and he moonwalks — so it is here rather than in Java, and
; correcting it is an edit.
;
; Naming no Model puts him back to a coloured capsule.
; ---------------------------------------------------------------------------

DungeonHero Erika
  Model = Models/hero/Erika.glb
  ; GeometryHeight is 12 in creatures.ini and the model stands 1.81 tall.
  ModelScale = 6.6
  Facing = 90
  IdleFrom = Models/hero/idle.glb
  ; He moves at 45 against a monster's 24 — a walk cycle at that speed reads as
  ; skating, so he runs.
  WalkFrom = Models/hero/run.glb
  ; The release of a drawn bow, not a fist: he shoots from 60 away.
  AttackFrom = Models/hero/shoot.glb
  DeathFrom = Models/hero/death.glb
End

; ---------------------------------------------------------------------------
; What an arrow is drawn as.
;
; The hero's own model carries one — the shaft on his string — and one mesh out
; of that file is what flies. Cheaper than it sounds: eighty triangles.
;
; Part is the name INSIDE the file, and it is WRONG. The exporter shuffled the
; names in this kit: the mesh called Eyes is 0.75 long and 0.04 thick, which is
; an arrow and is nothing else; the one called Arrow is the clothes, and the one
; called Eyelashes is the whole body. Do not "correct" this to the sensible name
; — DungeonMonsterArtTest measures the part and will tell you what it found.
;
; Facing turns it onto the engine's forward, as everywhere else. If arrows fly
; blunt end first, this is the number.
;
; Tint matters more than it looks: without one the piece keeps the loader's PBR
; material, which this client cannot light, and the arrow comes out black. Same
; trap as the monsters.
; ---------------------------------------------------------------------------

DungeonArrow Look
  Model = Models/hero/Erika.glb
  Part = Erika_Archer_Eyes_Mesh_0
  Scale = 9
  Facing = 90
  ; Drawn at bow height rather than along the floor. Purely a matter of drawing:
  ; the simulation is flat, and this is the line the shot is drawn along.
  Height = 7
  Tint = 0xE8DCB0
  ; The drawn shot Q looses: the same model and part, nearly twice the size, in
  ; torch colour, and slow enough to follow with the eye.
  HeavyTemplate = HeavyArrow
  HeavyScale = 16
  HeavySpeed = 120
  HeavyTint = 0xE8A33D
End

; ---------------------------------------------------------------------------
; The hero's panel.
;
; The client draws it — stone slots, a blood bar, a green one — but writes none
; of the words on it, because which language a dungeon speaks is the dungeon's
; business and client3d is shared with three other games. So the wording is here.
;
; RankSuffix is stuck straight onto the level, and onto the level an ultimate is
; waiting for: 7 + "-daraja" is what appears beside his name, 5 + "-daraja" is
; what appears on the locked slot.
;
; The hero's name itself is not here — it is DisplayName in creatures.ini, where
; every other name in the game already lives.
; ---------------------------------------------------------------------------

DungeonHud Panel
  DepthWord = CHUQURLIK
  RankSuffix = -daraja
  ; The strip under the skill slots, where the powers he has taken are shown.
  PowersWord = Kuchlar
  ; The line under the new level on the level-up screen.
  ChooseWord = Bittasini tanlang
  ; The three figures under the bars. What they are worth is worked out from the
  ; creature file and his level; what they are CALLED is here, with the rest of
  ; the words.
  AttackWord = Zarba
  ArmourWord = Zirh
  SpeedWord = Tezlik
  ; Where a skill's Icon is found. Joined onto the front of it, the same way
  ; DungeonTiles joins its Folder onto a piece — a folder written once rather than
  ; on every line that names a file. The pictures are white on transparent and the
  ; panel tints them as it draws, so one file serves a slot that is ready, one
  ; reloading and one still locked.
  IconFolder = Icons/skills/
End

; ---------------------------------------------------------------------------
; How a floor looks
;
; Every floor is the same fight; what changes is what it is made of. A theme is
; a kit to build the floor from, a colour for the dark, and whatever creatures
; are drawn differently while it lasts. It changes no room, no monster and no
; number the simulation reads -- which is exactly why the choice can be drawn
; from the seed without disturbing the world's own dice, and why a test can hold
; the checksum still across a change of theme.
;
; A fourth theme is three blocks here and a folder of models. There is no Java.
;
;   DungeonTheme <Name>          what the kit is and how it is placed
;   DungeonTone <Theme> <Name>   one variation inside it, drawn from the seed
;   DungeonThemeMonster <Theme> <Template>   a creature drawn differently here
;   DungeonThemes Order          which depth wears which
;
; The placement numbers are the awkward part and they are awkward because kits
; disagree. Where a wall's origin sits, how wide a wall was modelled against its
; own floor tiles, whether the models carry their own colours -- every kit
; answers differently, and every one of those answers is measured rather than
; guessed. See DungeonTilesTest, which loads each of them and checks.
; ---------------------------------------------------------------------------

; The kit the game shipped with: one colour atlas, four-unit tiles, walls whose
; face already lands on the boundary. Nothing to correct.
DungeonTheme Kenney
  Folder = Models/dungeon/
  TileSize = 4
  WallHeight = 4
  FogTint = 0x000000
End

DungeonTone Kenney Stone
  Floor = template-floor.glb
  Wall = template-wall.glb
  Corner = template-wall-corner.glb
End

DungeonTone Kenney Cold
  Floor = template-floor.glb
  Wall = template-wall.glb
  Corner = template-wall-corner.glb
  ; The same stone, colder. A tone need not be different models.
  Tint = 0xBFC8D8
End

; Worked stone, two-unit tiles, and a wall centred on its own origin -- so it is
; lifted a full unit to stand on the floor rather than half sunk into it, and
; pushed back a fifth of a unit so its face lands on the boundary.
DungeonTheme Dungeon
  Folder = Models/theme-dungeon/
  TileSize = 2
  WallHeight = 2
  WallLift = 1.0
  WallShift = -0.22
  ; A flight of steps between two storeys. Scaled to the cell it stands on and
  ; the storey it climbs, and turned by whichever way its own steps happen to
  ; face -- both measured off the model, because kits agree about neither.
  Stairs = Stairs_Modular.obj
  ; No texture in the kit at all: every part says its own colour, and one shared
  ; skin would paint the lot flat grey.
  OwnMaterials = Yes
  FogTint = 0x07060A
End

DungeonTone Dungeon Damp
  Floor = Floor_Modular.obj
  Wall = Wall_Modular.obj
End

DungeonTone Dungeon Dry
  Floor = Floor_Modular.obj
  Wall = Wall_Modular.obj
  Tint = 0xD8C9A8
End

; Ruins: the richest kit of the three, and the only one with enough floors and
; walls that a tone can be different models rather than a different cast.
DungeonTheme Ruins
  Folder = Models/theme-ruins/
  TileSize = 2
  WallHeight = 2
  ; Its walls already stand on the ground; only the slab is centred on the line.
  WallShift = -0.04
  OwnMaterials = Yes
  Stairs = Stairs.obj
  ; Green in the dark, because things grow here.
  FogTint = 0x080D07
End

DungeonTone Ruins Overgrown
  Floor = Floor_Squares.obj
  Wall = Wall_Overgrown.obj
  Tint = 0xC6D8B4
End

DungeonTone Ruins Fallen
  Floor = Floor_Standard.obj
  Wall = Wall_Broken.obj
End

DungeonTone Ruins Tiled
  Floor = Floor_Diamond.obj
  Wall = Wall.obj
  Tint = 0xD9D2C0
End

; A ship. Its floors are two units and its walls four -- a wall spans two tiles
; in the pack it came from -- so the walls are scaled by their own module or
; they come out twice as wide and twice as tall as they should.
DungeonTheme SciFi
  Folder = Models/theme-scifi/
  TileSize = 2
  WallTileSize = 4
  WallHeight = 4.43
  OwnMaterials = Yes
  Stairs = Staircase.obj
  ; Cold blue: the dark on a ship is a corridor with the lights off.
  FogTint = 0x05080E
End

DungeonTone SciFi Bare
  Floor = FloorTile_Basic.obj
  Wall = Wall_1.obj
End

DungeonTone SciFi Panelled
  Floor = FloorTile_Basic2.obj
  Wall = Wall_3.obj
  Tint = 0xBFCBD8
End

DungeonTone SciFi Rust
  Floor = FloorTile_Basic.obj
  Wall = Wall_5.obj
  Tint = 0xD8BFA8
End

; ---------------------------------------------------------------------------
; What walks the ship.
;
; The game's own creatures, unchanged.
;
; A theme may name a different model for a kind -- that is what
; DungeonThemeMonster is for, and it works: the block is read, the look is
; swapped, and nothing the simulation reads moves. This theme names none, which
; is a choice rather than a gap. The skeletons that walk the stone walk the
; corridors too, and the floor around them is what says where you are.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; Which depth wears which.
;
; Two floors each, then round again. WhenExhausted is the answer to a real
; question in a game with no bottom: Repeat begins the list over, Last stays in
; the deepest look for ever.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; What stands about in the rooms.
;
; A room with nothing in it is a floor with a fight on it. These are ordinary
; templates (props.ini) with a shape and no body, which means the engine makes
; them solid — paths go round them, bodies stop at them — and neither brain will
; ever shoot at one, because both look for a candidate with a body.
;
; How each is drawn is the theme's business: DungeonThemeMonster re-skins any
; template, and a prop is a template. A theme that names no model for one gets
; the engine's plain shape, which for a cylinder is a pillar already.
; ---------------------------------------------------------------------------

DungeonProps Scatter
  ; Per room, including the one the hero starts in. Kept low: things to walk
  ; round are furniture, and a room full of furniture is a room you cannot fight
  ; in.
  MinPerRoom = 0
  MaxPerRoom = 3
End

DungeonProp Pillar
  Weight = 4
End

DungeonProp Statue
  Weight = 2
End

DungeonProp Barrel
  Weight = 3
End

DungeonThemeMonster Dungeon Pillar
  Model = Column.obj
  ModelScale = 2.4
End

DungeonThemeMonster Dungeon Statue
  Model = Statue_Horse.obj
  ModelScale = 2.2
End

DungeonThemeMonster Dungeon Barrel
  Model = Barrel.obj
  ModelScale = 3.5
End

DungeonThemeMonster Ruins Pillar
  Model = Column_Round.obj
  ModelScale = 2.5
End

DungeonThemeMonster Ruins Statue
  Model = DeadTree_1.obj
  ModelScale = 3.0
End

DungeonThemeMonster Ruins Barrel
  Model = Barrel.obj
  ModelScale = 3.5
End

DungeonThemeMonster SciFi Pillar
  Model = Column_1.obj
  ModelScale = 2.2
End

DungeonThemeMonster SciFi Barrel
  Model = Props_Base.obj
  ModelScale = 2.0
End

DungeonThemes Order
  Order = Kenney Kenney Dungeon Dungeon Ruins Ruins SciFi SciFi
  WhenExhausted = Repeat
End

; ===========================================================================
; What the dungeon sounds like.
;
; The client raises moments by name -- an arrow left a bow, a floor changed, a
; key was pressed -- and has never heard of a bow. What each moment sounds like
; is here, and adding one is a block rather than a line of Java. That division
; is the same one the models follow, and for the same reason: client3d draws
; four games and cannot hold any of their opinions.
;
; A name may be dotted. The client asks for `died.Boss` and takes `died` when
; nobody wrote the first -- so a game is as particular as it wants to be and no
; more, and no creature's name appears in the client.
;
; Channel is which knob turns it down: Effects, Voice, Ui or Music. Four rather
; than one because the same person wants them at different volumes -- keeping
; the music low while still hearing what is behind you is an ordinary thing to
; want, and so is silencing a hero who will not stop talking.
;
; Positional says whether it happened somewhere. A shot did; a menu click did
; not, and giving it a position would make it quieter when the camera moved.
;
; Several File lines means several ways it can sound, and the client never plays
; the same one twice running. That matters most where it is heard most: the bow
; goes hundreds of times in a run, and one unvarying sample stops being a bow
; and becomes a click.
;
; Gain is per cue because four packs recorded by four people are not mastered to
; each other. GapSeconds is the least time between two of the same moment -- a
; footstep needs a stride, or a walk is a buzz.
; ===========================================================================

DungeonSounds Settings
  Folder = audio/
  ; One voice at a time. A player clicking around the floor gives an order every
  ; frame he likes; she answers the first and then keeps quiet.
  VoiceGapSeconds = 1.6
End

; ---- the bow, which is heard more than anything else ----------------------

DungeonSound arrow_fired
  Channel = Effects
  Positional = Yes
  Gain = 0.55
  File = combat/bow_shot_1.ogg
  File = combat/bow_shot_2.ogg
  File = combat/bow_shot_3.ogg
End

; The drawn shot Q looses -- one sound, because it happens once in a while and
; wants to be recognised rather than varied.
DungeonSound spawned.HeavyArrow
  Channel = Effects
  Positional = Yes
  Gain = 0.8
  File = combat/bow_shot_heavy.ogg
End

DungeonSound struck.Arrow
  Channel = Effects
  Positional = Yes
  Gain = 0.7
  File = combat/arrow_hit_1.ogg
  File = combat/arrow_hit_2.ogg
  File = combat/arrow_hit_3.ogg
End

; ---- being hit, and dying -------------------------------------------------

DungeonSound hurt.Hero
  Channel = Effects
  Positional = Yes
  Gain = 0.9
  ; Half a second apart at most: three arrows landing at once should sound like
  ; trouble, not like a rattle.
  GapSeconds = 0.35
  File = combat/hero_hurt_1.ogg
  File = combat/hero_hurt_2.ogg
End

; Death, by what died. The client asks for died.<Template> and falls through to
; died, so a creature nobody wrote a line for still makes a noise.
DungeonSound died
