DungeonMonster Revenant
  ; Heals itself (AutoHealUpdate in creatures.ini). Kill it quickly or it undoes
  ; the fight — a damage check rather than a health check.
  SenseRadius = 36
  ChaseRadius = 75
  CloseDistance = 4
  RepathFrames = 10
  SwingFrames = 14
  MinDepth = 3
  Weight = 12
