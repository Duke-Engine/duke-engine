DungeonMonster Boss
  ; One per dungeon, in the furthest room. Sees a long way and never gives up,
  ; so its room is a fight rather than something to be walked past.
  SenseRadius = 55
  ChaseRadius = 195
  CloseDistance = 4
  RepathFrames = 8
  ; Slow enough to be read, which is most of what makes a boss fightable.
  SwingFrames = 20
  ; Never picked as ordinary room filling — placed deliberately.
  MinDepth = 0
  Weight = 0
  ; Deliberately unlike every other monster, and unlike the hero: on the minimap
  ; this dot is the only thing telling the player where the floor ends.
  Colour = 0xFFFFFF
  Scale = 2.2
  ; Twice anything else, and darkened until it reads as its own creature.
  Model = Models/monsters/Imp.glb
  Texture = Models/monsters/Textures/T_Imp_BaseColor_3.png
  ModelScale = 13.1
  Tint = 0x6E4A55
End

DungeonDepth Descent
  ; Killing the boss opens the way down. Each depth is the same generator with a
  ; new seed and tougher inhabitants; the hero keeps what he has earned, so the
  ; two curves have to be tuned against each other.
  ;
  ; Percentages are of the creature's base value, added per depth beyond the
  ; first: at depth 3 with 25%, a monster has 1 + 2 x 0.25 = 1.5x health.
  MonsterHealthPercentPerDepth = 25
  MonsterDamagePercentPerDepth = 15
  MonsterCountPercentPerDepth = 20

  ; The boss climbs faster than its underlings — it is meant to be the wall.
  BossHealthPercentPerDepth = 40
  BossDamagePercentPerDepth = 25

  ; Experience is worth more the deeper it was earned, so levelling roughly keeps
  ; pace with what it is levelling against.
  ExperiencePercentPerDepth = 30
End

; ---------------------------------------------------------------------------
; Skills
;
; A block per skill, headed by the hero it belongs to and the key that casts it.
; Skills are the hero's, not the game's: a second hero is four more blocks here
; and a SkillBook line in his creature block, with no Java at all. Two heroes may
; share an Effect and differ in every number, which is why the effect is named
; separately from the skill.
;
; Effect is one of STRIKE (hurt the nearest enemy in Range), AREA_DAMAGE (hurt
; everything within Radius), DASH (travel Distance along your facing) and
; EMPOWER (BoostPercent more damage for DurationFrames). Those four are the only
; part of a skill written in code.
;
; Everything with PerLevel grows straight from the hero's level, computed in one
; step rather than accumulated, so a level 7 hero is the same however he got
; there. CooldownPerLevel is negative because a cooldown improves by shrinking.
; UnlockLevel is what makes an ultimate an ultimate.
;
; Frames, not seconds: 30 frames is a second of game time, and a cooldown counted
; in frames is the same cooldown on every machine.
; ---------------------------------------------------------------------------

DungeonSkill Hero Q
  ; A heavy shot at one target, reaching past his ordinary bow. The reliable
  ; answer to a single dangerous thing, and the skill that is nearly always up.
  Effect = STRIKE
  ; He draws before he looses. Half a second of standing and aiming, and then a
  ; real arrow that has to cross the room — the same shaft as his ordinary shot,
  ; drawn bigger and travelling slower, so the shot the player spent is the one
  ; he can watch. Without this the monster simply lost health and nothing on
  ; screen said why.
  WindUpFrames = 15
  Projectile = HeavyArrow
  Damage = 45
  DamagePerLevel = 7
  Range = 68
  CooldownFrames = 90
  CooldownPerLevel = -3
  UnlockLevel = 1
  ; The picture in his slot. A name here and nothing in Java: a fifth skill is
  ; a fifth block of this file. IconFolder in DungeonHud says where to look.
  Icon = arrowhead.png
End

DungeonSkill Hero W
  ; For when they have reached him, which is the only way an archer dies. It goes
  ; off around himself, so it is the panic button rather than an opening move.
  Effect = AREA_DAMAGE
  Damage = 28
  DamagePerLevel = 4
  Radius = 40
  CooldownFrames = 180
  CooldownPerLevel = -5
  UnlockLevel = 1
  Icon = arrow-cluster.png
End

DungeonSkill Hero E
  ; Distance, in whichever direction he is facing — into a fight or out of one.
  ; No damage on purpose: it is the skill that decides whether the other three
  ; get used, and giving it damage as well would make it the only one.
  Effect = DASH
  Distance = 58
  CooldownFrames = 150
  CooldownPerLevel = -4
  UnlockLevel = 1
  Icon = sprint.png
End

DungeonSkill Hero R
  ; The ultimate. Not a bigger version of W — a window, during which everything
  ; else he does is worth more. Long enough to spend Q and W inside it.
  ;
  ; "Everything" means his arrows and his skills alike. That is worth writing
  ; down because for a while it was not true: the boost rides the engine's damage
  ; seam, which only a weapon consults, so Q and W went out at their plain value
  ; while this said otherwise. His level bonus is a different thing and stays a
  ; weapon bonus — the skills grow on their own DamagePerLevel, and applying both
  ; would count the same level twice.
  Effect = EMPOWER
  BoostPercent = 80
  BoostPerLevel = 12
  DurationFrames = 180
  CooldownFrames = 900
  CooldownPerLevel = -30
  ; Half way up the ladder: the run has to be earned before it turns.
  UnlockLevel = 5
  ; Lorc, game-icons.net (CC BY 3.0) — see CREDITS.md.
  Icon = hood.png
End


; ---------------------------------------------------------------------------
; Level-up powers.
;
; A level already gives health, damage and armour on its own. These are the part
; the PLAYER decides: at every level three cards are put on the table and he
; keeps one for the rest of the run. Two runs that reach level six are then two
; different heroes, which is the whole reason for them.
;
; A block per power, headed by its id -- which is what a chosen card is named by,
; and never appears on screen. Adding a power is a block here and no Java; adding
; a new KIND of power is a constant in PowerEffect and one branch where it is read.
;
; Effect is one of:
;   SKILL_DAMAGE   a skill hits Value percent harder
;   COOLDOWN       a skill comes back Value percent sooner
;   MOVE_SPEED     the hero walks Value percent faster
;   LIFESTEAL      Value percent of the damage he deals returns as health
;   EXTRA_CHARGE   a skill may be cast Value more times before it recharges
;
; Skill says which one it is about -- Q, W, E, R, or * for all four. It means
; nothing for MOVE_SPEED and LIFESTEAL, which are about the hero.
;
; Weight is how often it comes up against the others; MaxStacks is how many times
; it may be taken before it stops being offered; MinLevel keeps a card back until
; the run has got somewhere. Stacks ADD rather than compound: two of "+25%" is
; +50%, because a player reading the same card twice expects the second to be
; worth what the first was.
;
; Name and Desc are the words on the card, and they are finished words: the
; client draws the card and writes none of them, exactly as it draws the hero's
; panel and writes none of that. They may not contain a comma or a bar -- those
; two separate the fields on their way across, and DungeonSettings refuses a file
; that uses them rather than letting a card arrive cut in half.
;
; Icon picks one of the client's own drawings: shot, burst, dash, star, clock,
; heart, boot, plus, times. An unknown one gets a plain lozenge rather than a gap.
; ---------------------------------------------------------------------------

DungeonPowers Draft
  ; Cards per level. Three is a choice; two is a coin, and five is a menu.
  OfferCount = 3
  ; How far powers may sharpen a cooldown, as a percentage of what it started at.
  ; A skill castable every frame is not a skill, and this file is free to stack
  ; one too far by accident.
  MinCooldownPercent = 25
End

