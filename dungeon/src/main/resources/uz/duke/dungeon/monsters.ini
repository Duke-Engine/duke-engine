Object Archer
  DisplayName = Archer
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 3
  GeometryHeight = 12
  VisionRange = 150
  Body = GrowableBody Tag
    ; Feeble once reached — closing the distance is the answer to it.
    MaxHealth = 40
  End
  Update = MoveUpdate Tag
    Speed = 24
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    Damage = 9
    ; Must exceed its CloseDistance in dungeon.ini, or it would stop out of its
    ; own range and stand there harmlessly.
    AttackRange = 70
    ReloadFrames = 40
  End
  Update = Script:ArcherBrain Tag
  End
  Behavior = ExperienceModule Tag
    ExperienceValue = 18
    ExperienceRequired = 0 0 0
  End
End

Object Revenant
  DisplayName = Revenant
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 4
  GeometryHeight = 13
  VisionRange = 90
  Body = GrowableBody Tag
    MaxHealth = 90
  End
  Update = MoveUpdate Tag
    Speed = 24
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    Damage = 8
    AttackRange = 10
    ReloadFrames = 32
  End
  ; The whole character of it: leave it alive and the fight resets.
  Update = AutoHealUpdate Tag
    HealPerSecond = 7
  End
  Update = Script:RevenantBrain Tag
  End
  Behavior = ExperienceModule Tag
    ExperienceValue = 24
    ExperienceRequired = 0 0 0
  End
End

Object Boss
  DisplayName = Boss
