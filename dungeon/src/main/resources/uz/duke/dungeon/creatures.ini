; Duke Dungeon — what lives in the dungeon.
;
; Read by the engine's own INI loader (ThingTemplateLoader), the same one that
; reads any duke-engine game's units. Editing the numbers here changes the game
; without recompiling it; the behaviour scripts referenced below are registered
; by the game at startup.
;
; These are the creatures at the start of a run. What the hero becomes as he
; kills is in dungeon.ini under DungeonLeveling — level 1 grants nothing, so
; this file reads as the starting hero rather than as the hero minus a level.
;
; Companion file: dungeon.ini, which holds the tuning that is not a unit stat —
; how the dungeon is generated and how far a skeleton notices the hero.

Object Hero
  DisplayName = Hero
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 4
  GeometryHeight = 12
  ; How far he sees — and, because it is the same number, how far the dungeon
  ; opens up around him. Everything beyond it is black: not the walls, not the
  ; floor, not what is standing on it. This used to be 600, which reaches the far
  ; corner of a 500x360 map, so the whole floor was laid out in front of the
  ; player before he took a step and there was nothing to discover.
  ;
  ; A little over one room (rooms are 50-90 units across) and deliberately less
  ; than SkeletonSenseRadius: a skeleton notices him before he can see it, so
  ; things come out of the dark rather than being watched approaching.
  VisionRange = 80
  ; HeroBody rather than the engine's ActiveBody: this one can grow, because the
  ; whole game is him becoming harder to kill. See uz.duke.dungeon.level.
  Body = GrowableBody Tag
    ; Low enough that a careless walk into a second room can end the run.
    MaxHealth = 550
  End
  Update = MoveUpdate Tag
    Speed = 45
    ; 0 = turn on the spot. TurnRate is SAGE's tank parameter: a positive rate
    ; makes a thing rotate toward its goal and curve along its facing, which is
    ; right for a vehicle and wrong for a man — sent back the way he came, the
    ; hero drove a wide arc instead of turning round.
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    Damage = 14
    ; A bow. It has to stay inside VisionRange above, or he would be shooting
    ; into the dark at things the fog has not shown him — the weapon does not
    ; consult the fog, so the two numbers keep each other honest.
    ;
    ; Everything down here reaches 8 to 14, so he outranges the dungeon roughly
    ; five times over. That is the whole shape of playing him: he wins at
    ; distance and loses once anything arrives.
    AttackRange = 70
    ; Slower than a fist was. A longbow that fired twice a second would make the
    ; range free rather than earned.
    ReloadFrames = 24
  End
  ; Walks to whatever he is told to attack — see HeroBrain.
  Update = Script:HeroBrain Tag
  End
  ; Q, W, E and R. Which four they are is not written here: this line says he has
  ; skills, and dungeon.ini's DungeonSkill blocks say which. A second hero gets
  ; the same line and his own blocks.
  Update = SkillBook Tag
  End
  ; Counts what he kills. He is worth nothing himself, and the engine's own four
  ; ranks are switched off (0 0 0), leaving a plain experience total for the game
  ; to spend on levels of its own devising.
  Behavior = ExperienceModule Tag
    ExperienceValue = 0
    ExperienceRequired = 0 0 0
  End
End

Object Skeleton
  DisplayName = Skeleton
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 4
  GeometryHeight = 12
  VisionRange = 90
  Body = ActiveBody Tag
    MaxHealth = 60
  End
  Update = MoveUpdate Tag
    ; Slower than the hero on purpose: breaking off a fight has to be possible.
    Speed = 26
    ; Turns on the spot, for the same reason the hero does — a skeleton that
    ; banked like a vehicle would circle the hero instead of closing on him.
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    Damage = 7
    AttackRange = 10
    ReloadFrames = 30
  End
  ; Comes for the hero when it notices him — see SkeletonBrain.
  Update = Script:SkeletonBrain Tag
  End
  ; What killing one is worth to the hero. Its own ranks are switched off too.
  Behavior = ExperienceModule Tag
    ExperienceValue = 10
    ExperienceRequired = 0 0 0
  End
End
