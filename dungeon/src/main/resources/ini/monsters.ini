; Duke Dungeon — the monsters.
;
; One template per kind named in dungeon.ini. The behaviour tag is the kind's
; name plus "Brain", and the game wires those up from that list — so a new
; monster is a block in dungeon.ini and a template here, with no Java either way.
;
; Every one carries GrowableBody rather than the engine's ActiveBody: depth
; raises their health after they are built, and ActiveBody fixes its maximum at
; construction, correctly, for a game where a rifleman is always a rifleman.
;
; The ordinary Skeleton lives in creatures.ini beside the hero, as the baseline
; everything here is measured against.

Object Runner
  DisplayName = Runner
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 3
  GeometryHeight = 9
  VisionRange = 85
  Body = GrowableBody Tag
    MaxHealth = 30
  End
  Update = MoveUpdate Tag
    ; Faster than the hero, which is the whole point of it: you cannot walk away.
    Speed = 34
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    Damage = 4
    AttackRange = 8
    ReloadFrames = 22
  End
  ; Tells the brain the frame a blow landed, so it stands and finishes the swing
  ; instead of walking off mid-blow. It launches nothing -- see Swing.
  Update = Swing Tag
  End
  ; Timers for the statuses it is wearing -- the engine's own, and today that
  ; means SLOWED. MoveUpdate already halves the step of anything wearing it, and
  ; StatusUpdate already counts it down and takes it off, so a monster that
  ; carries this thaws by itself whether or not whoever chilled it is still alive.
  Update = StatusUpdate Tag
  End
  Update = Script:RunnerBrain Tag
  End
  Behavior = ExperienceModule Tag
    ExperienceValue = 8
    ExperienceRequired = 0 0 0
  End
End

