Object Stalker
  DisplayName = Stalker
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 3
  GeometryHeight = 12
  VisionRange = 98
  Body = GrowableBody Tag
    ; Frail. It reaches you first; it should not also survive the exchange.
    MaxHealth = 40
  End
  Update = MoveUpdate Tag
    Speed = 16
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    ; Hits harder than the ordinary one, because it is frail and dies quickly
    ; once anything reaches it.
    Damage = 12
    ; A crossbow. Well short of the hero's 60, on purpose: he should be able to
    ; open the exchange and win it by keeping his distance, and lose it by being
    ; caught in the open at forty units.
    AttackRange = 52
    ; Slow to wind. A crossbow that fired as often as a skeleton swings would
    ; make standing still impossible, which is the hero's whole game.
    ReloadFrames = 70
    ; A crossbow is levelled standing still, like the hero's bow.
    AttackOnTheMove = No
  End
  ; Its bolts leave the crossbow and have to get there -- the same module the
  ; hero's bow uses, saying which projectile of its own it looses.
  Update = Bow Tag
    Projectile = Bolt
    Speed = 150
    ; Out at the crossbow rather than at the middle of the ribcage. Its own
    ; radius is 3, so five left the bolt starting inside it and squeezing out.
    MuzzleOffset = 9
  End
  ; And it shoots at what it can SEE. Not decoration: the engine's weapon knows
  ; nothing about walls, so the first thing down here with a reach worth the name
  ; would otherwise shoot the hero through the stone between them -- which is the
  ; one thing a dungeon must not allow. The hero has carried this since he had a
  ; bow; this is the same rule for the first monster to need it.
  Update = EyesOnly Tag
  End
  ; Tells the brain the frame a blow landed, so it stands and finishes the shot
  ; instead of walking off mid-shot. It launches nothing -- see Swing.
  Update = Swing Tag
  End
  ; Timers for the statuses it is wearing -- the engine's own, and today that
  ; means SLOWED. MoveUpdate already halves the step of anything wearing it, and
  ; StatusUpdate already counts it down and takes it off, so a monster that
  ; carries this thaws by itself whether or not whoever chilled it is still alive.
  Update = StatusUpdate Tag
  End
  Update = Script:StalkerBrain Tag
  End
  Behavior = ExperienceModule Tag
    ExperienceValue = 18
    ExperienceRequired = 0 0 0
  End
End

Object Revenant
  DisplayName = Revenant
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 4
  GeometryHeight = 13
  VisionRange = 58
  Body = GrowableBody Tag
    MaxHealth = 90
  End
  Update = MoveUpdate Tag
    Speed = 16
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    Damage = 8
    ; It throws fire rather than walking up. Shorter than the crossbow: this one
    ; is dangerous because it will not die, not because it reaches.
    AttackRange = 46
    ReloadFrames = 58
    AttackOnTheMove = No
  End
  ; A small one, and small on purpose -- this is its ordinary attack.
  Update = Bow Tag
    Projectile = Fireball
    ; Slower than a bolt, so it can be seen coming and walked out from under.
    Speed = 95
    ; Out at the end of the staff, not out of its chest.
    MuzzleOffset = 8
  End
  ; It throws at what it can see, for the same reason the crossbow shoots at it.
  Update = EyesOnly Tag
  End
  ; The whole character of it: leave it alive and the fight resets.
  Update = AutoHealUpdate Tag
    HealPerSecond = 7
  End
  ; Tells the brain the frame a blow landed, so it stands and finishes the swing
  ; instead of walking off mid-blow. It launches nothing -- see Swing.
  Update = Swing Tag
  End
  ; Timers for the statuses it is wearing -- the engine's own, and today that
  ; means SLOWED. MoveUpdate already halves the step of anything wearing it, and
  ; StatusUpdate already counts it down and takes it off, so a monster that
  ; carries this thaws by itself whether or not whoever chilled it is still alive.
  Update = StatusUpdate Tag
  End
  Update = Script:RevenantBrain Tag
  End
  Behavior = ExperienceModule Tag
    ExperienceValue = 24
    ExperienceRequired = 0 0 0
  End
End

; The one that casts. Frail, slow, and dangerous only at a distance: between its
; fireballs it throws the Revenant's small fire, and the fireball is a skill its
; brain decides to throw -- see DungeonMonster SkeletonMage and DungeonSkill
; SkeletonMage Q in dungeon.ini.
Object SkeletonMage
  DisplayName = Skeleton Mage
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 4
  GeometryHeight = 13
  VisionRange = 64
  Body = GrowableBody Tag
    MaxHealth = 40
  End
  Update = MoveUpdate Tag
    ; Slower than any hero, so the one it is backing away from can catch it.
    Speed = 13
    TurnRate = 0
  End
  ; Its ordinary fire, for while the fireball comes back: weak, and reaching the far
  ; edge of the band it keeps (KeepDistance 35 55), so it is never standing about.
  Update = WeaponUpdate Tag
    Damage = 6
    AttackRange = 58
    ReloadFrames = 54
    AttackOnTheMove = No
  End
  ; That it has skills. Which ones is dungeon.ini's business, under its name.
  Update = SkillBook Tag
  End
  ; Before the Bow, because a shot goes to the first launcher that takes it. Swing
  ; only notes the frame and passes it on, which is how the brain knows a throw is
  ; still leaving and holds its fireball until it has.
  Update = Swing Tag
  End
  ; The Revenant's small fire, which has to get there.
  Update = Bow Tag
    Projectile = Fireball
    Speed = 95
    MuzzleOffset = 8
  End
  ; And only at what it can see.
  Update = EyesOnly Tag
  End
  Update = StatusUpdate Tag
  End
  Update = Script:SkeletonMageBrain Tag
  End
  Behavior = ExperienceModule Tag
    ExperienceValue = 20
    ExperienceRequired = 0 0 0
  End
End

; ---------------------------------------------------------------------------
; The four at the bottom of the four floors.
;
; One each, in the order DungeonDepth Descent names them, and the last of them is
; the end of the game rather than the door to another floor. That is why there
; are four rather than one: a descent with no bottom asks only how much further,
; and four named things to get past is a route with an end on it.
;
; They climb, and the depth multiplier climbs under them (BossHealthPercentPerDepth
; and its neighbours), so what is written here is the shape of the fight rather
; than its difficulty -- the Warden is met at depth 1 where the multiplier is 1,
; and the Champion at depth 4 where it is 2.2.
;
; Each is one of the pack's four skeletons, worn large. The pack ships one
; texture, so what tells them apart is the model, the size and the tint.
; ---------------------------------------------------------------------------

Object Warden
  ; The first, and the one that teaches what a boss is: big, slow, and nothing
  ; else. Everything it does, an ordinary skeleton does smaller.
  DisplayName = Warden
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 7
  GeometryHeight = 18
  VisionRange = 130
  Body = GrowableBody Tag
    MaxHealth = 300
  End
  Update = MoveUpdate Tag
    Speed = 12
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    Damage = 16
    AttackRange = 13
    ReloadFrames = 36
  End
  ; Tells the brain the frame a blow landed, so it stands and finishes the swing
  ; instead of walking off mid-blow. It launches nothing -- see Swing.
  Update = Swing Tag
  End
  ; Timers for the statuses it is wearing -- the engine's own, and today that
  ; means SLOWED. MoveUpdate already halves the step of anything wearing it, and
  ; StatusUpdate already counts it down and takes it off, so a monster that
  ; carries this thaws by itself whether or not whoever chilled it is still alive.
  Update = StatusUpdate Tag
  End
  Update = Script:WardenBrain Tag
  End
  Behavior = ExperienceModule Tag
    ; Worth a level or two on its own — it is the gate to the next depth.
    ExperienceValue = 90
    ExperienceRequired = 0 0 0
  End
End

