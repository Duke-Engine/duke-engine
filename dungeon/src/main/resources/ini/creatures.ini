; Duke Dungeon — what lives in the dungeon.
;
; Read by the engine's own INI loader (ThingTemplateLoader), the same one that
; reads any duke-engine game's units. Editing the numbers here changes the game
; without recompiling it; the behaviour scripts referenced below are registered
; by the game at startup.
;
; These are the creatures at the start of a run. What the hero becomes as he
; kills is in dungeon.ini under DungeonLeveling — level 1 grants nothing, so
; this file reads as the starting hero rather than as the hero minus a level.
;
; Companion file: dungeon.ini, which holds the tuning that is not a unit stat —
; how the dungeon is generated and how far a skeleton notices the hero.

Object Hero
  ; The template name is Hero and stays Hero — it is what the spawner, the skill
  ; blocks and every test call him. This is what the player is told he is called.
  DisplayName = Erika
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 4
  GeometryHeight = 12
  ; How far he sees — and, because it is the same number, how far the dungeon
  ; opens up around him. Everything beyond it is black: not the walls, not the
  ; floor, not what is standing on it. This used to be 600, which reaches the far
  ; corner of a 500x360 map, so the whole floor was laid out in front of the
  ; player before he took a step and there was nothing to discover.
  ;
  ; Further than anything down here can sense him — the largest is 55 — because
  ; an archer who cannot see past the range at which he is noticed has no range
  ; at all. He opens the exchange; they answer it.
  VisionRange = 70
  ; HeroBody rather than the engine's ActiveBody: this one can grow, because the
  ; whole game is him becoming harder to kill. See uz.duke.dungeon.level.
  Body = GrowableBody Tag
    ; Low enough that a careless walk into a second room can end the run.
    MaxHealth = 550
  End
  Update = MoveUpdate Tag
    Speed = 29
    ; 0 = turn on the spot. TurnRate is SAGE's tank parameter: a positive rate
    ; makes a thing rotate toward its goal and curve along its facing, which is
    ; right for a vehicle and wrong for a man — sent back the way he came, the
    ; hero drove a wide arc instead of turning round.
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    Damage = 14
    ; A bow, and it is now free of VisionRange above rather than kept politely
    ; below it. It used to have to stay inside his sight, because nothing checked
    ; the distance and the two numbers were left to keep each other honest; miss
    ; that and he shot into the dark at things the fog had never shown him.
    ; EyesOnly checks it — near enough, nothing between, nothing standing higher
    ; — so this may be raised as far as the fight wants it.
    ;
    ; Longer than any monster's SenseRadius (the largest is 55), so he can open
    ; fire on something that has not noticed him. Everything down here reaches 8
    ; to 14 with its own weapon, so he outranges the dungeon many times over:
    ; that is the whole shape of playing him — he wins at distance and loses the
    ; moment anything arrives.
    ;
    ; Shooting is not free, though. A monster that is hit comes for whoever hit
    ; it from wherever it is standing, sense radius or no sense radius — see
    ; MonsterBrain. The first arrow starts the fight; it does not avoid it.
    AttackRange = 60
    ; Slower than a fist was. A longbow that fired twice a second would make the
    ; range free rather than earned.
    ReloadFrames = 24
    ; A bow is drawn standing still. He walks or he shoots, never both — which is
    ; what makes his range something he has to hold rather than something he keeps
    ; while retreating for ever. He carries on reloading on the way, and keeps
    ; whatever he was pointed at, so the shot leaves the moment he stops.
    AttackOnTheMove = No
  End
  ; His shots leave the bow and have to get there — see uz.duke.dungeon.combat.
  Update = Bow Tag
  End
  ; He shoots at what he can see. This also switches the engine's own target
  ; acquisition off for him -- it is a nearest-enemy search that knows nothing
  ; about walls -- and hands the choosing to HeroBrain, which does. Monsters do
  ; not carry it: they fight at arm's length, with nothing in between.
  Update = EyesOnly Tag
  End
  ; Walks to whatever he is told to attack — see HeroBrain.
  Update = Script:HeroBrain Tag
  End
  ; Q, W, E and R. Which four they are is not written here: this line says he has
  ; skills, and dungeon.ini's DungeonSkill blocks say which. A second hero gets
  ; the same line and his own blocks.
  Update = SkillBook Tag
  End
  ; Counts what he kills. He is worth nothing himself, and the engine's own four
  ; ranks are switched off (0 0 0), leaving a plain experience total for the game
  ; to spend on levels of its own devising.
  Behavior = ExperienceModule Tag
    ExperienceValue = 0
    ExperienceRequired = 0 0 0
  End
End

; ---------------------------------------------------------------------------
; The second hero, and deliberately the first one's opposite.
;
; The archer wins at distance and loses the moment anything arrives. This one has
; no distance to win at: everything he does happens at arm's length, so the whole
; of playing him is deciding when to walk into a room rather than where to stand
; outside it. Nearly every number below is that one sentence, said in figures.
;
; Which of the two is played is DefaultHero in dungeon.ini. There is no choosing
; screen yet; this is what makes him playable enough to be balanced.
;
; He is NOT a stronger archer. Twice the health and two thirds of the range is a
; different game, not a better hero — and if he ends up simply better, the two
; numbers to look at are AttackRange and Speed, because those are the ones that
; decide whether a mistake can be walked away from.
; ---------------------------------------------------------------------------

Object Knight
  DisplayName = Garen
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  ; Wider than the archer, which is not decoration: a body's radius is what the
  ; pathfinder steers round and what a monster has to reach past. A man in plate
  ; takes up more doorway.
  GeometryMajorRadius = 5
  GeometryHeight = 12
  ; Shorter sight than the archer's 70, and it costs him something real: the
  ; ground opens up around this number, so he walks into rooms he has seen less
  ; of. He does not need the reach — nothing he owns can hit that far — and an
  ; archer's eyes on a swordsman would be map knowledge he has not earned.
  VisionRange = 52
  Body = GrowableBody Tag
    ; Nearly twice the archer's 550, and the first half of why he can stand in a
    ; room. The second half is ArmourPercent in dungeon.ini, which is a separate
    ; axis: health is how long he lasts, armour is how much each blow is worth.
    MaxHealth = 980
  End
  Update = MoveUpdate Tag
    ; Slower than 29, and this is the price of the rest of the page. He cannot
    ; leave a fight he has walked into, so walking in has to be a decision.
    Speed = 21
    ; 0 = turn on the spot, as the archer does. See the note in his block: a
    ; positive rate is SAGE's vehicle behaviour and makes a man drive in arcs.
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    ; Twice the archer's 14 a swing, and slower with it: 34 frames against 24.
    ; Worked out, that is 0.88 a frame against his 0.58 -- about half again as
    ; much damage over time, not the same amount in heavier pieces. The extra is
    ; deliberate and it is what he is paid for standing in range: everything he
    ; hits is hitting him back for the whole of it, which is not true of a single
    ; arrow the archer looses from across the room.
    ;
    ; If he turns out to be simply better, this is the second number to cut --
    ; after Speed, and before AttackRange, which is the one that makes him him.
    Damage = 30
    ; A sword. The whole of the difference: 11 against the archer's 60, which is
    ; inside every monster's own reach rather than far outside it, so he is being
    ; hit for the whole of the time he is hitting.
    AttackRange = 11
    ReloadFrames = 34
    ; He swings as he closes, unlike a drawn bow — a swordsman who had to stop
    ; before every blow would never land one on anything that was backing away.
    AttackOnTheMove = Yes
  End
  ; No Bow and no EyesOnly: both are the archer's, and both are about a shot that
  ; has to cross a room. EyesOnly would also switch off the engine's own target
  ; acquisition, which is exactly what a creature fighting at arm's length wants
  ; left on -- there is nothing between him and what he is hitting.
  ;
  ; Walks to whatever he is told to attack — see HeroBrain, which both heroes use.
  Update = Script:HeroBrain Tag
  End
  ; Q, W, E and R. Which four is in dungeon.ini under his own name, exactly as the
  ; archer's are under his: this line only says that he has skills.
  Update = SkillBook Tag
  End
  Behavior = ExperienceModule Tag
    ExperienceValue = 0
    ExperienceRequired = 0 0 0
  End
End

Object Skeleton
  DisplayName = Skeleton
  KindOf = INFANTRY SELECTABLE CAN_ATTACK
  Geometry = CYLINDER
  GeometryMajorRadius = 4
  GeometryHeight = 12
  VisionRange = 58
  Body = ActiveBody Tag
    MaxHealth = 60
  End
  Update = MoveUpdate Tag
    ; Slower than the hero on purpose: breaking off a fight has to be possible.
    Speed = 17
    ; Turns on the spot, for the same reason the hero does — a skeleton that
    ; banked like a vehicle would circle the hero instead of closing on him.
    TurnRate = 0
  End
  Update = WeaponUpdate Tag
    Damage = 7
    AttackRange = 10
    ReloadFrames = 30
  End
  ; Comes for the hero when it notices him — see SkeletonBrain.
  ; Tells the brain the frame a blow landed, so it stands and finishes the swing
  ; instead of walking off mid-blow. It launches nothing -- see Swing.
  Update = Swing Tag
  End
  Update = Script:SkeletonBrain Tag
  End
  ; What killing one is worth to the hero. Its own ranks are switched off too.
  Behavior = ExperienceModule Tag
    ExperienceValue = 10
    ExperienceRequired = 0 0 0
  End
End

; An arrow in flight. Not a creature so much as a thing on its way somewhere:
;
;   - no Body, so no weapon will ever acquire it as a target
;   - no Geometry, so it passes through the world instead of shouldering
;     monsters aside on its way past
;
; Both of those are absences rather than settings, which is why they are written
; down: nothing in the file says "arrows are not shot at", and the reason they
; are not is that there is no Body line below.
Object Arrow
  DisplayName = Arrow
  VisionRange = 0
  Update = ArrowUpdate Tag
  End
End

; What a dead monster leaves on the floor.
;
; Not a creature so much as a thing lying there, and the absences say so:
;
;   - no Body, so no weapon will ever shoot at it
;   - no Geometry, so it does not shoulder anything aside or block a corridor
;   - no CAN_ATTACK and nothing to attack with
;
; STRUCTURE is what makes the client draw it as a box on the floor rather than as
; a creature, and gives it a bigger dot on the minimap -- which is the point of a
; chest, since walking over to one is the decision it asks for.
Object Chest
  DisplayName = Chest
  KindOf = STRUCTURE
  VisionRange = 0
  Update = LootUpdate Tag
  End
End

; The drawn shot. Exactly the same creature — no body, no geometry, so nothing
; can shoot it and it passes through the world — and the same ArrowUpdate flies
; it. What differs is what carries it here (a skill, not the bow), how hard it
; hits, and how it is drawn; see HeavyScale and HeavySpeed in dungeon.ini.
Object HeavyArrow
  DisplayName = Heavy Arrow
  VisionRange = 0
  Update = ArrowUpdate Tag
  End
End

; The crossbow skeleton's bolt and the mage's fire. The same creature again --
; no body, no geometry, one ArrowUpdate -- because what a thing in flight IS has
; nothing to do with what threw it or what it looks like on the way.
Object Bolt
  DisplayName = Bolt
  VisionRange = 0
  Update = ArrowUpdate Tag
  End
End

Object Fireball
  DisplayName = Fireball
  VisionRange = 0
  Update = ArrowUpdate Tag
  End
End

; The one the Necromancer throws: the same creature again, drawn three times the
; size. A separate template rather than a number on the thrower, because how big
; a thing is drawn belongs to the thing.
Object GreaterFireball
  DisplayName = Fireball
  VisionRange = 0
  Update = ArrowUpdate Tag
  End
End
