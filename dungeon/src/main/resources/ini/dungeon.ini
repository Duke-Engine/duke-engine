DungeonEffect MeteorWarning
  ; The mark, and then the landing. One block for both because they are one
  ; object at two moments: it glows on the floor for the second and a half it is
  ; falling, and the IMPACT_BURST is what happens when it stops existing.
  ;
  ; ★ The light is the warning. In a dark room a patch of floor going orange is
  ; read long before any outline is, which is why this is the one ground effect
  ; that is allowed a light of its own.
  Kind = GLOW_ORB
  Kind = IMPACT_BURST
  Colour = 0xFF7A2A
  FadeColour = 0x400800
  LightColour = 0xFF4A10
  LightPower = 2.8
  LightRadius = 90
  ; Wide and flat-looking, standing where it will land.
  OrbSize = 3.4
  Particles = 0
  ParticleSize = 0
  ParticleLife = 0
  Spread = 0
  ; And an enormous one when it arrives -- this is the biggest number in the
  ; game landing, and it should be the biggest thing on the screen.
  BurstParticles = 72
  BurstSize = 7.5
  BurstSeconds = 0.55
  ; The ring it throws out when it lands, drawn by the thing ARRIVING rather
  ; than by the man who called for it -- so it happens whether or not he lived
  ; to see it. The widest and the heaviest on the page, which is the whole point
  ; of an ultimate: it should be the biggest thing on the screen for half a
  ; second and then be over.
  Kind = SHOCKWAVE
  WaveFrom = 6
  WaveTo = 52
  WaveSeconds = 0.50
  WaveEase = 2.8
  WaveEdge = 1.0
  WaveWash = 0.30
  ShakeSeconds = 0.26
  ShakePower = 1.8
End

