; ---------------------------------------------------------------------------
; The camera.
;
; The keys still pan and the wheel still zooms; this adds the oldest control in
; the genre on top of them, and the two work at once. Resting the cursor against
; the edge of the screen pushes the view that way, so moving it costs nothing --
; the mouse is already where the player is looking.
;
; The speed is a share of what the keys move at rather than a figure of its own,
; and the keys' speed is itself a function of how far out the camera is. So a
; shove moves the same amount of SCREEN at every zoom, instead of being right
; at one height and wrong at the others.
;
; An EdgeMargin of 0 turns it off, which is what every other game on this client
; gets unless it asks.
; ---------------------------------------------------------------------------

DungeonCamera View
  ; How close to the edge, in window pixels. Wide enough to hit without aiming,
  ; narrow enough not to fire while crossing the screen.
  EdgeMargin = 14
  EdgeSpeedPercent = 100
End

; ---------------------------------------------------------------------------
; The flash that answers a click.
;
; Three arrowheads set a third of a turn apart, points inward, closing on the
; spot and going out as they arrive. It is the only thing in the game that talks
; back to the player in the moment between his click and anything happening, so
; it is worth more care than its size suggests: the shape says WHERE by aiming at
; it from three sides, and the movement says NOW without lasting long enough to
; clutter a fight.
;
; Three of these numbers do nearly all the work, and all three look like fussing
; until you have seen them wrong:
;
;   EasePower  -- arrowheads closing at a constant speed read as machinery. Real
;                 things arrive: fast at first, slowing as they land.
;   FadeFrom   -- fading from the first frame gives a mark that is half gone
;                 before it has said anything. It should travel at full strength
;                 and go out over the last stretch.
;   SpinDegrees-- a few degrees over the whole flight. Nobody consciously sees
;                 it; everybody notices the absence of it.
;
; Tune by eye -- nothing here needs a rebuild.
; ---------------------------------------------------------------------------

DungeonOrderMark Flash
  ; A cell is 10 across and the hero is 4 wide, so this opens about a room's
  ; doorway and closes to roughly his own footprint.
  StartRadius = 7
  ; Not zero, or the last frame is three shapes on top of each other.
  EndRadius = 1

  ; Short. Long enough to read across a lit room, gone before the next click.
  Seconds = 0.40

  ; One arrowhead: point to back edge, and across the back.
  Size = 3.5
  Width = 3.0

  ; Clear of the floor it is drawn on and not visibly above it. Any lower and it
  ; fights the floor for the same pixels; any higher and it hovers.
  Height = 0.25

  ; 1 is a straight line and looks mechanical; 3 is about right.
  EasePower = 3.0
  ; Full strength for the first 60% of the flight, out over the last 40%.
  FadeFrom = 0.6
  ; Small on purpose. This is life, not a pirouette.
  SpinDegrees = 22

  ; Drawn additively, so over 1 is what lets it read through torchlight and fog
  ; without being a lamp. Past about 2.5 it stops being a colour and goes white.
  Brightness = 1.6

  ; An order given TO SOMEBODY is not the same answer as an order given to a
  ; piece of floor, so it is not the same picture. The arrowheads say "there";
  ; a creature needs "THAT ONE", and arrowheads closing on something that is
  ; about to walk out from under them say it badly. So an attack is a ring round
  ; the creature that goes hard on and hard off -- the oldest way of picking one
  ; thing out of a crowd of them, and still the one the eye finds fastest. A
  ; gentle fade in the middle of a fight is a thing nobody sees.
  ;
  ; Two blinks: one reads as a glitch, three reads as a warning light.
  RingRadius = 7
  Blinks = 2

  MoveColour = 0x3CFF6E
  AttackColour = 0xFF4436
End

; ---------------------------------------------------------------------------
; The ring a skill draws while it is being aimed.
;
; It answers three questions the player otherwise has to answer by SPENDING the
; skill: how far does this reach, can I hit that from here, and -- for anything
; that flies -- which way will it go. A cooldown makes guessing expensive, so
; guessing is the thing to remove.
;
; One look for every skill in the game, on purpose. The player learns the
; drawing once -- a dashed ring is a reach, a filled disc is what something will
; cover, a lane is where something will fly, red means the click is refused --
; and from then on a skill he has never used answers his questions too. Four
; sets of colours would mean learning four pictures instead of one language.
;
; WHICH picture a skill gets is not written here: it follows from what the skill
; asks the player to point at, which the effect already knows. See SkillEffect
; and SkillRange.Shape.
;
;   STRIKE        -> a ring at its Range; point at a creature inside it
;   AREA_AT_SPOT  -> that ring, plus a disc of its Radius under the cursor
;   SKILLSHOT     -> a lane, Range long and Radius wide, pointed where you point
;   DASH          -> a ring at its Distance. No second circle: it leaves a man
;                    where it lands, and a man-sized ring says nothing the
;                    pointer had not already said
;   AREA_DAMAGE   -> one ring at its Radius, round him. Held, not aimed
;   EMPOWER       -> a tight ring, SelfRadius across: this one is only for him
;
; The last two are cast by LETTING GO of the key rather than by pressing it, so
; that a skill with nothing to point at can still be looked at before it is
; spent. A tap is still a cast.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; The mage's four.
;
; He is the first hero whose skills ARE the hero. The archer's four make his bow
; better and the knight's get him to the fight and keep him alive in it; these
; four are where all of the mage's damage lives, which is why his weapon in
; creatures.ini is the feeblest thing on that page.
;
; The bargain is written in the cooldowns. Nothing here comes back quickly --
; the shortest is five seconds against the knight's two and a half -- and in
; exchange every one of them covers ground. Between them he is a hero who is
; either about to do something enormous or is holding four empty slots and 380
; health, and choosing which is the whole of playing him.
;
; Three of the four are new shapes and each one is a decision worth reading:
;
;   SKILLSHOT with a Radius -- a shot that flies down a lane AND bursts where it
;     stops. The Radius used to mean nothing to a skillshot; now it is the
;     burst, so an arrow is the same effect with the number left out.
;   AREA_DAMAGE with SlowFrames -- the blast he already had, with one more thing
;     true of it. The knight's whirlwind says nothing about SlowFrames and is
;     therefore exactly the skill it was.
;   BLINK -- not a fast DASH. A dash travels, is stopped by the first wall, and
;     can be made to hurt what it crosses; this crosses nothing at all. That is
;     what he is buying: the right to ignore the thing in the doorway.
;   METEOR -- an area blast with a pause in the middle, and the pause IS the
;     skill. See the note on it below.
;
; NO ICONS NAMED YET. A slot with no picture draws the letter of its key, which
; is what every slot did before there were pictures -- so he is playable now and
; the four lines are added when the files are.
; ---------------------------------------------------------------------------

DungeonSkill Mage Q
  ; Fireball. His bread and butter and the only one of the four he casts every
  ; fight: a ball thrown down a line that stops at the first body or the first
  ; wall, and takes whoever is standing near that with it.
  ;
  ; SKILLSHOT rather than STRIKE, and that is the difference between him and the
  ; archer in one word. A strike is clicked on a monster and cannot miss; this is
  ; aimed at a PLACE and forgets it at once, so reading where a skeleton is going
  ; is the skill. Hitting three of them with it is a better cast than hitting one,
  ; and nothing about the cast says which it will be.
  ;
  ; Range is how far it flies before it is spent; Radius is the burst where it
  ; stops. The one it actually hit takes the full figure and is NOT hit twice.
  Effect = SKILLSHOT
  Damage = 55
  DamagePerLevel = 9
  ; ★ SHORTENED from 90. At ninety he threw it further than the rogue's bow
  ; reaches (60) and nearly as far as his aimed shot (68), which made the
  ; squishiest hero in the game also the one who never had to be in the room.
  ; 64 is a long throw that still asks him to come inside his own vision of 64.
  Range = 64
  ; What it takes with it where it stops. NOT the width of the shot -- that is
  ; HitWidth below, and drawing the lane at THIS was what made the indicator a
  ; band five men across.
  Radius = 26
  ; ★ How wide the ball itself is, for the lane the client draws. The shot hits
  ; whatever it comes within one frame's travel of, which at HeavySpeed = 120 is
  ; four units either side -- so eight across, and the lane now says so instead
  ; of claiming the whole blast sweeps the corridor.
  HitWidth = 8
  Projectile = MageFireball
  ; Five seconds. Short for him and long for anybody else -- the archer's Q comes
  ; back in three and the knight's in two and a half.
  CooldownFrames = 150
  CooldownPerLevel = -4
  ; Four points may go into it, and it waits for nothing but one of them.
  MaxRank = 4
  ; What it looks like going off -- see DungeonEffect MageCast.
  Look = MageCast
  Name = Olov o'qi
  Icon = skill_fire_arrow.png
  Blurb = Yo'nalish bo'ylab olov o'qi otadi. Birinchi uchragan tanaga yoki devorga urilib to'xtaydi va o'sha joyda portlaydi.
  ManaCost = 22
  ManaCostPerLevel = 2
End

DungeonSkill Mage W
  ; Frost Nova. The panic button, and the only thing he owns that answers being
  ; stood next to.
  ;
  ; The damage is not the point and the numbers say so -- 40 against Fireball's
  ; 55, at his own feet where he has to let them arrive. SlowFrames is the point:
  ; ninety frames is three seconds of everything it caught moving at half pace,
  ; which is three seconds of walking out of a room he could not otherwise have
  ; left. It is Blink's cheaper cousin and they combine, which is deliberate.
  ;
  ; The slow is the engine's own SLOWED status, worn by the monster on a timer of
  ; its own -- so it thaws whether or not the mage is still alive, and MoveUpdate
  ; halves its step without having been told anything about a mage.
  Effect = AREA_DAMAGE
  Damage = 40
  DamagePerLevel = 7
  ; Comfortably past his own body, so it catches what has closed on him rather
  ; than only what is touching him.
  Radius = 40
  SlowFrames = 90
  ; Ten seconds. The escape has to be spent rather than leaned on.
  CooldownFrames = 300
  CooldownPerLevel = -8
  ; Four points may go into it, and it waits for nothing but one of them.
  MaxRank = 4
  ; What it looks like going off -- see DungeonEffect FrostNova.
  Look = FrostNova
  Name = Muz to'lqini
  Icon = skill_frost_nova.png
  Blurb = O'zi atrofida muz portlatadi: zarar beradi va tekkanlarni bir muddat sekinlashtiradi. Zarari emas — sekinlashuvi muhim.
  ManaCost = 38
  ManaCostPerLevel = 3
End

DungeonSkill Mage E
  ; Blink. Sixty units, instantly, THROUGH whatever is in the way.
  ;
  ; The knight's W is a charge and the archer's E a sprint, and both of them
  ; travel: they walk the line a step at a time and the first wall stops them.
  ; This does not travel. A wall between here and there is simply not part of the
  ; question, which is the one thing a hero with 380 health can be sold that is
  ; worth a key of its own.
  ;
  ; It will not put him inside stone. Aimed into a wall the arrival is pulled
  ; back along the line to the last floor, and if there is none the cast is
  ; refused with the cooldown untouched rather than spent on nothing.
  ;
  ; No damage, on purpose. A blink that also hurt would be the knight's charge
  ; with the drawbacks removed.
  Effect = BLINK
  Distance = 60
  ; Twelve seconds, the longest of his three ordinary skills. It is the one that
  ; undoes a mistake, so it has to be rationed harder than the ones that make
  ; them.
  CooldownFrames = 360
  CooldownPerLevel = -10
  ; Four points may go into it, and it waits for nothing but one of them.
  MaxRank = 4
  ; What it looks like going off -- see DungeonEffect MageBlink.
  Look = MageBlink
  Name = Siljish
  Icon = skill_dash.png
  Blurb = Bir zumda boshqa joyda paydo bo'ladi. Oradagi narsa — devormi, dushmanmi — umuman ahamiyatsiz.
  ManaCost = 25
  ManaCostPerLevel = -2
End

DungeonSkill Mage R
  ; Meteor. The biggest number in the game, a second and a half after he asks
  ; for it.
  ;
  ; THE DELAY IS THE SKILL. An AREA_AT_SPOT lands the instant it is cast, so the
  ; only question it asks is where the monsters are now. This one asks where they
  ; are going to be -- and gives them the same warning it gives him, because the
  ; mark on the floor is a thing in the world rather than a hint on his screen.
  ; A skeleton that walks out of the circle has beaten the ultimate, and being
  ; able to beat it is what makes throwing it a decision.
  ;
  ; WindUpFrames is how long the ground is marked: 45 frames, a second and a
  ; half. Long enough to be read from a chair, short enough that the thing it was
  ; aimed at has not crossed the room. Shorten it and the skill stops being a
  ; prediction; lengthen it and nothing is ever standing there.
  ;
  ; Projectile names what is dropped -- MeteorMark in creatures.ini, which is the
  ; mark AND the meteor, since the two are the same object at two moments.
  Effect = METEOR
  Damage = 160
  DamagePerLevel = 28
  Range = 110
  Radius = 44
  WindUpFrames = 45
  Projectile = MeteorMark
  ; Thirty-six seconds. The knight's whirlwind is thirty and the archer's window
  ; the same; this lands more than three times a Fireball in one go, on ground
  ; the player chose, so it is rationed harder than either.
  CooldownFrames = 1080
  CooldownPerLevel = -30
  ; Half way up the ladder, as both other ultimates are.
  ; Three points, and each waits for the hero: the first at level 4, the second
  ; at 8, the third at 12. A MINIMUM rather than an appointment -- pass on it at
  ; 8 and it is still there at 9.
  MaxRank = 3
  LevelPerRank = 4
  ; What it looks like going off -- see DungeonEffect MeteorCall.
  Look = MeteorCall
  ; ★ WHAT HE IS SEEN DOING, as against what the spell does. A two-handed cast
  ; out of animations/characters/magic.glb -- the one animation in the game that
  ; belongs to a skill rather than to a creature.
  ;
  ; He is given the clip automatically because it is named here: a hero's clips
  ; are his own plus every CastAnim among his skills, so this name is written
  ; once. Writing it in his block as well would be one name in two places, which
  ; is two names as soon as somebody edits one of them.
  CastAnim = Magic_Area_Attack
  ; ★ AND HOW LONG IT TAKES, which is not the clip's own length. The clip runs
  ; 3.0s; WindUpFrames above is 45, which is 1.5s, and that is the gap between
  ; the call and the meteor arriving. Stretched to the wind-up the gesture ENDS
  ; as the rock lands and reads as having called it down. Left at its own length
  ; it runs a second and a half past the impact, which reads as a man waving at
  ; a hole in the ground.
  ;
  ; So: change WindUpFrames and change this. 0 means the clip's own length.
  CastSeconds = 1.5
  Name = Meteor
  Icon = skill_meteor.png
  Blurb = Tanlangan joyga meteor chaqiradi. U bir zumda tushmaydi: yerda ogohlantiruvchi doira paydo bo'ladi, va undan chiqib ketishga ulgurgan omon qoladi.
  ManaCost = 70
  ManaCostPerLevel = 5
End

DungeonSkillRing Look
  ; Thin enough to be a line, thick enough to survive being far away.
  BandWidth = 1.6
  ; How many straight pieces the circle is really made of.
  Segments = 96

  ; The wash inside is there to say "inside", not to hide the floor.
  FillAlpha = 0.10
  EdgeAlpha = 0.85

  ; Clear of the floor, like every other flat mark. A hair above the order mark
  ; so the two never fight for the same pixels when a click lands in a ring.
  Height = 0.3

  ; The only movement left. It opened out and turned slowly to begin with, which
  ; is what the genre does and which was wrong here: an indicator is a ruler, and
  ; a ruler that is still settling is a ruler you have to wait for. It appears at
  ; its size and stands still. The breath is what keeps it reading as live rather
  ; than painted on -- set PulseDepth to 0 for a ring that does not move at all.
  PulseDepth = 0.25
  PulsePerSecond = 1.4

  ; A skill that only touches the caster has no reach to draw, so the ring has to
  ; be some size -- and the size that says "only me" is HIS size and barely more.
  ; His body is 4 across, so this is a ring drawn against him. Anything larger
  ; reads as an area, which is the one thing it is not.
  SelfRadius = 5

  ; Added rather than blended, so over 1 is what lets it read through torchlight.
  Brightness = 1.5

  ; ★ THE SAME CYAN THE ARMED SLOT IS DRAWN IN, so the panel and the floor say
  ; the same thing in the same word: cyan means "you are choosing where this
  ; goes". It used to be a blue on the floor and gold on the bar, which is two
  ; languages for one moment -- and the gold was worse than merely different,
  ; because gold is the bar's own colour and an armed slot drawn in it says
  ; "slightly more gold than usual".
  ;
  ; Cold on purpose. Everything down here is stone, torch and gold, all of them
  ; warm; a cold colour has nothing to blend into.
  ;
  ; Red is still "this will not work" -- it is the one thing that must not be
  ; mistaken for the rest, so it keeps a colour of its own.
  AllowColour = 0x35D6AE
  DenyColour  = 0xFF4436
  ; The blast, a shade off the reach ring rather than a different colour: it is
  ; part of the same aiming and reading it as a warning was the old amber's
  ; doing.
  AreaColour  = 0x9BFFE8
End

; ---------------------------------------------------------------------------
; What is left on the floor.
;
; A monster that dies may leave something behind, and walking over it is all it
; takes: there is no inventory and nothing to equip. That is deliberate -- the
; decision the loot asks for is whether to go and get it, and a second decision
; at the end of it would be a formality.
;
; What it gives is permanent for the run and gone with it, like everything else
; here. The three kinds are the same three figures a level moves: ATTACK (percent
; of his weapon), HEALTH (flat maximum health) and ARMOUR (percent taken off what
; reaches him).
;
; Which monster leaves what is drawn from the run's own seed and the monster's
; own id -- so the same seed drops the same things off the same monsters, whatever
; order the player kills them in.
;
; Deeper floors give more: an item is worth ValuePercentPerDepth more per floor,
; and MinDepth keeps the better ones out of the first rooms entirely.
; ---------------------------------------------------------------------------

DungeonLoot Drops
  ; The creature a dropped item becomes. Naming none turns loot off entirely.
  Template = Chest
  ; How often an ordinary monster leaves something. Loot that always drops is not
  ; loot, it is a tax on killing things.
  DropPercent = 18
  ; The thing guarding the way down always leaves something. It is the one fight
  ; on the floor the player cannot walk past.
  BossDropPercent = 100
  ; How close he has to walk before it is his. A cell is 10 units, so this is
  ; "standing on it" with enough margin that a fast run does not skip over it.
  PickupRange = 14
  ; What an item is worth per floor beyond the first, as a percentage of itself.
  ValuePercentPerDepth = 20
  ; How long the panel says what he found, in logic frames (30 = one second).
  NoteFrames = 90
End

; ★ A BIGGER PURSE, not a draught. Everything in his bag is permanent -- that is
; what the bag IS -- so this grows the pool rather than topping it up, and the
; topping up comes free: a pool that grows gifts what it adds, so finding one in
; a fight is a drink as well as a raise.
;
; A potion he carries and chooses to drink would be the other thing, and there is
; nothing in this game he carries and chooses to do anything with.
DungeonLootItem Manastone
  Name = Mana toshi
  Icon = flask
  Kind = MANA
  Value = 25
  Weight = 12
  MinDepth = 1
End

DungeonLootItem Blade
  Name = O'tkir tig'
  ; Which drawing goes in his bag. The client's own vocabulary, the same one a
  ; power's Icon uses -- see the list above DungeonPower.
  Icon = blade
  Kind = ATTACK
  Value = 8
  Weight = 20
End

DungeonLootItem Quiver
  Name = To'la sadoq
  Icon = shot
  Kind = ATTACK
  Value = 14
  Weight = 12
  MinDepth = 2
End

DungeonLootItem Bread
  Name = Zaxira non
  Icon = flask
  Kind = HEALTH
  Value = 40
  Weight = 20
End

DungeonLootItem Heart
  Name = Tosh yurak
  Icon = heart
  Kind = HEALTH
  Value = 90
  Weight = 12
  MinDepth = 2
End

DungeonLootItem Shield
  Name = Yorilgan qalqon
  Icon = shield
  Kind = ARMOUR
  Value = 4
  Weight = 16
End

DungeonLootItem Plate
  Name = Og'ir sovut
  Icon = plate
  Kind = ARMOUR
  Value = 8
  Weight = 10
  MinDepth = 3
End

; ---------------------------------------------------------------------------
; The dark.
;
; Three states, and they are meant to be told apart at a glance: never been
; there (nothing drawn at all -- not the floor, not the walls, not what is
; standing on them), been there and left (dim: the walls are still drawn so the
; way back can be found, and the engine's own fog has already taken the monsters
; out of the snapshot), and in sight now (everything).
;
; LineOfSight is the important one. Without it the light is a circle that does
; not care what it is shining through, so standing in a corridor lights the rooms
; on both sides of it and there is nothing left to discover. With it, a straight
; line is drawn from the hero to every cell and stone stops it -- the wall itself
; is seen, what is behind it is not. Pure arithmetic over the grid the pathfinder
; already keeps: no shader, and nothing the simulation can feel.
;
; Tint is what the dark is made of. Black is a hole in the screen; a cold grey
; blue is a room somebody has stopped lighting, which is the thing being drawn.
;
; How it is drawn: the dark is a TEXTURE, stretched over the whole map as one
; sheet and blended over everything under it -- floor, walls, chests, whatever is
; standing in a room he has left. It used to be a brightness per cell painted flat
; across every tile in that cell, and however carefully the cells themselves were
; softened the floor still came out as a field of ten-unit squares. A sheet has
; its own resolution and the card fills in between its texels, so the edge of the
; light is smooth at the size of a pixel rather than the size of a tile. No shader
; anywhere in it.
; ---------------------------------------------------------------------------

DungeonFog Sight
  LineOfSight = Yes
  ; The three shades, as percentages of a room in full sight. Unseen at 0 is the
  ; black a crawler wants; raise it and the whole floor plan is faintly there from
  ; the first frame, which is a different game. Remembered is low enough to read
  ; as memory rather than as light, high enough to find the way back through.
  UnseenPercent = 0
  RememberedPercent = 30
  VisiblePercent = 100
  ; How many cells the edge of the light is smeared over. One is the old hard
  ; staircase softened by a single cell; two is a torch rather than a spotlight.
  SoftenCells = 2
  ; How fast the dark gives way, as a share of what is left each second. Per
  ; second rather than per frame, or a faster machine would open the map faster.
  OpenPerSecond = 7
  ; How many texels across the sheet is, whatever size the map is. Nothing to do
  ; with cells: this is the resolution the dark is DRAWN at, and it is the number
  ; that decides whether the edge of the light is smooth or stepped. 256 over a
  ; dungeon floor is several texels to a cell. Higher costs a little more to push
  ; to the card each frame and nothing else.
  TextureSize = 256
  ; The colour of nothing: cold, and slightly blue, so unlit stone reads as stone
  ; rather than as a gap. Also the window's own background, exactly -- the sheet
  ; at full strength and the void beyond the map are the same dark, and any
  ; difference between them draws the map's outline on the screen.
  Tint = 0x121821
End

; ===========================================================================
; Where the light comes from.
;
; One sun and one flat ambient, which is all flat-shaded palette art wants. What
; they are WORTH is here, because it turned out to be a decision about how the
; game looks rather than a fact about drawing it. The first player to see this
; said the map looked flat, twice, and he was right: the sun stood nearly
; overhead, so every surface facing up caught the same light and the floor plan
; read as a picture of a floor plan.
;
; ★ PITCH IS THE ONE THAT MATTERS, and what it separates is the UPRIGHT from the
; FLAT -- a wall from the ground it stands on. It cannot separate a floor from
; the lid on top of a wall, because those are the same tile facing the same way
; and no angle of light will ever shade them differently. That is what CapTint
; is for, down in the themes.
;
; At 57 -- where this used to stand -- a floor came out at 1.09 of full
; brightness and clipped to white, while the wall beside it sat at 0.79. Flat and
; blown out at once. At 40 the floor is 0.89 and a wall facing the sun is 1.02,
; so the wall is the bright thing and the ground is what it stands on.
;
; AmbientPercent is the sun's opposite and wants reading beside it: it is the
; whole of what keeps an unlit face from being a black shape, and the whole of
; what flattens the picture again if it goes too high. At 100 every face is lit
; the same whichever way it points, which is exactly what Pitch is here to stop.
;
; Look and nothing else -- the simulation never reads a word of this.
; ===========================================================================

DungeonSun Overhead
  ; Degrees above the horizon. 90 is noon and draws no relief whatever.
  Pitch = 40
  ; Degrees round the compass, which decides which side of a wall is the lit one.
  ; Unchanged from the vector this used to be written as.
  Yaw = 219
  StrengthPercent = 100
  ; Just over half. Below about 40 the shadowed side of everything goes to a
  ; silhouette; above about 70 the relief the pitch buys is washed out again.
  AmbientPercent = 55
  ; Warm sun, cold shade. The oldest trick there is for making a flat palette
  ; look like it has air in it, and it costs nothing.
  Colour = 0xFFF7E6
  AmbientTint = 0xE6E6FF
End

; ---------------------------------------------------------------------------
; What the floor is built from.
;
; The kit is Kenney's Modular Dungeon Kit (CC0). Its pieces are a floor tile and
; walls that stand on a tile's EDGE — so a wall is drawn on the line between open
; ground and stone, which is exactly where the pathfinder stops the hero. The
; picture and the collision are then the same wall.
;
; TileSize is what the kit was modelled at. A cell is 10 world units, so a kit
; authored at 4 is scaled by 2.5 — the only number here that has to be right.
;
; Naming no Floor turns the whole thing off and the dungeon is drawn in plain
; coloured blocks again, which is what it looked like before any of this.
; ---------------------------------------------------------------------------

DungeonTiles KayKit
  Folder = models/tiles/dungeon/
  Floor = floor.gltf
  Wall = wall.gltf
  Stairs = stairs.gltf
  TileSize = 4
  ; How tall a wall piece stands, in the same units. It is what the lid over the
  ; rock is laid at: without one you look over the wall into an empty hole, and
  ; the room reads as a house with the roof off.
  WallHeight = 4
  ; This kit's wall is a slab a unit thick, centred on its own origin, so it is
  ; pushed back half a unit to put its face on the boundary. Measured off the
  ; model: x spans -2..2, z spans -0.5..0.5, y starts at 0 — so it needs no lift.
  WallShift = -0.5
  ; No corner post: this kit's corner piece is a length of wall bent round a
  ; right angle rather than the quarter-tile plug the notch wants, and a bent
  ; wall dropped into the notch stands across both walls that meet there.
End

; ---------------------------------------------------------------------------
; Where the monsters' movement comes from.
;
; The creature kit ships rigged models with no animation; the animation library
; ships animation with no creature. They meet because both were built on the same
; standard humanoid skeleton — every joint the monsters have, the library
; animates. So one library moves the whole bestiary, and a new monster needs no
; animation work at all.
;
; The clips named here are the defaults. A DungeonMonster block may name its own
; Idle, Walk, Attack or Hurt instead — the runner jogs rather than walks. Only
; the ones that need to differ do: every creature strikes the same way on
; purpose, so a blow is recognisable whichever of them threw it.
;
; Idle and Walk are STATES and loop. Attack and Hurt are MOMENTS and play once,
; over whatever the creature was doing: the blow when its weapon lets go, the
; flinch when its health drops. Nothing in a snapshot says "is swinging right
; now", and a moment played on a loop is not the same thing slower.
;
; A clip is fetched by name, so a name that is not in the library simply leaves
; that monster standing still rather than failing. The library's own names are
; listed in the pack, and DungeonMonsterArtTest checks every name against them.
;
; Naming no Library turns animation off and the monsters stand in their modelling
; pose, which is what they did before this existed.
; ---------------------------------------------------------------------------

DungeonAnimations Shared
  ; The same three libraries the hero takes his movement from, because everything
  ; on two legs down here is now built on one rig. That is not a saving so much
  ; as the reason the bestiary is worth swapping: one set of clips moves the
  ; archer, the minion and the thing at the bottom of the last floor.
  ;
  ; Repeatable, because a kit sorts its clips by what the movement is for.
  Library = animations/characters/general.glb
  Library = animations/characters/movement.glb
  Library = animations/characters/melee.glb
  ; And the ranged ones, now that two of them shoot rather than swing.
  Library = animations/characters/ranged.glb
  Idle = Idle_A
  Walk = Walking_A
  ; An overhead chop: the arm goes up and comes down. Everything down here
  ; strikes the same way, from the smallest to the boss, so a blow reads as a
  ; blow wherever it comes from — a monster that merely twitches at you does not
  ; look like it hit anything, whatever the health bar says.
  ;
  ; Played ONCE, on the frame the weapon lets go — not on a loop while the
  ; monster "is attacking", which is true from the moment it notices the hero
  ; until the fight ends. The clip used to run on its own tempo, so a monster
  ; that strikes every 1.6 seconds threw a one-second punch and none of them was
  ; the blow.
  ;
  ; One-handed, because that is what every one of them carries: a blade, an axe
  ; or a staff, hung on the bone the rig keeps for it.
  Attack = Melee_1H_Attack_Chop
  ; Played once as it falls, before the body is taken away.
  Death = Death_A
  ; Hurt = Hit_A
  ;
  ; A flinch when something takes health off it. OFF on purpose, not forgotten:
  ; a flinch and a swing are the same one-shot channel, so a monster being shot
  ; while it swings drops the swing — the hit it was landing simply stops being
  ; drawn, and hitting a monster reads as cancelling its attack. It comes back
  ; as something the player buys rather than as something every arrow does for
  ; free. Naming it here is all it takes to switch on.
End

; ---------------------------------------------------------------------------
; The hero.
;
; A different creature kit from the monsters, on a different skeleton, and the
; only thing here that carries something in its hand.
;
; He used to be described one file per movement, because an animation site hands
; its work out that way and every one of those files carries the same
; exporter-generated clip name inside it -- so the FILE was the only thing saying
; which was the run. A character KIT is the other way round: a few libraries,
; each holding dozens of clips under names that mean something. So he is named
; the way the monsters are, and AnimationsFrom is repeatable because the kit
; sorts its clips by what the movement is for.
;
; The two skeletons never meet and do not need to: a creature is animated from a
; library built on its own rig.
;
; Facing turns the model's forward onto the engine's. A quarter out and he walks
; sideways, a half out and he moonwalks — so it is here rather than in Java, and
; correcting it is an edit.
;
; Naming no Model puts him back to a coloured capsule.
;
; The block's name is the CREATURE TEMPLATE in creatures.ini it describes, and it
; is the same word his DungeonSkill blocks are headed with. Repeatable: a second
; hero is another block here, four skill blocks, a creature definition, and no
; Java. It used to be a single unnamed block whose fields were written straight
; onto the settings, so a second one would have quietly overwritten the first.
; ---------------------------------------------------------------------------

DungeonHero Rogue
  ; ★ THE ROGUE'S OWN MESH. He wore the ranger's while he was the only hero and
  ; there was nobody for him to be told apart from; three heroes out of one pack
  ; have to be three silhouettes, and the kit ships five.
  ;
  ; He is still an archer -- every clip below is a bow clip and his weapon in
  ; creatures.ini is unchanged. What the mesh decides is what he LOOKS like, and
  ; a light hooded man with a bow is a better picture of "wins at distance, dies
  ; the moment anything arrives" than the ranger was.
  Model = models/heroes/rogue.glb
  ; GeometryHeight is 12 in creatures.ini and the model boxes 2.180 tall, so
  ; 12 / 2.180 -- measured off the file, like every other number on this page.
  ; He is the SHORTEST of the three (knight 2.543, mage 2.655), so he is drawn
  ; the largest to stand the same twelve units tall as the other two.
  ModelScale = 5.50
  Facing = 90

  ; His clips come out of three libraries rather than one, because the kit sorts
  ; them by what the movement is for. Naming all three and asking for five clips
  ; costs nothing: only the ones named below are taken off a library.
  AnimationsFrom = animations/characters/general.glb
  AnimationsFrom = animations/characters/movement.glb
  AnimationsFrom = animations/characters/ranged.glb

  ; Standing with the bow rather than empty-handed, because he is holding one.
  Idle = Ranged_Bow_Idle
  ; He moves at 45 against a monster's 24 -- a walk cycle at that speed reads as
  ; skating, so he runs.
  Walk = Running_A
  ; The loose, not the draw: the arrow leaves at the start of this clip, which is
  ; the frame the simulation fires on. Ranged_Bow_Draw is the other half of the
  ; shot if that reads better, and it is one word.
  Attack = Ranged_Bow_Release
  Hurt = Hit_A
  ; Death_A falls in 0.8s; Death_B takes 2.6s, which is longer than the floor
  ; stays open after he dies.
  Death = Death_A

  ; A character kit ships its weapons apart from its characters, and its rigs
  ; carry a bone to hang them on. One rogue and a rack of weapons is every armed
  ; rogue there is; a rogue-with-a-bow is one of them. The kit also ships him a
  ; dagger and a smokebomb, if he is ever anything but an archer.
  ;
  ; The bow goes in the LEFT hand because the right draws the string. If he ends
  ; up shooting left-handed, this is the line: handslot.r.
  Holds = models/heroes/bow.gltf
  HeldIn = handslot.l
  ; Body and bow came out of the same pack at the same size.
  HeldScale = 1
  ; And half a turn about its own length, because the bone and the model disagree
  ; about which way round a bow goes.
  ;
  ; Every other weapon in the pack runs along its own +Y -- sword 1.78, dagger
  ; 1.21, staff 2.16 -- and the bow is the one that runs along +Z, 1.98 of it.
  ; The hand bone is authored for the first sort, so it stands the bow's length
  ; straight up, which is right, and then hands it over the wrong way round:
  ; measured down the length of the model, the STRING is the straight line at
  ; x = -0.33 and the grip is the bulge at +0.13, and the bone points +x at the
  ; archer. String outward, knuckles against the grip.
  ;
  ; A bow is symmetrical top to bottom, so the fix is one half-turn and nothing
  ; else needs touching.
  HeldRoll = 180

  ; ★ AND THE ARROWS FOR IT. A second Holds, which is the whole of what the
  ; repeatable form is for: a bow with no quiver is a man who has brought one
  ; shot.
  ;
  ; ★ ON THE CHEST, because this rig has exactly TWO attachment points and both
  ; of them are hands -- handslot.l and handslot.r and nothing else. There is no
  ; back slot to hang it from, so it goes on the chest bone and is pushed into
  ; place by hand. Hung there with no shift it sits INSIDE him.
  ;
  ; HeldAt is x y z in the bone's own space, and the three numbers are: a little
  ; to his right, a little up, and back behind him. The quiver is 0.93 long, so
  ; half of it clears his shoulder. HeldPitch lies it back against him rather
  ; than standing it upright like a chimney.
  ;
  ; ★ These four numbers are the ones to nudge if it floats or sinks -- they are
  ; a guess at a placement, not a measurement of one, and the only way to settle
  ; them is to look.
  Holds = models/heroes/quiver.gltf
  HeldIn = chest
  HeldScale = 1
  HeldAt = 0.12 0.10 -0.22
  HeldPitch = -20
  HeldRoll = 12

  ; He stops here and shoots, well inside the 60 his bow reaches. This is the
  ; number that decides how he is played: lower it towards 4 and he walks into
  ; everything and brawls, which is what he used to do.
  CloseDistance = 48

  ; What the panel calls him under his name. His own rather than the panel's: one
  ; line in DungeonHud was right while there was one hero, and became the
  ; archer's title on a knight the moment there were two.
  Title = O'q ustasi
  ; ★ WHAT HE CASTS OUT OF. Middling in both: he pays for what he does and gets it back
  ; at about the rate he spends it. The hero the other two are read against.
  ;
  ; ManaRegen is TENTHS of a point a second -- 50 is 5.0 a second.
  ; Tenths because a level has to be able to add less than a whole point:
  ; see ManaRegenPerLevel in DungeonLeveling.
  MaxMana = 80
  ManaRegen = 65
End

; ---------------------------------------------------------------------------
; The knight.
;
; Out of KayKit Adventurers 2.0 (CC0), the same pack all three heroes come from,
; so the
; rig matches and every clip below retargets onto him without a thing being done
; to it. His clips are the archer's three libraries plus melee.glb, which was
; already shipped and used by nobody.
;
; HE CARRIES A GREATSWORD, and that is not decoration: the pack has no
; Melee_1H_Idle, so a one-handed sword would have to stand in Melee_Unarmed_Idle
; and read as a man who has forgotten he is holding one. Two hands also suits the
; rest of him — slow, heavy, has to walk in.
;
; ★ MEASURED, NOT GUESSED. He boxes 2.543 tall against the archer's 2.275, and
; his head joint sits at 0.488 of that against the archer's 0.546 — he is a
; taller model with a proportionally smaller head. That is why his ModelScale and
; his portrait camera are not the archer's numbers, and it is the whole reason
; both are written per hero.
; ---------------------------------------------------------------------------

DungeonHero Knight
  Title = Qalqon va qilich

  ; What he shrugs off before a single level, as a percentage. Here rather than
  ; in his creature block because a hero's armour is REWRITTEN from his level and
  ; what he has found every time either changes, so a figure in the template
  ; would not survive his first level. Counted exactly like a breastplate he
  ; found, which means the file's own floor on damage taken still holds.
  ;
  ; The second half of why he can stand in a room -- MaxHealth is the first. Two
  ; axes on purpose: health is how long he lasts and this is what each blow is
  ; worth, and a monster that hits for 8 is a different problem from one that
  ; hits for 40.
  ArmourPercent = 18

  ; He reaches 11, so he walks until he is all but touching it. The archer stops
  ; at 48 and shoots; a swordsman who did that would stand there swinging at air.
  CloseDistance = 8

  Model = models/heroes/knight.glb
  ; GeometryHeight is 12 in creatures.ini and the model boxes 2.543 tall, so
  ; 12 / 2.543 -- measured, exactly as the archer's 5.3 was. Both heroes then
  ; stand the same height on screen, because both are 12 units of creature; what
  ; makes him look like a knight is the model, not the scale.
  ModelScale = 4.72
  Facing = 90

  ; The archer's three, and melee.glb on top: the swings, the blocks and the
  ; two-handed stance all live in that one and nothing used it until now.
  AnimationsFrom = animations/characters/general.glb
  AnimationsFrom = animations/characters/movement.glb
  AnimationsFrom = animations/characters/melee.glb

  ; ★ SHIELD UP. He carries a sword and a shield now rather than two hands of
  ; greatsword, so the two-handed idle -- both fists on one hilt -- would have
  ; the shield hanging off a hand that is busy.
  ;
  ; The pack has no Melee_1H_Idle, which is why he had the greatsword in the
  ; first place. Melee_Blocking is the nearest thing to a man standing behind a
  ; shield and is what his PORTRAIT already uses for exactly that reason, so the
  ; two now agree. Melee_Unarmed_Idle is the other end of it if a permanent
  ; guard reads as too tense: arms down, which with a sword and a shield in the
  ; hands is a man at rest.
  Idle = Melee_Blocking
  ; He WALKS where the archer runs, and it is the same fact as Speed = 21 said
  ; twice: a run cycle at his pace reads as skating.
  Walk = Walking_A
  ; ★ CHOSEN BY ITS LENGTH, not by its name. The client plays this once per blow,
  ; and a blow lands every ReloadFrames -- 34, which is 1.133s. This clip runs
  ; 1.100s, so the swing FINISHES and has a breath to spare before the next.
  ;
  ; Melee_2H_Attack_Chop is the obvious pick and was the first one: it runs
  ; 1.633s, half again longer than the gap between blows, so every chop was cut
  ; off at two thirds and restarted from the top. He never once finished a swing.
  ; From a chair that reads as "the animation is bad" rather than as two numbers
  ; disagreeing.
  ;
  ; The two numbers are checked against each other in the build, so changing
  ; ReloadFrames without changing this will fail rather than look bad. _Stab is
  ; 1.600s and _Spinning is 0.667s, if the pace ever changes.
  ; ★ ONE-HANDED now, and still chosen by its LENGTH. The client plays this once
  ; per blow and a blow lands every ReloadFrames -- 34, which is 1.133s. This
  ; clip runs 1.067s, so the chop FINISHES with room to spare, which is the same
  ; test the two-handed slice passed at 1.100s.
  ;
  ; The build checks the two against each other, so changing ReloadFrames
  ; without changing this fails rather than looks bad. _Slice_Diagonal is 1.000s
  ; and _Slice_Horizontal is 1.367s (too long), if the swing ever wants changing.
  Attack = Melee_1H_Attack_Chop
  Hurt = Hit_A
  ; Death_A falls in 0.8s; Death_B takes 2.6s, which is longer than the floor
  ; stays open after he dies.
  Death = Death_A

  ; ★ A ONE-HANDED sword, because the other hand now has a shield in it. The
  ; greatsword is still in the folder if he ever goes back to two hands, and
  ; going back is this line plus Idle and Attack above.
  Holds = models/heroes/sword_1handed.gltf
  HeldIn = handslot.r
  ; Body and blade came out of the same pack at the same size.
  HeldScale = 1
  ; The RIGHT hand, unlike the rogue: he draws no string, he swings. If he ends
  ; up fighting left-handed, this is the line -- handslot.l.
  ;
  ; No HeldRoll. The bow needed half a turn because it is the one weapon in the
  ; pack laid out along its own +Z; every blade runs along +Y, which is what the
  ; hand bone is authored for.

  ; ★ AND THE SHIELD, in the hand the sword is not in. It is the second half of
  ; what makes him readable across a dark room as the one who walks in: a
  ; silhouette with a slab on one arm is not mistaken for an archer.
  ;
  ; No turn, like the sword and unlike the bow. The pack authors its own props
  ; for its own hand slots, so a shield out of this kit in this kit's hand is
  ; already the right way round -- the bow is the one documented exception in the
  ; whole set, because it is the one model laid out along +Z.
  ;
  ; ★ Worth a look all the same: it is a disc rather than a length, so the rule
  ; the build checks (longest side along +Y) has nothing to say about which way a
  ; shield FACES. If it lies flat like a tray, HeldPitch = 90 is the line.
  Holds = models/heroes/shield_round.gltf
  HeldIn = handslot.l
  HeldScale = 1
  ; ★ WHAT HE CASTS OUT OF. The shallowest pool and the slowest trickle in the game, and his
  ; skills are priced to match -- see DungeonSkill Knight. He is the hero who
  ; lives off his ordinary swing, and mana is what stops him opening with all
  ; four and then doing it again.
  ;
  ; ManaRegen is TENTHS of a point a second -- 30 is 3.0 a second.
  ; Tenths because a level has to be able to add less than a whole point:
  ; see ManaRegenPerLevel in DungeonLeveling.
  MaxMana = 50
  ManaRegen = 40
End

; ---------------------------------------------------------------------------
; The mage.
;
; Out of the same KayKit Adventurers 2.0 pack (CC0) as the other two, so the rig
; matches and every clip below retargets onto him untouched. He is the TALLEST
; of the three at 2.655 against the knight's 2.543 and the rogue's 2.180, which
; is the hat: all three still stand twelve units tall in the world, because all
; three are twelve units of creature and only their ModelScale differs.
;
; His clips are the rogue's three libraries, and the third is the one that
; matters: ranged.glb holds Ranged_Magic_Raise, _Shoot, _Spellcasting,
; _Spellcasting_Long and _Summon, all of which shipped with the bow clips and
; none of which anything asked for until there was a mage.
;
; ★ He carries the staff and NOT the spellbook the kit also ships for him. Not a
; judgement -- a hero has one Holds line, so a second hand is a small feature
; rather than a setting. models/heroes/ is where spellbook_closed.gltf would go.
; ---------------------------------------------------------------------------

DungeonHero Mage
  Title = Olov va muz

  ; Almost nothing. He is the squishiest thing that has ever been playable here
  ; and the number says so out loud -- a quarter of the knight's 18, and the
  ; archer, who has none at all, is only four points below him. What keeps a mage
  ; alive is Blink and Frost Nova, not his coat.
  ArmourPercent = 4

  ; He stops at 40 and casts, inside his weapon's 46. Nearer than the archer's 48
  ; because his reach is shorter, and a long way outside the knight's 8 -- if he
  ; is ever at arm's length something has gone wrong.
  CloseDistance = 40

  Model = models/heroes/mage.glb
  ; The model boxes 2.655 tall and a hero is 12, so 12 / 2.655. The smallest
  ; ModelScale of the three, because he is the tallest mesh of the three.
  ModelScale = 4.52
  Facing = 90

  AnimationsFrom = animations/characters/general.glb
  AnimationsFrom = animations/characters/movement.glb
  AnimationsFrom = animations/characters/ranged.glb
  ; The one library in the game with a single clip in it, and the only one that
  ; is not KayKit's -- see CREDITS. His ultimate is cast two-handed and the kit
  ; ships nothing of the kind. Which clip is taken from it is named by
  ; DungeonSkill Mage R, which is also where its timing lives.
  AnimationsFrom = animations/characters/magic.glb

  ; ★ THE PLAIN IDLE, not a casting pose, and it is the staff that makes it work:
  ; the hand sits down at his side, and a staff 2.16 long at this scale is about
  ; ten units -- so it stands on the floor beside him, which is what a staff
  ; does. The skeleton mage uses Ranged_Magic_Spellcasting_Long as ITS idle for
  ; the opposite reason: it wants its staff up where the dark can be seen through
  ; it. A hero stands still most of a run; hands raised for the whole of it reads
  ; as a man casting nothing, over and over.
  Idle = Idle_A
  ; He moves at 25, between the knight's walk at 21 and the rogue's run at 29.
  ; Running_B is the slower of the two runs. ★ If he reads as skating, this is
  ; the line and Walking_A is the other end of it.
  Walk = Running_B
  ; The cast itself. The shot leaves at the start, exactly as the rogue's arrow
  ; leaves at the start of his release -- which is why neither of them has to fit
  ; inside ReloadFrames the way the knight's chop does.
  Attack = Ranged_Magic_Shoot
  Hurt = Hit_A
  Death = Death_A

  ; The ADVENTURERS' staff, which is his own kit's and not the one the skeleton
  ; mage carries -- the two are different files and the skeletons' would be the
  ; wrong wood in the right hand. Body and staff came out of the same pack at the
  ; same size, so HeldScale is 1; it runs along its own +Y like every blade in
  ; the kit, so it needs no HeldRoll. The bow is the only thing that ever did.
  Holds = models/heroes/staff.gltf
  HeldIn = handslot.r
  HeldScale = 1

  ; ★ AND THE BOOK, which the kit ships for him and which used to be a note in
  ; this block saying it was not possible. It is now: Holds is repeatable.
  ;
  ; Closed rather than open. A wizard walking a dungeon with a book held open in
  ; his off hand is reading while he fights; shut, it is a thing he is carrying,
  ; and the open one is there in the folder for the day a cast animation wants it.
  ;
  ; 0.57 tall against the staff's 2.15, so it is small in the hand and needs no
  ; scaling down.
  ;
  ; ★ TURNED, unlike the sword and the staff, and for a reason the two of them
  ; show by contrast: the hand bone is authored to send a weapon's LENGTH out of
  ; the knuckles, so a sword laid out along its own +Y comes out of the fist
  ; pointing the right way. A book has no length to point. Left untouched its
  ; 0.57 axis went out of the knuckles too, which stood it on end and jutted it
  ; away from him like a signboard.
  ;
  ; A quarter turn lays it flat in the palm, which is how a book is carried.
  ; ★ If it is flat but facing the wrong way, HeldRoll = 90 is the other quarter;
  ; if it lies UNDER his hand rather than on it, this is -90.
  Holds = models/heroes/spellbook_closed.gltf
  HeldIn = handslot.l
  HeldScale = 1
  HeldPitch = 90
  ; ★ WHAT HE CASTS OUT OF. Twice the knight's pool and more than twice his trickle, and
  ; skills that cost three times as much. He is the hero the resource is FOR:
  ; his four together come to 155 against a pool of 120, so he chooses.
  ;
  ; ManaRegen is TENTHS of a point a second -- 70 is 7.0 a second.
  ; Tenths because a level has to be able to add less than a whole point:
  ; see ManaRegenPerLevel in DungeonLeveling.
  MaxMana = 120
  ManaRegen = 70
End

; ---------------------------------------------------------------------------
; The live portrait — what stands in the panel's frame.
;
; Warcraft's portrait is not a picture. It is a small scene: the hero's own model
; with a camera up close to his face and his own animation running in it, which is
; the whole of why it reads as a person rather than as an icon. The frame used to
; hold a drawn silhouette, and that answered "which corner of the screen is mine";
; it could not answer "how is he doing", which is the question a player is
; actually asking of it between one click and the next.
;
; DungeonPortraits (plural) is the one EVERY SELECTABLE creature gets, and it is
; almost all of this feature: a skeleton, a boss and whatever is added next each
; get a properly framed face out of it, with no block of their own. DungeonPortrait
; <Template> (singular) is an override for a creature that wants a different one.
;
; The frame follows whatever is SELECTED, and "selectable" is the gate — an arrow,
; a chest and a barrel all have models and none of them is ever what the bar is
; describing.
;
; NO ART IS NAMED HERE. The model, its scale and the libraries the clips come out
; of are in the creature's own block, under the same name. A portrait that named
; its own model could drift out of step with the creature it is the face of.
;
; ---- the camera ----
;
; Measured in FRACTIONS OF WHAT IT IS LOOKING AT, never in world units — which is
; what lets one block frame the whole bestiary. Creatures are whatever size their
; kit made them, and a camera in world units would sit in one's chest and a metre
; over another's head.
;
;   Head   how far up it the camera looks. 1 is the top of it
;   Show   how much of its height fills the frame. 0.5 is its top half
;   Yaw    degrees round it. 0 is dead ahead — its own authored forward, so this
;          means the same thing for every kit whatever Facing says
;   Pitch  degrees ABOVE it, looking down. Negative looks up at it, which flatters
;   Fov    the lens. Narrow flatters a face, wide bends it outward — and it does
;          NOT change how much is in the frame, because Show says that outright
;
; The height is HOW FAR ITS TOP IS OFF THE GROUND, measured off the model, not how
; tall its box is. The two differ on anything that does not stand on its feet: the
; Stalker and the Reaper are modelled with something trailing below the floor they
; hover over, so their boxes are 3.05 tall where they stand 2.17 — measured by the
; box, the camera looks a third of a body too low on exactly those two.
;
; These numbers are measured off this kit, whose characters are drawn with a head
; nearly half their height: the head joint sits at 0.55 of the model and the top of
; the hair at 1.0, so a camera at 0.86 looks at the FOREHEAD. 0.74 is the face.
;
; ---- the states ----
;
; The five states are the CLIENT's — it decides what a state IS, and therefore
; whether its clip loops. Calm, Fight and Hurt go round; Dead and LevelUp play once
; and the frame keeps the pose they end on.
;
; A state with no clip named falls back to THE CREATURE'S OWN: its walking-about
; idle for standing, its death for dying. Which is why the block below names none
; and every monster in the game still breathes in the frame and falls over in it.
; Fighting and being hurt fall back to standing rather than to a creature's attack
; clip on purpose: an attack is one blow, and looped it is a monster shadow-boxing.
;
; A clip the model does not carry falls back to standing and says so once in the
; log, so a misspelling costs a line rather than a frozen frame.
; ---------------------------------------------------------------------------

DungeonPortraits Everyone
  Head = 0.74
  Show = 0.64
  Yaw = 22
  Pitch = -4
  Fov = 34
  ; Below a third of its health it is in trouble, which is the moment the frame is
  ; really for. There is no tired clip in the kit, so speed says "labouring"
  ; without one.
  HurtBelowPercent = 30
  HurtSpeed = 1.5
End

; The hero's own, because two of his states are things no monster has: a bow held
; ready, and a flourish for a new level. His clips come out of the same three
; libraries DungeonHero names above. Each is one word to change — worth trying:
; Idle_A / Idle_B / Ranged_Bow_Aiming_Idle for the standing ones, Death_B for a
; slower fall (2.6s, longer than the floor stays open), Interact / Throw /
; Ranged_Bow_Draw_Up for the flourish.
DungeonPortrait Rogue
  ; Standing with the bow, as he stands in the world.
  Calm = Ranged_Bow_Idle
  ; Drawn and waiting rather than loosing: he "has a target" for a whole
  ; engagement, so a release clip here would have him shooting continuously and
  ; none of it would be a shot.
  Fight = Ranged_Bow_Aiming_Idle
  ; The plainer of the two idles, run faster — see HurtSpeed above.
  Hurt = Idle_B
  ; Death_A falls in 0.8s.
  Dead = Death_A
  ; Rising out of the ground, which reads as power arriving.
  LevelUp = Spawn_Ground

  ; ★ Re-measured for his own mesh. He boxes 2.180 against the ranger's 2.275 and
  ; his head joint sits at 0.569 of that against 0.546 -- a shorter model with a
  ; proportionally larger head -- so the ranger's 0.74 would have framed him low
  ; and cut the top of his hood off. The camera aims about 0.20 above the joint
  ; on all three of them, which is the rule the knight's numbers follow too.
  Head = 0.77
  Show = 0.63
  Yaw = 22
  Pitch = -4
  Fov = 34
  HurtBelowPercent = 30
  HurtSpeed = 1.5
End

; The knight's. Two of his states are things the archer has no clip for — a blade
; held ready, and a level worth celebrating — and the rest he shares.
;
; The camera numbers are the same as everybody's, and that is the point: they are
; fractions of whatever they are looking at, so they frame a knight by his own
; measured height without anybody having measured him. If his head comes out badly
; once his model is in, Head and Show are the two lines, and neither needs a
; rebuild.
DungeonPortrait Knight
  ; Standing with the blade, as he stands in the world.
  Calm = Melee_2H_Idle
  ; Guarding rather than swinging: he "has a target" for a whole engagement, so a
  ; chop here would have him hacking at the air between blows.
  Fight = Melee_Blocking
  Hurt = Idle_B
  Dead = Death_A
  ; A spin, which reads as a flourish. Melee_2H_Attack_Spinning is the longer one.
  LevelUp = Melee_2H_Attack_Spin

  ; ★ NOT the archer's numbers, and this is the case the per-hero block was for.
  ; He boxes 2.543 against the archer's 2.275 and his head joint sits at 0.488 of
  ; that against 0.546 — a taller model with a proportionally smaller head — so
  ; the same fractions would frame him high and leave dead space over his helmet.
  ; Lower and a little wider: chest to just over the crest.
  Head = 0.70
  Show = 0.68
  Yaw = 22
  Pitch = -4
  Fov = 34
  HurtBelowPercent = 30
  HurtSpeed = 1.5
End

; The mage's, measured off his own mesh like the other two. He boxes 2.655 --
; the tallest of the three -- and his head joint therefore sits at only 0.468 of
; him, which is the hat rather than a small head: the joint is at the same
; absolute 1.241 on all five of the kit's characters, because they share one rig.
; So he is framed LOWER than either of the others and shown a little wider.
DungeonPortrait Mage
  ; Standing with the staff, as he stands in the world.
  Calm = Idle_A
  ; Hands up and holding it, which is what "has a target" looks like for a
  ; caster. The long spellcasting loop rather than the shoot, for the same reason
  ; the knight guards rather than chops: he has a target for a whole engagement,
  ; and a cast clip here would have him throwing fire that never leaves.
  Fight = Ranged_Magic_Spellcasting_Long
  Hurt = Idle_B
  Dead = Death_A
  ; Raising something, which reads as power arriving -- and is the one magic clip
  ; that is about gathering rather than throwing.
  LevelUp = Ranged_Magic_Raise

  Head = 0.67
  Show = 0.70
  Yaw = 22
  Pitch = -4
  Fov = 34
  HurtBelowPercent = 30
  HurtSpeed = 1.5
End

; ---------------------------------------------------------------------------
; What an arrow is drawn as.
;
; An arrow of its own, which it did not used to be: the hero's model carried one
; on his string and a single mesh was cut out of that file and flown. It worked,
; and it was a 24MB file to fetch one shaft out of, under a name the exporter had
; shuffled -- the mesh called Eyes was the arrow, the one called Arrow was his
; clothes. The kit ships an arrow, so the arrow is the arrow.
;
; Facing turns it onto the engine's forward, as everywhere else. If arrows fly
; blunt end first, this is the number.
;
; Tint is multiplied over the model's own colours; white would leave them alone.
; ---------------------------------------------------------------------------

DungeonArrow Look
  ; The drawn shot Q looses, which is a skill rather than a weapon and so has its
  ; template and its speed here rather than on a creature. How it is DRAWN is
  ; below, with everything else that flies.
  HeavyTemplate = HeavyArrow
  ; Slower than an ordinary arrow on purpose: it is the one shot the player chose
  ; to spend, so it is the one worth watching cross the room.
  HeavySpeed = 120
End

; ---------------------------------------------------------------------------
; What each thing in flight is drawn as.
;
; Named after the template it is, repeatable, and one block each. It was one
; block describing two shots with a "Heavy" prefix on the second, which stopped
; being a scheme the moment there were four of them.
;
; Model may be left out entirely: a fireball has no file anywhere and is drawn by
; its effect. Facing turns a model onto the engine's forward -- if things fly
; blunt end first, that is the number. Tint multiplies over the model's own
; colours, and Height is what the shot is drawn at: the simulation is flat, and
; this is the line the shot is drawn along.
;
; Effect names a block further down and is what makes a thing burn.
; ---------------------------------------------------------------------------

DungeonProjectile Arrow
  Model = models/heroes/arrow.gltf
  ; The model is 1.26 long, and 5.4 of that is the length it always flew at.
  Scale = 5.4
  Facing = 90
  Height = 7
  Tint = 0xE8DCB0
End

DungeonProjectile HeavyArrow
  ; The same shaft, nearly twice the size and in torch colour, so the shot the
  ; player chose to spend is not mistaken for the ones he gets for free. And it
  ; is the one that burns -- that is the whole of what Q now is to look at.
  Model = models/heroes/arrow.gltf
  Scale = 9.5
  Facing = 90
  Height = 7
  Tint = 0xE8A33D
  Effect = FlameArrow
  ; Where on it the fire sits, forward of its middle. The model is 1.26 long and
  ; scaled 9.5, so the shaft is twelve units and the head is six ahead of the
  ; origin -- which is where a burning arrow burns. Left at zero the flame comes
  ; out of the middle of the shaft, and left off entirely it comes out of the
  ; GROUND, because the node a projectile hangs from is where it stands rather
  ; than where it is drawn.
  EffectOffset = 6
End

DungeonProjectile Bolt
  ; The crossbow skeleton's. The same shaft as the hero's, shorter and duller:
  ; what is coming at you should be recognisable as a shot without being
  ; mistaken for one of yours.
  Model = models/heroes/arrow.gltf
  Scale = 4.2
  Facing = 90
  ; Crossbow height rather than bow height: it is held level at the shoulder.
  Height = 7.5
  Tint = 0x9A8F7A
End

DungeonProjectile Fireball
  ; No model at all. It is a glowing body and a trail, both of which the effect
  ; draws, so there is nothing here but where it flies and what it burns like.
  Height = 7
  Tint = 0xFF8A3C
  Effect = MageFire
  ; A ball has no head to burn at, so the fire sits where the ball is. Written
  ; anyway rather than left out: the two have to agree, and leaving it out is
  ; what put the ball on the floor under its own flame.
  EffectOffset = 0
End

DungeonProjectile GreaterFireball
  ; The Necromancer's. The same fire as the Revenant's and nothing else about it
  ; is different -- it is thrown by something three times the size, so it is
  ; three times the ball. Higher too, because it leaves a staff held twenty units
  ; off the ground rather than thirteen.
  Height = 12
  Tint = 0xFF8A3C
  Effect = MageFireGreater
  EffectOffset = 0
End

; The mage hero's ordinary shot. Cold rather than hot, and that is the whole
; job it has to do: what comes out of HIS staff must not be mistaken across a
; dark room for what comes out of the Revenant's. No model, like the fireballs --
; it is a glowing body and a trail, both of which the effect draws.
DungeonProjectile MageBolt
  Height = 7
  Tint = 0x6FD4FF
  Effect = ArcaneBolt
  EffectOffset = 0
End

