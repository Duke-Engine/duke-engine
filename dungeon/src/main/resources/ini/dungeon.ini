; ---------------------------------------------------------------------------
; WHAT A SKILL LOOKS LIKE GOING OFF.
;
; One block per skill, named by the skill's own Look line. Two new kinds carry
; nearly all of it:
;
;   SHOCKWAVE    a ring that opens across the floor and fades late. The shape a
;                skill is RECOGNISED by. A burst of sparks says "something
;                happened here" and every skill in the game would say it the same
;                way; a ring has a size, a speed and a colour, and those three
;                are how a player tells a nova from a whirlwind at a glance
;                without reading a word.
;   GROUND_MARK  a disc that STAYS. The opposite errand: the ring says what just
;                happened, this says what is about to. The meteor's warning is
;                the whole reason it exists.
;
;                ★ A mark goes where the thing it was cast on goes. A wave belongs
;                to the SPOT it went off at and stays there, because it is an
;                event; a mark can be either, and the cast says which. A guard is
;                a state the man is in, so it travels with him and ends with him.
;                A meteor's warning is a promise about a patch of floor, so it
;                does not move even if the mage who called it walks away or dies.
;
; ★ WAVEEASE IS THE FEEL, and it is one number. It is the power the elapsed
; fraction is raised to before the radius is taken from it. At 1 the ring opens
; at a constant speed, which is what a progress bar does and what nothing in the
; world does; at 2.4 it leaps out and then settles, which is what a thing that
; was struck does. Everything else on these blocks is colour and size; this is
; the line between an effect and a widget.
;
; LIGHT IS THE OTHER HALF. This is a dark game and the four dynamic lights the
; terrain shader reads are the most valuable thing on the page -- a ring lit
; from a flash is a ring the room is briefly a different colour for. LightPower
; and LightRadius are shared with the burst, so a skill that names them gets both.
;
; LAYERED, not chosen between. A cast draws its sparks and its flash first (the
; same pooled IMPACT_BURST an arrow lands with) and then opens its ring THROUGH
; them, so the three arrive as one thing. Any of the three may be dropped by its
; own ceiling without touching the other two.
;
; SHORT. Nothing here runs past 0.6s except the meteor's warning, which is not an
; effect so much as a promise. An effect the player has to wait out is one he
; learns to stop looking at.
;
; The knock: ShakeSeconds and ShakePower move the CAMERA'S EYE and not what it is
; looking at, so the world rattles round whatever is in the middle of the screen.
; Small numbers -- a shake that can be seen is one a player asks you to remove.
; Set both to 0 on any block to take it out, and set them to 0 everywhere to take
; the whole idea out without touching a line of code.
; ---------------------------------------------------------------------------

