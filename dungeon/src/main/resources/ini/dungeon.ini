; Duke Dungeon — the tuning that is not a unit stat.
;
; Unit stats (health, damage, speed) live in creatures.ini, where the engine's
; template loader reads them. What is left over is everything about how a dungeon
; is laid out and how the creatures in it decide things — neither of which the
; engine has an opinion about, because neither is part of any unit.
;
; Everything here can be changed without recompiling.

DungeonGeneration Layout
  ; Cells across and down. Kept tight on purpose: space beyond what the rooms
  ; need just becomes corridor, and corridor is walked through, not played.
  MapWidth = 50
  MapHeight = 36

  ; MinRooms is what the generator aims for, and it can only be a number that
  ; actually fits: rooms are placed by trying and rejecting, and one that will
  ; not go in is one the floor does without. Six is what always fits at these
  ; sizes — asking for ten got eight, which made the file claim a floor it could
  ; not keep. DungeonGeneratorTest holds the claim to its word.
  MinRooms = 6
  MaxRooms = 15
  MinRoomSize = 7
  MaxRoomSize = 13

  ; Stone left between rooms so a wall reads as a wall rather than a shared line.
  RoomGap = 1
  ; How many times to try landing a room before settling for the ones that fit.
  PlacementAttempts = 3000

  ; Corridor width in cells. Must be wide enough for the largest creature to walk
  ; down: a cell is 10 world units and the boss is 16 across, so one cell would
  ; wedge it. A mover with nowhere to swerve is how units used to end up inside
  ; walls, so this is a correctness setting rather than a matter of taste.
  CorridorWidth = 2

  ; How far a new room may be from the nearest one already placed, in cells.
  ; Keeps the dungeon compact: rooms scattered to opposite corners are joined by
  ; long empty corridors, which are the part a player walks rather than plays.
  MaxRoomSpacing = 30

  ; Per room other than the hero's. Every occupied room gets at least the minimum.
  MinSkeletonsPerRoom = 2
  MaxSkeletonsPerRoom = 6

  ; ---- height ----
  ;
  ; Rooms stand on storeys and the corridors between them run flat, at the
  ; storey the way in is on. Every climb happens at a doorway: walking out of a
  ; raised room you come down a step into the corridor. That is not a look — two
  ; corridors that crossed at different storeys would be a wall across both of
  ; them, built by nobody and invisible on the map.
  ;
  ; The highest a room may stand. 0 turns height off entirely and the dungeon is
  ; the flat one this game had before.
  MaxStorey = 2

  ; How often a room stands a storey away from the one before it, as a
  ; percentage. Every other room, roughly.
  StoreyChangePercent = 45

  ; How far apart two storeys are, in world units. Ten, because that is how tall
  ; the kit's own wall comes out at a ten-unit cell — KayKit models a wall
  ; exactly one module high — so the wall holding up a raised room
  ; is one wall piece rather than one and a fraction. A cell is also ten across,
  ; which makes a one-cell stair climb at forty-five degrees.
  StoreyHeight = 10

  ; How many cells of corridor one storey of stair takes. One cell is a proper
  ; flight; two is a gentle ramp — and a correctness setting as much as a taste
  ; one, because a corridor is measured centre to centre and most of it is room.
  ; A climb that will not fit in the corridor is cut down until it does, so a
  ; long stair means fewer rooms actually end up raised.
  StairLength = 1

  ; Where the hero comes in, and where the boss waits. The boss is asked for the
  ; top and takes what the corridor into his room can hold, so on a floor whose
  ; rooms sit close together he may be a storey lower.
  EntranceStorey = 0
  BossStorey = 2
End

DungeonCombat Behaviour
  ; Left over from when there was one kind of monster. Every kind now carries its
  ; own SenseRadius and ChaseRadius below, and nothing reads these — kept only
  ; because a file that silently ignores a setting is worse than one that says so.
  SkeletonSenseRadius = 36
  SkeletonChaseRadius = 72
  SkeletonRepathFrames = 10

  ; How close a HERO walks before he stops and lets his weapon work, for one who
  ; does not say. Each monster has its own CloseDistance further down; each hero
  ; may now have his own too, in his DungeonHero block — and had better, because
  ; the number below is an archer's.
  ;
  ; ★ IT HAS TO BE INSIDE HIS OWN REACH, and the game clamps it to four fifths of
  ; that whatever is written here. One figure for every hero was fine while there
  ; was one hero: a swordsman reaching 11 stopped at 48 and stood four body
  ; lengths from a skeleton swinging at nothing, until it walked the rest of the
  ; way and hit him. From a chair that is a hero who will not fight until he is
  ; provoked, which is not what the number looks like it does.
  ;
  ; He carries a bow that reaches 60, so he stops well short and shoots. Kept
  ; inside that reach rather than equal to it: stopping at your own maximum means
  ; parking on the edge of it, where a step in any direction — his own, or the
  ; thing walking at him — puts the target outside and he stands there doing
  ; nothing. The margin is what makes the range usable rather than theoretical.
  ;
  ; This is the number that decides how the game is played. Lower it towards 4
  ; and he walks into everything and brawls, which is what he used to do.
  CloseDistance = 48
  HeroRepathFrames = 10

  ; How far in front of itself a walking thing looks for a body, in world units.
  ;
  ; The answer to a monster shuffling in a doorway. With a body in that space it
  ; STANDS STILL until the space clears; without one it walks. The locomotor's
  ; own answer is to step aside, and stepping aside works in the open and turns
  ; into a twitch in a corridor -- it finds a clear diagonal, takes it, is pushed
  ; back, and tries again thirty times a second.
  ;
  ; A little more than one step, so the answer comes before the collision rather
  ; than after it. Much larger and things stop a body's width short of each other
  ; and a queue forms behind nothing; much smaller and they touch first and the
  ; shuffle is back.
  WayAheadProbe = 5

  ; The hero shoots arrows that are really there: they leave the bow, cross the
  ; distance, and the damage lands when they arrive. At 170 a shot is in the air
  ; about a third of a second over his full range — long enough to see, and long
  ; enough that a monster can die from an arrow loosed before it moved.
  ;
  ; They chase rather than lead, so a shot never misses; what the flight costs is
  ; time. Ten times a monster's pace, or they would not catch anything.
  ArrowTemplate = Arrow
  ArrowSpeed = 170
  ; How far in front of him it appears. Started at his own position it comes out
  ; of his chest; the bow is held out ahead, and ahead is where he is facing —
  ; he turns to shoot, so his heading is the line of the shot.
  ArrowMuzzleOffset = 5
End

DungeonRun Loop
  ; How long the death message stays up before the next dungeon appears.
  RespawnDelayFrames = 60

  ; How long the finished floor stays open after the boss falls, in logic frames
  ; (30 = one second). Not decoration: the boss leaves something behind, and a
  ; floor that closed in the same frame would take it away before anyone could
  ; walk to it. It also gives the fight a moment to have been won in.
  DescendDelayFrames = 75

  ; And how long the last one stays up, which is longer on purpose: a death is an
  ; interruption and a win is an ending, and an ending wants looking at.
  VictoryFrames = 150

  ; What the banner says at either. The rest of the words the player reads are in
  ; DungeonHud below; these two are here because they belong to the run rather
  ; than to the panel.
  ; Which hero walks into the dungeon, by his creature template in creatures.ini.
  ; The same word heads his DungeonHero, DungeonPortrait and four DungeonSkill
  ; blocks, so changing this line swaps every one of them together.
  ;
  ;   Hero    the archer — weak, fast, outranges the floor, loses the moment
  ;           anything reaches him
  ;   Knight  the swordsman — slow, armoured, has to walk in
  ;
  ; A line rather than a screen because a choosing screen is a separate piece of
  ; work; this is what makes the second one playable enough to be balanced.
  DefaultHero = Rogue

  DiedWord = You died
  WonWord = You won
  ; And between floors. %d is the floor he is going down to. A word rather than a
  ; string built in Java, which is what it was -- the only thing the player read
  ; that was written in English in a source file.
  NextDepthWord = Chuqurlik %d
End

; ---------------------------------------------------------------------------
; Which stage this build opens on, if it opens on one at all.
;
; A stage is a dungeon that has stopped changing: the same rooms, the same
; monsters in the same corners, every time. Blank here is the endless descent
; above, which is what this game is when nobody has said otherwise.
;
; Beaten by the command line, which is what an author uses while building one:
;
;   ./gradlew :dungeon:run --args="--stage=stages/first.stage"
;
; The path is looked for on disk first and inside the game second, so an author
; edits a file and a player installs one. Stages are built with
; ./gradlew :worldbuilder:run
; ---------------------------------------------------------------------------

DungeonStage Play
  File =
End

DungeonLeveling Progression
  ; The hero starts at level 1 and everything here is what levels 2 and up add.
  ; Level 1 grants nothing, so creatures.ini reads as the starting hero rather
  ; than as the hero minus his first level.
  ; ★ FIFTEEN, and the number is not free. A level is a POINT now -- see
  ; SkillRanks -- and three ordinary skills at four ranks each plus an ultimate
  ; at three is exactly fifteen. So a hero who reaches the top has everything,
  ; and every level before that is a decision about the ORDER rather than about
  ; what he ends up with. Move this and the two stop agreeing: at fourteen he
  ; never finishes, at sixteen the last level has nowhere to go.
  MaxLevel = 15
  ; How far the ordinary three may drift apart. Two: enough to favour one without
  ; abandoning the others, and what stops a skill being taken four times running
  ; while the other two sit at nothing.
  SkillSpread = 2

  ; Experience to reach level 2, and how much more each level after that costs.
  ; A skeleton is worth ExperienceValue in creatures.ini.
  XpBase = 30
  XpStep = 15

  ; Flat maximum health per level. Current health rises with it — but it is not
  ; a full heal, or levelling mid-fight would be a free escape from losing one.
  HealthPerLevel = 20

  ; Percent of base damage added per level. A percentage rather than a flat
  ; figure because the engine's hook is a multiplier, not an amount.
  DamagePercentPerLevel = 12

  ; Percent of incoming damage removed per level, and the floor it may not pass.
  ; Armour that reaches zero is not a tough hero, it is a game with no way to lose.
  ArmourPercentPerLevel = 5
  MinDamageTakenPercent = 40

  ; How long "Level 2!" stays on screen, in logic frames (30 = one second).
  LevelUpBannerFrames = 60
  ; ★ WHAT A LEVEL IS WORTH TO A CASTER. Counted exactly as HealthPerLevel is,
  ; and applied in the same place -- see HeroProgress, which is the only thing
  ; that knows what level anybody is.
  ;
  ; 6 a level over fifteen levels is +84 mana, which roughly doubles the mage
  ; and trebles the knight. The knight gains proportionally more on purpose: he
  ; starts with the least, and a hero who cannot afford his own skills at level
  ; one should be able to lean on them by level ten.
  ManaPerLevel = 6
  ; TENTHS a second, like ManaRegen itself. 3 is +0.3 a second per level, so by
  ; the fifteenth the mage is on 11.2 and the knight on 7.2 -- a real raise that
  ; does not overtake the pools it is filling.
  ManaRegenPerLevel = 3
  ; ★ MANA FOR A KILL, and 0 is the shipped answer rather than the timid one.
  ; Paying for kills makes mana a reward for fighting, which pulls against what
  ; it is here for: with it off, the only way to get mana back is to wait, and
  ; the waiting IS the decision. Turn it up and the mage can fight his way back
  ; to a meteor, which is a different and easier game.
  ;
  ; There is no kill event on this side of the engine -- the experience module
  ; is rts's -- so what this actually watches is his experience going up. In
  ; this game nothing else raises it.
  ManaPerKill = 0
End

; ---------------------------------------------------------------------------
; What lives down here. One block per kind; the game reads this list and wires
; a brain for each, so a new monster is a block here plus a creature definition
; in creatures.ini — no Java.
;
; Health, speed and damage are unit stats and live in creatures.ini. What is
; here is behaviour (which no template field can express) and how the dungeon
; chooses to use the kind.
;
; CloseDistance is the important one: it is the whole difference between
; something that walks into your face and something that shoots from across the
; room. Keep it shorter than that creature's AttackRange or it will close, stop,
; and never be in range of anything.
;
; A monster also comes when one of its own starts a fight within AlertRadius of
; it and in plain sight of it -- that is what makes a room fight as a room
; rather than as a queue of duels. Stone stops the shout, so it does not empty
; the next room through the wall. Zero for anything that should fight alone.
; ---------------------------------------------------------------------------

DungeonMonster Skeleton
  ; The ordinary one. Everything else is measured against it.
  SenseRadius = 36
  ChaseRadius = 72
  CloseDistance = 4
  ; About a room across. See the note above the first block.
  AlertRadius = 70
  RepathFrames = 10
  ; How long a blow takes. Having got close enough to strike it stands and
  ; finishes, even if the hero steps away -- which is what makes stepping away
  ; worth doing. See MonsterBrain.
  SwingFrames = 12
  MinDepth = 1
  Weight = 40
  Colour = 0xE15F50
  Scale = 1.0
  ; The plain skeleton of the pack, with a blade. GeometryHeight is 12 in
  ; creatures.ini and the model boxes 2.17 tall.
  Model = models/monsters/skeleton_minion.glb
  ; What is looking at you out of the dark.
  Effect = EmberEyes
  ModelScale = 5.5
  Holds = models/monsters/blade.gltf
  HeldIn = handslot.r
End

DungeonMonster Runner
  ; Fast, frail, and comes in numbers. Notices further and gives up later, so a
  ; room of them arrives as a wave rather than a queue.
  SenseRadius = 45
  ChaseRadius = 91
  CloseDistance = 4
  AlertRadius = 70
  RepathFrames = 6
  ; Quick, and quick to recover: the one you cannot walk away from.
  SwingFrames = 8
  MinDepth = 1
  Weight = 30
  Colour = 0xF2C14E
  Scale = 0.75
  ; The same skeleton, smaller and in a hot wash so the two are told apart at
  ; a glance -- one texture serves the whole pack, so colour is what separates
  ; them. GeometryHeight is 9.
  Model = models/monsters/skeleton_minion.glb
  ; What is looking at you out of the dark.
  Effect = EmberEyes
  ModelScale = 4.2
  Tint = 0xFFD08A
  Holds = models/monsters/blade.gltf
  HeldIn = handslot.r
  ; It runs rather than walks: it is the one you cannot step away from.
  Walk = Running_A
End

DungeonMonster Brute
  ; Slow and heavy. Short sight, so it can be walked around — if you see it first.
  SenseRadius = 29
  ChaseRadius = 58
  CloseDistance = 4
  AlertRadius = 70
  RepathFrames = 14
  ; A heavy swing, and a long one -- the widest window in the dungeon.
  SwingFrames = 22
  MinDepth = 2
  Weight = 18
  Colour = 0x8E5BD0
  Scale = 1.45
  ; Armoured, with an axe, and half again as tall as the ordinary one: read as
  ; a different thing across a dark room, which is all a monster has to be.
  ; GeometryHeight is 16.
  Model = models/monsters/skeleton_warrior.glb
  ; What is looking at you out of the dark.
  Effect = EmberEyes
  ModelScale = 7.4
  Holds = models/monsters/axe.gltf
  HeldIn = handslot.r
End

DungeonMonster Stalker
  ; It said here that everything down here fights hand to hand because the kit
  ; had no creature that could plausibly shoot, so this one was a distance closed
  ; rather than a distance kept. The kit has one now, and this is it: the Stalker
  ; is the thing that notices from across the floor and then does something about
  ; it from where it is standing.
  ;
  ; Which changes how the floor is played rather than how it looks. Every other
  ; monster is a problem you can walk away from; this one follows you with bolts.
  SenseRadius = 55
  ChaseRadius = 110
  ; It stops well short and shoots -- inside its own reach of 52, for the reason
  ; the hero's CloseDistance is inside his: stopping at your maximum means parking
  ; on the edge of it, where one step either way puts the target out.
  CloseDistance = 42
  AlertRadius = 70
  RepathFrames = 12
  SwingFrames = 12
  MinDepth = 2
  Weight = 20
  Colour = 0x4FC3A1
  Scale = 0.9
  ; The hooded one, which is what a thing that follows you should look like.
  ; It boxes 3.05 rather than 2.17 -- the hood -- so its scale is the odd one.
  Model = models/monsters/skeleton_rogue.glb
  ; What is looking at you out of the dark.
  Effect = EmberEyes
  ModelScale = 3.9
  Holds = models/monsters/crossbow.gltf
  HeldIn = handslot.r
  ; A quarter turn, because the crossbow is the second weapon in these packs that
  ; is not laid out like the rest of them. The blades, axes and staves all run
  ; along their own +Y and the bone is authored for that; a crossbow runs along
  ; +Z -- as the hero's bow does -- so hung as it came it lay ACROSS the body,
  ; flat and pointing sideways at the floor, which is what a skeleton holding a
  ; crossbow like a tray looks like.
  ;
  ; Ninety degrees about the upright puts its length on the hand's own forward,
  ; which in the aiming pose is where the creature is looking.
  HeldYaw = 90
  ; Two hands on a crossbow, so it is the two-handed shot rather than the chop
  ; every other thing down here throws.
  Attack = Ranged_2H_Shoot
  ; And it STANDS as though it were holding one. Without this the shot played
  ; correctly and nobody could see it: a skeleton at rest with its arms down,
  ; a crossbow hanging at its side, and a one-second clip between two frames of
  ; that -- which reads as a bolt appearing out of its chest rather than as a
  ; creature shooting. Idle is what a thing looks like for the other nine tenths
  ; of the time, and for this one it should be aiming.
  Idle = Ranged_2H_Aiming
End

DungeonMonster Revenant
  ; Heals itself (AutoHealUpdate in creatures.ini). Kill it quickly or it undoes
  ; the fight — a damage check rather than a health check.
  ;
  ; And it throws fire, which it did not: a thing in a pointed hat that walks up
  ; and hits you is a skeleton with a hat on. Its ordinary attack is a small
  ; fireball -- small on purpose, because it is an ordinary attack. What a
  ; fireball proper looks like is a skill, and a later question.
  SenseRadius = 36
  ChaseRadius = 75
  CloseDistance = 38
  AlertRadius = 70
  RepathFrames = 10
  SwingFrames = 14
  ; It casts rather than swings.
  Attack = Ranged_Magic_Shoot
  ; And it STANDS with the staff up, which is the half that makes the other half
  ; visible. With the ordinary idle its weapon hand sits at 0.53 -- down at its
  ; side -- so the staff hung at its feet and the cast was a twitch between two
  ; frames of that. Hands up and forward at 0.89, and the throw reads as a throw.
  Idle = Ranged_Magic_Spellcasting_Long
  MinDepth = 3
  Weight = 12
  Colour = 0x6FA8FF
  Scale = 1.1
  ; The one that carries a staff, because the one that mends itself should not
  ; look like the ones that only swing. GeometryHeight is 13.
  Model = models/monsters/skeleton_mage.glb
  ; What is looking at you out of the dark.
  Effect = EmberEyes
  ModelScale = 6.0
  Holds = models/monsters/staff.gltf
  HeldIn = handslot.r
  ; It heals itself; the pale wash says so before the health bar does.
  Tint = 0x9FC4FF
End

; ---------------------------------------------------------------------------
; The four at the bottom of the four floors.
;
; One per depth, named in order by DungeonDepth Descent below, and the list is
; also how many floors there are: kill the last of them and the run is won. Each
; is one of the pack's four skeletons worn large, so the thing in the last room
; is recognisably made of the same bones as the ones on the way to it — and just
; as recognisably not one of them.
;
; All four share what makes a boss a boss: they see across the floor, never give
; up, and swing slowly enough to be read. What differs is the creature, which is
; in monsters.ini where the rest of the stats are.
;
; Weight = 0 keeps every one of them out of ordinary room filling: a boss is
; placed, not rolled for.
; ---------------------------------------------------------------------------

DungeonMonster Warden
  SenseRadius = 55
  ChaseRadius = 195
  CloseDistance = 4
  ; A boss room is bigger than an ordinary one, and the escort in it should
  ; fetch the boss rather than die in front of it.
  AlertRadius = 110
  RepathFrames = 8
  SwingFrames = 20
  MinDepth = 0
  Weight = 0
  ; Deliberately unlike every other monster, and unlike the hero: on the minimap
  ; this dot is the only thing telling the player where the floor ends.
  Colour = 0xFFFFFF
  Scale = 1.8
  ; The plain skeleton, grown until it is nothing like one. GeometryHeight is 18.
  Model = models/monsters/skeleton_minion.glb
  ; What is looking at you out of the dark.
  Effect = EmberEyes
  ModelScale = 8.3
  Holds = models/monsters/axe.gltf
  HeldIn = handslot.r
  HeldScale = 1.2
  Tint = 0xC9B8A0
End

DungeonMonster Reaper
  SenseRadius = 55
  ChaseRadius = 195
  CloseDistance = 4
  AlertRadius = 110
  RepathFrames = 6
  ; Quicker than the rest of them, which is the whole of what it is.
  SwingFrames = 12
  MinDepth = 0
  Weight = 0
  Colour = 0xFFFFFF
  Scale = 1.6
  ; The hooded one. It boxes 3.05 rather than 2.17, so its scale is the odd one.
  Model = models/monsters/skeleton_rogue.glb
  ; What is looking at you out of the dark.
  Effect = EmberEyes
  ModelScale = 6.2
  Holds = models/monsters/blade.gltf
  HeldIn = handslot.r
  HeldScale = 1.3
  Tint = 0x8FA9C8
End

DungeonMonster Necromancer
  SenseRadius = 55
  ChaseRadius = 195
  ; It throws rather than walks up, so it stops well short -- inside its own
  ; reach of 56, the way every other thrower down here is.
  CloseDistance = 46
  AlertRadius = 110
  RepathFrames = 8
  SwingFrames = 18
  ; Casting, and standing as though about to.
  Attack = Ranged_Magic_Shoot
  Idle = Ranged_Magic_Spellcasting_Long
  MinDepth = 0
  Weight = 0
  Colour = 0xFFFFFF
  Scale = 1.9
  ; The staff-carrier, which is what a thing that mends itself should look like.
  ; GeometryHeight is 20.
  Model = models/monsters/skeleton_mage.glb
  ; What is looking at you out of the dark.
  Effect = EmberEyes
  ModelScale = 9.2
  Holds = models/monsters/staff.gltf
  HeldIn = handslot.r
  HeldScale = 1.2
  Tint = 0x9FE8C4
End

DungeonMonster Champion
  SenseRadius = 55
  ChaseRadius = 195
  CloseDistance = 4
  AlertRadius = 110
  RepathFrames = 8
  ; Slow enough to be read, which is most of what makes a boss fightable.
  SwingFrames = 20
  MinDepth = 0
  Weight = 0
  Colour = 0xFFFFFF
  Scale = 2.2
  ; Twice anything else, and darkened until it reads as its own creature.
  ; GeometryHeight is 24.
  Model = models/monsters/skeleton_warrior.glb
  ; What is looking at you out of the dark.
  Effect = EmberEyes
  ModelScale = 11.1
  Holds = models/monsters/axe.gltf
  HeldIn = handslot.r
  HeldScale = 1.4
  Tint = 0x6E4A55
End

DungeonDepth Descent
  ; Killing the boss opens the way down. Each depth is the same generator with a
  ; new seed and tougher inhabitants; the hero keeps what he has earned, so the
  ; two curves have to be tuned against each other.
  ;
  ; ---- where it ends ----
  ;
  ; One boss per floor, in order, and this list is ALSO how many floors there
  ; are: kill the last of them and the run is won. There is no second number
  ; saying how deep the dungeon goes, because a second number is a number that
  ; can disagree with this one.
  ;
  ; Naming none puts the descent back the way it was: one boss called Boss, the
  ; same fight every floor, going down for ever. That is what this game did
  ; before it had an ending, and what a floor is worth depends entirely on the
  ; difference -- a descent with no bottom asks only how much further, and four
  ; named things to get past is a route you can finish.
  Bosses = Warden Reaper Necromancer Champion
  ;
  ; Percentages are of the creature's base value, added per depth beyond the
  ; first: at depth 3 with 25%, a monster has 1 + 2 x 0.25 = 1.5x health.
  MonsterHealthPercentPerDepth = 25
  MonsterDamagePercentPerDepth = 15
  MonsterCountPercentPerDepth = 20

  ; The boss climbs faster than its underlings — it is meant to be the wall.
  BossHealthPercentPerDepth = 40
  BossDamagePercentPerDepth = 25

  ; Experience is worth more the deeper it was earned, so levelling roughly keeps
  ; pace with what it is levelling against.
  ExperiencePercentPerDepth = 30
End

; ---------------------------------------------------------------------------
; Skills
;
; A block per skill, headed by the hero it belongs to and the key that casts it.
; Skills are the hero's, not the game's: a second hero is four more blocks here
; and a SkillBook line in his creature block, with no Java at all. Two heroes may
; share an Effect and differ in every number, which is why the effect is named
; separately from the skill.
;
; Effect is the only part of a skill written in code, and there are seven:
;
;   STRIKE        hurt one enemy you point at, within Range. With a Projectile
;                 the shot CHASES and never misses; the cost is the flight time.
;   AREA_DAMAGE   hurt everything within Radius of yourself. Nothing to point at.
;                 Name a DurationFrames and a TickFrames as well and it goes on
;                 landing rather than landing once -- a whirlwind instead of a
;                 blast -- and it FOLLOWS you, because it is measured from where
;                 you are standing each time. Damage is per landing either way.
;   AREA_AT_SPOT  hurt everything within Radius of a spot you point at, up to
;                 Range away. Pointing past Range means "as far that way as I
;                 can" rather than a refusal -- the ring on screen says so.
;   SKILLSHOT     throw a Projectile Range units in the direction you point, and
;                 it hits whoever is standing in the way. It CAN miss, which is
;                 the whole point: it rewards reading where a monster is going
;                 instead of clicking on it. Radius is how wide the shot is.
;   DASH          travel Distance along your facing, toward a spot. Name a Damage
;                 and it hurts whoever you went THROUGH, within Radius of the line
;                 you travelled -- a charge instead of a sprint. It does not shove
;                 anything aside; that is a question about the navigation grid.
;   EMPOWER       BoostPercent more damage for DurationFrames. Nothing to point at.
;   GUARD         BoostPercent LESS damage taken, for DurationFrames. EMPOWER's
;                 mirror and not a negative of it: that one changes what you deal,
;                 through the player's weapon bonus, and this changes what you
;                 take, through your body's armour. Nothing to point at.
;
; Each one already knows what the player must point at, so binding its key and
; drawing its ring both follow from the effect and neither is written twice.
;
; The two heroes below use six of the seven between them, and the seventh is here
; for the ones that come next: a spear thrown down a corridor is one SKILLSHOT
; block and not a line of Java.
;
; ★ A KEY BELONGS TO A SLOT, NOT TO A SKILL. Both heroes cast on Q, W, E and R,
; so the file holds two skills on Q — and only the played hero's are bound, his
; rings drawn and his slots filled. Which hero that is, is DefaultHero in
; DungeonRun. Give a third hero the same four letters; nothing collides.
;
; Everything with PerLevel grows straight from the hero's level, computed in one
; step rather than accumulated, so a level 7 hero is the same however he got
; there. CooldownPerLevel is negative because a cooldown improves by shrinking.
; MaxRank and LevelPerRank are what make an ultimate an ultimate: fewer ranks,
; and each of them waiting for a hero level. See SkillRanks.
;
; Frames, not seconds: 30 frames is a second of game time, and a cooldown counted
; in frames is the same cooldown on every machine.
; ---------------------------------------------------------------------------

