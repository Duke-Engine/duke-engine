; Duke Dungeon — the world, and the list of everything else the game is made of.
;
; This file holds what belongs to the dungeon itself: how it is generated, how deep
; it goes, what it looks like, its fog, its themes and tiles, where props stand —
; and, for now, the interface and the rules. The things that live in it are files
; of their own: one unit, one projectile, one effect, one prop to a file, and the
; sounds by channel. DungeonContent below says which files, and in which order.
;
; Everything here can be changed without recompiling.

; ---------------------------------------------------------------------------
; Every other file the game is made of, in the order it is read.
;
; A unit's file is the whole of it: its template (modules and stats), how it
; looks, its portrait and its skills. A HERO's health, speed and blow there are
; what his attributes are added to — see Attributes in the World block. Monsters carry
; GrowableBody, because depth raises their health after they are built; props
; carry no Body at all, which is why nothing targets them.
;
; The order is not tidiness. Monster kinds are drawn in it, heroes are offered in
; it and skills are read in it, so a file moved up this list changes which monster
; a seed rolls. The Mage reads after the skeleton casters because that is the
; order their skills always had. A new unit is a file and a line here — no Java.
; ---------------------------------------------------------------------------
DungeonContent Files
  File = ini/units/rogue.ini
  File = ini/units/knight.ini
  File = ini/units/skeleton.ini
  File = ini/units/runner.ini
  File = ini/units/brute.ini
  File = ini/units/stalker.ini
  File = ini/units/revenant.ini
  File = ini/units/skeleton_mage.ini
  File = ini/units/skeleton_healer.ini
  File = ini/units/skeleton_summoner.ini
  File = ini/units/mage.ini
  File = ini/units/warden.ini
  File = ini/units/reaper.ini
  File = ini/units/necromancer.ini
  File = ini/units/champion.ini

  File = ini/projectiles/arrow.ini
  File = ini/projectiles/heavy_arrow.ini
  File = ini/projectiles/bolt.ini
  File = ini/projectiles/fireball.ini
  File = ini/projectiles/greater_fireball.ini
  File = ini/projectiles/mage_bolt.ini
  File = ini/projectiles/mage_fireball.ini
  File = ini/projectiles/skull_fireball.ini
  File = ini/projectiles/holy_spark.ini
  File = ini/projectiles/mending_light.ini
  File = ini/projectiles/shadow_spark.ini
  File = ini/projectiles/summoning_rift.ini
  File = ini/projectiles/meteor_mark.ini

  File = ini/effects/flame_arrow.ini
  File = ini/effects/ember_eyes.ini
  File = ini/effects/mage_fire.ini
  File = ini/effects/mage_fire_greater.ini
  File = ini/effects/arcane_bolt.ini
  File = ini/effects/holy_spark.ini
  File = ini/effects/shadow_spark.ini
  File = ini/effects/mage_fireball.ini
  File = ini/effects/skull_fireball.ini
  File = ini/effects/meteor_warning.ini
  File = ini/effects/archer_shot.ini
  File = ini/effects/archer_volley.ini
  File = ini/effects/archer_sprint.ini
  File = ini/effects/archer_focus.ini
  File = ini/effects/knight_cleave.ini
  File = ini/effects/knight_charge.ini
  File = ini/effects/knight_guard.ini
  File = ini/effects/knight_whirlwind.ini
  File = ini/effects/mage_cast.ini
  File = ini/effects/frost_nova.ini
  File = ini/effects/mage_blink.ini
  File = ini/effects/meteor_call.ini
  File = ini/effects/golden_pillar.ini
  File = ini/effects/descent.ini
  File = ini/effects/holy_light.ini
  File = ini/effects/mending_light.ini
