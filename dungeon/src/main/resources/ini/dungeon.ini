; ---------------------------------------------------------------------------
; The world: one block, and every setting of it a section inside -- headed
; `Generation = Layout`, `LootItem = Blade`, and closed by an End of its own.
; A section the world has one of is named only to label it; a repeatable one
; is named by what it describes.
;
; LevelHeight is the one line the engine reads: every map this world lays, the
; first floor and each one after it, stands its storeys that far apart.
; ---------------------------------------------------------------------------
World Dungeon
  ; How far apart two storeys are, in world units. Ten, because that is how tall
  ; the kit's own wall comes out at a ten-unit cell — KayKit models a wall
  ; exactly one module high — so the wall holding up a raised room
  ; is one wall piece rather than one and a fraction. A cell is also ten across,
  ; which makes a one-cell stair climb at forty-five degrees.
  LevelHeight = 10

  Generation = Layout
    ; Cells across and down. Kept tight on purpose: space beyond what the rooms
    ; need just becomes corridor, and corridor is walked through, not played.
    MapWidth = 50
    MapHeight = 36

    ; MinRooms is what the generator aims for, and it can only be a number that
    ; actually fits: rooms are placed by trying and rejecting, and one that will
    ; not go in is one the floor does without. Six is what always fits at these
    ; sizes — asking for ten got eight, which made the file claim a floor it could
    ; not keep. DungeonGeneratorTest holds the claim to its word.
    MinRooms = 6
    MaxRooms = 15
    MinRoomSize = 7
    MaxRoomSize = 13

    ; Stone left between rooms so a wall reads as a wall rather than a shared line.
    RoomGap = 1
    ; How many times to try landing a room before settling for the ones that fit.
    PlacementAttempts = 3000

    ; Corridor width in cells. Must be wide enough for the largest creature to walk
    ; down: a cell is 10 world units and the boss is 16 across, so one cell would
    ; wedge it. A mover with nowhere to swerve is how units used to end up inside
    ; walls, so this is a correctness setting rather than a matter of taste.
    CorridorWidth = 2

    ; How far a new room may be from the nearest one already placed, in cells.
    ; Keeps the dungeon compact: rooms scattered to opposite corners are joined by
    ; long empty corridors, which are the part a player walks rather than plays.
    MaxRoomSpacing = 30

    ; Per room other than the hero's. Every occupied room gets at least the minimum.
    MinSkeletonsPerRoom = 2
    MaxSkeletonsPerRoom = 6

    ; ---- height ----
    ;
    ; Rooms stand on storeys and the corridors between them run flat, at the
    ; storey the way in is on. Every climb happens at a doorway: walking out of a
    ; raised room you come down a step into the corridor. That is not a look — two
    ; corridors that crossed at different storeys would be a wall across both of
    ; them, built by nobody and invisible on the map.
    ;
    ; The highest a room may stand. 0 turns height off entirely and the dungeon is
    ; the flat one this game had before.
    MaxStorey = 2

    ; How often a room stands a storey away from the one before it, as a
    ; percentage. Every other room, roughly.
    StoreyChangePercent = 45

    ; How many cells of corridor one storey of stair takes. One cell is a proper
    ; flight; two is a gentle ramp — and a correctness setting as much as a taste
    ; one, because a corridor is measured centre to centre and most of it is room.
    ; A climb that will not fit in the corridor is cut down until it does, so a
    ; long stair means fewer rooms actually end up raised.
    StairLength = 1

    ; Where the hero comes in, and where the boss waits. The boss is asked for the
    ; top and takes what the corridor into his room can hold, so on a floor whose
    ; rooms sit close together he may be a storey lower.
    EntranceStorey = 0
    BossStorey = 2
  End

  Combat = Behaviour
    ; Left over from when there was one kind of monster. Every kind now carries its
    ; own SenseRadius and ChaseRadius below, and nothing reads these — kept only
    ; because a file that silently ignores a setting is worse than one that says so.
    SkeletonSenseRadius = 36
    SkeletonChaseRadius = 72
    SkeletonRepathFrames = 10

    ; How close a HERO walks before he stops and lets his weapon work, for one who
    ; does not say. Each monster has its own CloseDistance further down; each hero
    ; may now have his own too, in his Hero block — and had better, because
    ; the number below is an archer's.
    ;
    ; ★ IT HAS TO BE INSIDE HIS OWN REACH, and the game clamps it to four fifths of
    ; that whatever is written here. One figure for every hero was fine while there
    ; was one hero: a swordsman reaching 11 stopped at 48 and stood four body
    ; lengths from a skeleton swinging at nothing, until it walked the rest of the
    ; way and hit him. From a chair that is a hero who will not fight until he is
    ; provoked, which is not what the number looks like it does.
    ;
    ; He carries a bow that reaches 60, so he stops well short and shoots. Kept
    ; inside that reach rather than equal to it: stopping at your own maximum means
    ; parking on the edge of it, where a step in any direction — his own, or the
    ; thing walking at him — puts the target outside and he stands there doing
    ; nothing. The margin is what makes the range usable rather than theoretical.
    ;
    ; This is the number that decides how the game is played. Lower it towards 4
    ; and he walks into everything and brawls, which is what he used to do.
    CloseDistance = 48
    HeroRepathFrames = 10

    ; How far in front of itself a walking thing looks for a body, in world units.
    ;
    ; The answer to a monster shuffling in a doorway. With a body in that space it
    ; STANDS STILL until the space clears; without one it walks. The locomotor's
    ; own answer is to step aside, and stepping aside works in the open and turns
    ; into a twitch in a corridor -- it finds a clear diagonal, takes it, is pushed
    ; back, and tries again thirty times a second.
    ;
    ; A little more than one step, so the answer comes before the collision rather
    ; than after it. Much larger and things stop a body's width short of each other
    ; and a queue forms behind nothing; much smaller and they touch first and the
    ; shuffle is back.
    WayAheadProbe = 5

    ; How a monster that keeps its distance backs away: straight away from him if the
    ; stone allows, and otherwise turned this many degrees further aside each try,
    ; left before right, this many tries each side. Past that it is cornered and
    ; fights where it stands.
    RetreatTurnDegrees = 30
    RetreatTurns = 3

    ; Where what a monster calls up rises: its skill's Radius away, first toward where
    ; it was aimed, and then turned this many degrees further aside each try, one way
    ; before the other, this many tries each way -- only on open floor it can see, never
    ; in stone, on another storey or on somebody. At the Skeleton Summoner's Radius of
    ; 16 a step of 45 puts two spots twelve units apart, a skeleton and a half.
    SummonTurnDegrees = 45
    SummonTurns = 4

    ; The hero shoots arrows that are really there: they leave the bow, cross the
    ; distance, and the damage lands when they arrive. At 170 a shot is in the air
    ; about a third of a second over his full range — long enough to see, and long
    ; enough that a monster can die from an arrow loosed before it moved.
    ;
    ; They chase rather than lead, so a shot never misses; what the flight costs is
    ; time. Ten times a monster's pace, or they would not catch anything.
    ArrowTemplate = Arrow
    ArrowSpeed = 170
    ; How far in front of him it appears. Started at his own position it comes out
    ; of his chest; the bow is held out ahead, and ahead is where he is facing —
    ; he turns to shoot, so his heading is the line of the shot.
    ArrowMuzzleOffset = 5
  End

  Run = Loop
    ; How long the death message stays up before the next dungeon appears.
    RespawnDelayFrames = 60

    ; How long the finished floor stays open after the boss falls, in logic frames
    ; (30 = one second). Not decoration: the boss leaves something behind, and a
    ; floor that closed in the same frame would take it away before anyone could
    ; walk to it. It also gives the fight a moment to have been won in.
    DescendDelayFrames = 75

    ; And how long the last one stays up, which is longer on purpose: a death is an
    ; interruption and a win is an ending, and an ending wants looking at.
    VictoryFrames = 150

    ; What the banner says at either. The rest of the words the player reads are in
    ; Hud below; these two are here because they belong to the run rather
    ; than to the panel.
    ; Which hero walks into the dungeon, by his creature template in ini/units/.
    ; The same word heads his Hero block and his four DungeonSkill blocks, so
    ; changing this line swaps every one of them together.
    ;
    ;   Hero    the archer — weak, fast, outranges the floor, loses the moment
    ;           anything reaches him
    ;   Knight  the swordsman — slow, armoured, has to walk in
    ;
    ; A line rather than a screen because a choosing screen is a separate piece of
    ; work; this is what makes the second one playable enough to be balanced.
    DefaultHero = Rogue

    DiedWord = You died
    WonWord = You won
    ; And between floors. %d is the floor he is going down to. A word rather than a
    ; string built in Java, which is what it was -- the only thing the player read
    ; that was written in English in a source file.
    NextDepthWord = Chuqurlik %d
  End

  ; ---------------------------------------------------------------------------
  ; Which stage this build opens on, if it opens on one at all.
  ;
  ; A stage is a dungeon that has stopped changing: the same rooms, the same
  ; monsters in the same corners, every time. Blank here is the endless descent
  ; above, which is what this game is when nobody has said otherwise.
  ;
  ; Beaten by the command line, which is what an author uses while building one:
  ;
  ;   ./gradlew :dungeon:run --args="--stage=stages/first.stage"
  ;
  ; The path is looked for on disk first and inside the game second, so an author
  ; edits a file and a player installs one. Stages are built with
  ; ./gradlew :worldbuilder:run
  ; ---------------------------------------------------------------------------

  Stage = Play
    File =
  End

  Leveling = Progression
    ; The hero starts at level 1 and everything here is what levels 2 and up add.
    ; Level 1 grants nothing, so his template reads as the starting hero rather
    ; than as the hero minus his first level.
    ; ★ FIFTEEN, and the number is not free. A level is a POINT now -- see
    ; SkillRanks -- and three ordinary skills at four ranks each plus an ultimate
    ; at three is exactly fifteen. So a hero who reaches the top has everything,
    ; and every level before that is a decision about the ORDER rather than about
    ; what he ends up with. Move this and the two stop agreeing: at fourteen he
    ; never finishes, at sixteen the last level has nowhere to go.
    MaxLevel = 15
    ; How far the ordinary three may drift apart. Two: enough to favour one without
    ; abandoning the others, and what stops a skill being taken four times running
    ; while the other two sit at nothing.
    SkillSpread = 2

    ; Experience to reach level 2, and how much more each level after that costs.
    ; A skeleton is worth ExperienceValue in its template.
    XpBase = 30
    XpStep = 15

    ; ★ WHAT A LEVEL IS WORTH IS NOT WRITTEN HERE ANY MORE. His health, speed, mana
    ; and the weight of his blow all come out of his attributes, which grow by what
    ; his own Attribute lines say -- see Attributes below and his Hero
    ; block. HealthPerLevel, DamagePercentPerLevel, ManaPerLevel
    ; and ManaRegenPerLevel went rather than staying beside them: two sources for one
    ; figure are two dials a balance pass has to keep in step.

    ; Percent of incoming damage removed per level, and the floor it may not pass.
    ; Armour is the one thing a level still gives directly: it belongs to no
    ; attribute. Armour that reaches zero is not a tough hero, it is a game with no
    ; way to lose.
    ArmourPercentPerLevel = 5
    MinDamageTakenPercent = 40

    ; How long "Level 2!" stays on screen, in logic frames (30 = one second).
    LevelUpBannerFrames = 60
    ; ★ MANA FOR A KILL, and 0 is the shipped answer rather than the timid one.
    ; Paying for kills makes mana a reward for fighting, which pulls against what
    ; it is here for: with it off, the only way to get mana back is to wait, and
    ; the waiting IS the decision. Turn it up and the mage can fight his way back
    ; to a meteor, which is a different and easier game.
    ;
    ; There is no kill event on this side of the engine -- the experience module
    ; is rts's -- so what this actually watches is his experience going up. In
    ; this game nothing else raises it.
    ManaPerKill = 0
  End

  ; ---------------------------------------------------------------------------
  ; The attributes, and what a point of each is worth to every hero alike.
  ;
  ; A hero is one number per Attribute section below, and his Hero block
  ; says what he starts with, what each level adds, and which one is his PRIMARY.
  ; Everything else is worked out from them, in one step:
  ;
  ;   health = MaxHealth in his template  + each attribute x its HealthPerPoint
  ;   speed  = Speed in his template      + each attribute x its SpeedPerPoint
  ;   mana   = MaxMana in his block       + each attribute x its ManaPerPoint
  ;   attack = Damage in his template     + his PRIMARY    x DamagePerPrimary
  ;
  ; So a strength hero who finds strength gets both halves -- more health and a
  ; harder blow -- and an archer who finds strength gets only the health.
  ;
  ; ★ THE LIST IS THIS FILE'S. The blocks' order is the order a hero's attributes are
  ; held in and the order the panel draws them. Another attribute is a block here, an
  ; Attribute line in each hero who has any of it, and a picture in icons/stats --
  ; and no Java. Short is how a hero's block names it, Word what the panel calls it,
  ; Icon its picture; a figure a block leaves out, it adds none of.
  ;
  ; ★ DECIMALS ARE READ EXACTLY, never through a float: at most two places on a figure
  ; here and one on a hero's attribute, and 0.155 is refused rather than rounded.
  ; Attributes are held in tenths and these in hundredths, so every figure is one sum
  ; of integer products -- the same on every machine however many levels he has taken.
  ;
  ; What comes back on its own is not here on purpose. It is each hero's own
  ; HealthRegen and ManaRegen, fixed, and no attribute moves it.
  ;
  ; Smaller than a Dota's 18 health and 12 mana a point, because these heroes are
  ; smaller: their pools are fifty to a hundred and twenty, and twelve mana a point
  ; of intelligence would treble the mage's by his fifteenth level.
  ; ---------------------------------------------------------------------------

  Attributes = Conversion
    DamagePerPrimary = 1.0
  End

  ; His body: every point is health.
  Attribute = Strength
    Short = STR
    Word = Kuch
    Icon = icons/stats/stat_strength.png
    HealthPerPoint = 12
  End

  ; His legs: every point is speed.
  Attribute = Agility
    Short = AGI
    Word = Epchillik
    Icon = icons/stats/stat_agility.png
    SpeedPerPoint = 0.15
  End

  ; His pool: every point is mana.
  Attribute = Intelligence
    Short = INT
    Word = Aql
    Icon = icons/stats/stat_intelligence.png
    ManaPerPoint = 5
  End

  ; ---------------------------------------------------------------------------
  ; How the attributes are shown: the block under the hero's experience bar, laid
  ; out the way Warcraft III lays out a hero. What he hits for and what he shrugs
  ; off down the left, in the biggest sockets; his PRIMARY large and framed in the
  ; middle with its value under it; and every attribute above stacked down the
  ; right, his primary in the brighter gold and the rest dimmer. Green beside a
  ; value is what he found.
  ;
  ; Sizes are design pixels -- the pixels the whole panel is drawn in and scaled
  ; from. The block keeps room for FigureRows and AttributeRows rows; a game that
  ; sends more gets them closed up to fit rather than spilling under the stone.
  ; A Colour sets a word; a Tint multiplies a picture, and 0xFFFFFF is a picture
  ; exactly as it was drawn.
  ; ---------------------------------------------------------------------------

  StatBlock = Panel
    FigureIcon = 30
    PrimaryIcon = 44
    AttributeIcon = 24
    IconShare = 0.8
    RowGap = 2
    GapUnderBar = 6
    FigureColumn = 150
    PrimaryColumn = 74
    FigureRows = 2
    AttributeRows = 3
    FigureText = 12
    AttributeText = 11
    PrimaryText = 14
    LabelColour = 0x8B8171
    ValueColour = 0xD9CFBA
    PrimaryColour = 0xF0D48A
    AttributeColour = 0xC9A24B
    GainColour = 0x7FBF6A
    FrameColour = 0xF0D48A
    FigureTint = 0xC9A24B
    PrimaryTint = 0xFFFFFF
    AttributeTint = 0xC9A24B
  End

  Depth = Descent
    ; Killing the boss opens the way down. Each depth is the same generator with a
    ; new seed and tougher inhabitants; the hero keeps what he has earned, so the
    ; two curves have to be tuned against each other.
    ;
    ; ---- where it ends ----
    ;
    ; One boss per floor, in order, and this list is ALSO how many floors there
    ; are: kill the last of them and the run is won. There is no second number
    ; saying how deep the dungeon goes, because a second number is a number that
    ; can disagree with this one.
    ;
    ; Naming none puts the descent back the way it was: one boss called Boss, the
    ; same fight every floor, going down for ever. That is what this game did
    ; before it had an ending, and what a floor is worth depends entirely on the
    ; difference -- a descent with no bottom asks only how much further, and four
    ; named things to get past is a route you can finish.
    Bosses = Warden Reaper Necromancer Champion
    ;
    ; ---- who stands with them ----
    ;
    ; Pairs of a kind and how many. A kind not yet at its MinDepth stays away, so the
    ; first two bosses still wait alone and the last two have the green and the purple
    ; mages about them: two to mend the boss and two to fill the room while they do.
    ; They stand on a square ring BossGuardRing cells out from the boss, corners first,
    ; and further out if the room has no floor there. MaxPerRoom is for rooms the draw
    ; fills and does not apply here. Leave BossGuards empty and every boss waits alone.
    BossGuards = SkeletonHealer 2 SkeletonSummoner 2
    BossGuardRing = 2
    ;
    ; Percentages are of the creature's base value, added per depth beyond the
    ; first: at depth 3 with 25%, a monster has 1 + 2 x 0.25 = 1.5x health.
    MonsterHealthPercentPerDepth = 25
    MonsterDamagePercentPerDepth = 15
    MonsterCountPercentPerDepth = 20

    ; The boss climbs faster than its underlings — it is meant to be the wall.
    BossHealthPercentPerDepth = 40
    BossDamagePercentPerDepth = 25

    ; Experience is worth more the deeper it was earned, so levelling roughly keeps
    ; pace with what it is levelling against.
    ExperiencePercentPerDepth = 30
  End

  ; ---------------------------------------------------------------------------
  ; The camera.
  ;
  ; The keys still pan and the wheel still zooms; this adds the oldest control in
  ; the genre on top of them, and the two work at once. Resting the cursor against
  ; the edge of the screen pushes the view that way, so moving it costs nothing --
  ; the mouse is already where the player is looking.
  ;
  ; The speed is a share of what the keys move at rather than a figure of its own,
  ; and the keys' speed is itself a function of how far out the camera is. So a
  ; shove moves the same amount of SCREEN at every zoom, instead of being right
  ; at one height and wrong at the others.
  ;
  ; An EdgeMargin of 0 turns it off, which is what every other game on this client
  ; gets unless it asks.
  ; ---------------------------------------------------------------------------

  Camera = View
    ; How close to the edge, in window pixels. Wide enough to hit without aiming,
    ; narrow enough not to fire while crossing the screen.
    EdgeMargin = 14
    EdgeSpeedPercent = 100
  End

  ; ---------------------------------------------------------------------------
  ; The flash that answers a click.
  ;
  ; Three arrowheads set a third of a turn apart, points inward, closing on the
  ; spot and going out as they arrive. It is the only thing in the game that talks
  ; back to the player in the moment between his click and anything happening, so
  ; it is worth more care than its size suggests: the shape says WHERE by aiming at
  ; it from three sides, and the movement says NOW without lasting long enough to
  ; clutter a fight.
  ;
  ; Three of these numbers do nearly all the work, and all three look like fussing
  ; until you have seen them wrong:
  ;
  ;   EasePower  -- arrowheads closing at a constant speed read as machinery. Real
  ;                 things arrive: fast at first, slowing as they land.
  ;   FadeFrom   -- fading from the first frame gives a mark that is half gone
  ;                 before it has said anything. It should travel at full strength
  ;                 and go out over the last stretch.
  ;   SpinDegrees-- a few degrees over the whole flight. Nobody consciously sees
  ;                 it; everybody notices the absence of it.
  ;
  ; Tune by eye -- nothing here needs a rebuild.
  ; ---------------------------------------------------------------------------

  OrderMark = Flash
    ; A cell is 10 across and the hero is 4 wide, so this opens about a room's
    ; doorway and closes to roughly his own footprint.
    StartRadius = 7
    ; Not zero, or the last frame is three shapes on top of each other.
    EndRadius = 1

    ; Short. Long enough to read across a lit room, gone before the next click.
    Seconds = 0.40

    ; One arrowhead: point to back edge, and across the back.
    Size = 3.5
    Width = 3.0

    ; Clear of the floor it is drawn on and not visibly above it. Any lower and it
    ; fights the floor for the same pixels; any higher and it hovers.
    Height = 0.25

    ; 1 is a straight line and looks mechanical; 3 is about right.
    EasePower = 3.0
    ; Full strength for the first 60% of the flight, out over the last 40%.
    FadeFrom = 0.6
    ; Small on purpose. This is life, not a pirouette.
    SpinDegrees = 22

    ; Drawn additively, so over 1 is what lets it read through torchlight and fog
    ; without being a lamp. Past about 2.5 it stops being a colour and goes white.
    Brightness = 1.6

    ; An order given TO SOMEBODY is not the same answer as an order given to a
    ; piece of floor, so it is not the same picture. The arrowheads say "there";
    ; a creature needs "THAT ONE", and arrowheads closing on something that is
    ; about to walk out from under them say it badly. So an attack is a ring round
    ; the creature that goes hard on and hard off -- the oldest way of picking one
    ; thing out of a crowd of them, and still the one the eye finds fastest. A
    ; gentle fade in the middle of a fight is a thing nobody sees.
    ;
    ; Two blinks: one reads as a glitch, three reads as a warning light.
    RingRadius = 7
    Blinks = 2

    MoveColour = 0x3CFF6E
    AttackColour = 0xFF4436
  End

  SkillRing = Look
    ; Thin enough to be a line, thick enough to survive being far away.
    BandWidth = 1.6
    ; How many straight pieces the circle is really made of.
    Segments = 96

    ; The wash inside is there to say "inside", not to hide the floor.
    FillAlpha = 0.10
    EdgeAlpha = 0.85

    ; Clear of the floor, like every other flat mark. A hair above the order mark
    ; so the two never fight for the same pixels when a click lands in a ring.
    Height = 0.3

    ; The only movement left. It opened out and turned slowly to begin with, which
    ; is what the genre does and which was wrong here: an indicator is a ruler, and
    ; a ruler that is still settling is a ruler you have to wait for. It appears at
    ; its size and stands still. The breath is what keeps it reading as live rather
    ; than painted on -- set PulseDepth to 0 for a ring that does not move at all.
    PulseDepth = 0.25
    PulsePerSecond = 1.4

    ; A skill that only touches the caster has no reach to draw, so the ring has to
    ; be some size -- and the size that says "only me" is HIS size and barely more.
    ; His body is 4 across, so this is a ring drawn against him. Anything larger
    ; reads as an area, which is the one thing it is not.
    SelfRadius = 5

    ; Added rather than blended, so over 1 is what lets it read through torchlight.
    Brightness = 1.5

    ; ★ THE SAME CYAN THE ARMED SLOT IS DRAWN IN, so the panel and the floor say
    ; the same thing in the same word: cyan means "you are choosing where this
    ; goes". It used to be a blue on the floor and gold on the bar, which is two
    ; languages for one moment -- and the gold was worse than merely different,
    ; because gold is the bar's own colour and an armed slot drawn in it says
    ; "slightly more gold than usual".
    ;
    ; Cold on purpose. Everything down here is stone, torch and gold, all of them
    ; warm; a cold colour has nothing to blend into.
    ;
    ; Red is still "this will not work" -- it is the one thing that must not be
    ; mistaken for the rest, so it keeps a colour of its own.
    AllowColour = 0x35D6AE
    DenyColour  = 0xFF4436
    ; The blast, a shade off the reach ring rather than a different colour: it is
    ; part of the same aiming and reading it as a warning was the old amber's
    ; doing.
    AreaColour  = 0x9BFFE8
  End

  ; ---------------------------------------------------------------------------
  ; What is left on the floor.
  ;
  ; A monster that dies may leave something behind, and walking over it is all it
  ; takes: there is no inventory and nothing to equip. That is deliberate -- the
  ; decision the loot asks for is whether to go and get it, and a second decision
  ; at the end of it would be a formality.
  ;
  ; What it gives is permanent for the run and gone with it, like everything else
  ; here. The kinds are what a hero is made of: ATTACK (percent of his blow), HEALTH
  ; (flat maximum health), ARMOUR (percent taken off what reaches him), MANA (flat
  ; maximum mana) and ATTRIBUTE (whole points of the attribute its Attribute line
  ; names -- see Attribute).
  ;
  ; Which monster leaves what is drawn from the run's own seed and the monster's
  ; own id -- so the same seed drops the same things off the same monsters, whatever
  ; order the player kills them in.
  ;
  ; Deeper floors give more: an item is worth ValuePercentPerDepth more per floor,
  ; and MinDepth keeps the better ones out of the first rooms entirely.
  ; ---------------------------------------------------------------------------

  Loot = Drops
    ; The creature a dropped item becomes. Naming none turns loot off entirely.
    Template = Chest
    ; How often an ordinary monster leaves something. Loot that always drops is not
    ; loot, it is a tax on killing things.
    DropPercent = 18
    ; The thing guarding the way down always leaves something. It is the one fight
    ; on the floor the player cannot walk past.
    BossDropPercent = 100
    ; How close he has to walk before it is his. A cell is 10 units, so this is
    ; "standing on it" with enough margin that a fast run does not skip over it.
    PickupRange = 14
    ; What an item is worth per floor beyond the first, as a percentage of itself.
    ValuePercentPerDepth = 20
    ; How long the panel says what he found, in logic frames (30 = one second).
    NoteFrames = 90
  End

  ; ★ A BIGGER PURSE, not a draught. Everything in his bag is permanent -- that is
  ; what the bag IS -- so this grows the pool rather than topping it up, and the
  ; topping up comes free: a pool that grows gifts what it adds, so finding one in
  ; a fight is a drink as well as a raise.
  ;
  ; A potion he carries and chooses to drink would be the other thing, and there is
  ; nothing in this game he carries and chooses to do anything with.
  LootItem = Manastone
    Name = Mana toshi
    Icon = flask
    Kind = MANA
    Value = 25
    Weight = 12
    MinDepth = 1
  End

  LootItem = Blade
    Name = O'tkir tig'
    ; Which drawing goes in his bag, by the name the client's panel draws it under.
    ; A name it does not know is drawn as a plain mark rather than left as a gap.
    Icon = blade
    Kind = ATTACK
    Value = 8
    Weight = 20
  End

  LootItem = Quiver
    Name = To'la sadoq
    Icon = shot
    Kind = ATTACK
    Value = 14
    Weight = 12
    MinDepth = 2
  End

  LootItem = Bread
    Name = Zaxira non
    Icon = flask
    Kind = HEALTH
    Value = 40
    Weight = 20
  End

  LootItem = Heart
    Name = Tosh yurak
    Icon = heart
    Kind = HEALTH
    Value = 90
    Weight = 12
    MinDepth = 2
  End

  LootItem = Shield
    Name = Yorilgan qalqon
    Icon = shield
    Kind = ARMOUR
    Value = 4
    Weight = 16
  End

  LootItem = Plate
    Name = Og'ir sovut
    Icon = plate
    Kind = ARMOUR
    Value = 8
    Weight = 10
    MinDepth = 3
  End

  ; ---------------------------------------------------------------------------
  ; The dark.
  ;
  ; Three states, and they are meant to be told apart at a glance: never been
  ; there (nothing drawn at all -- not the floor, not the walls, not what is
  ; standing on them), been there and left (dim: the walls are still drawn so the
  ; way back can be found, and the engine's own fog has already taken the monsters
  ; out of the snapshot), and in sight now (everything).
  ;
  ; LineOfSight is the important one. Without it the light is a circle that does
  ; not care what it is shining through, so standing in a corridor lights the rooms
  ; on both sides of it and there is nothing left to discover. With it, a straight
  ; line is drawn from the hero to every cell and stone stops it -- the wall itself
  ; is seen, what is behind it is not. Pure arithmetic over the grid the pathfinder
  ; already keeps: no shader, and nothing the simulation can feel.
  ;
  ; Tint is what the dark is made of. Black is a hole in the screen; a cold grey
  ; blue is a room somebody has stopped lighting, which is the thing being drawn.
  ;
  ; How it is drawn: the dark is a TEXTURE, stretched over the whole map as one
  ; sheet and blended over everything under it -- floor, walls, chests, whatever is
  ; standing in a room he has left. It used to be a brightness per cell painted flat
  ; across every tile in that cell, and however carefully the cells themselves were
  ; softened the floor still came out as a field of ten-unit squares. A sheet has
  ; its own resolution and the card fills in between its texels, so the edge of the
  ; light is smooth at the size of a pixel rather than the size of a tile. No shader
  ; anywhere in it.
  ; ---------------------------------------------------------------------------

  Fog = Sight
    LineOfSight = Yes
    ; The three shades, as percentages of a room in full sight. Unseen at 0 is the
    ; black a crawler wants; raise it and the whole floor plan is faintly there from
    ; the first frame, which is a different game. Remembered is low enough to read
    ; as memory rather than as light, high enough to find the way back through.
    UnseenPercent = 0
    RememberedPercent = 30
    VisiblePercent = 100
    ; How many cells the edge of the light is smeared over. One is the old hard
    ; staircase softened by a single cell; two is a torch rather than a spotlight.
    SoftenCells = 2
    ; How fast the dark gives way, as a share of what is left each second. Per
    ; second rather than per frame, or a faster machine would open the map faster.
    OpenPerSecond = 7
    ; How many texels across the sheet is, whatever size the map is. Nothing to do
    ; with cells: this is the resolution the dark is DRAWN at, and it is the number
    ; that decides whether the edge of the light is smooth or stepped. 256 over a
    ; dungeon floor is several texels to a cell. Higher costs a little more to push
    ; to the card each frame and nothing else.
    TextureSize = 256
    ; The colour of nothing: cold, and slightly blue, so unlit stone reads as stone
    ; rather than as a gap. Also the window's own background, exactly -- the sheet
    ; at full strength and the void beyond the map are the same dark, and any
    ; difference between them draws the map's outline on the screen.
    Tint = 0x121821
  End

  ; ===========================================================================
  ; Where the light comes from.
  ;
  ; One sun and one flat ambient, which is all flat-shaded palette art wants. What
  ; they are WORTH is here, because it turned out to be a decision about how the
  ; game looks rather than a fact about drawing it. The first player to see this
  ; said the map looked flat, twice, and he was right: the sun stood nearly
  ; overhead, so every surface facing up caught the same light and the floor plan
  ; read as a picture of a floor plan.
  ;
  ; ★ PITCH IS THE ONE THAT MATTERS, and what it separates is the UPRIGHT from the
  ; FLAT -- a wall from the ground it stands on. It cannot separate a floor from
  ; the lid on top of a wall, because those are the same tile facing the same way
  ; and no angle of light will ever shade them differently. That is what CapTint
  ; is for, down in the themes.
  ;
  ; At 57 -- where this used to stand -- a floor came out at 1.09 of full
  ; brightness and clipped to white, while the wall beside it sat at 0.79. Flat and
  ; blown out at once. At 40 the floor is 0.89 and a wall facing the sun is 1.02,
  ; so the wall is the bright thing and the ground is what it stands on.
  ;
  ; AmbientPercent is the sun's opposite and wants reading beside it: it is the
  ; whole of what keeps an unlit face from being a black shape, and the whole of
  ; what flattens the picture again if it goes too high. At 100 every face is lit
  ; the same whichever way it points, which is exactly what Pitch is here to stop.
  ;
  ; Look and nothing else -- the simulation never reads a word of this.
  ; ===========================================================================

  Sun = Overhead
    ; Degrees above the horizon. 90 is noon and draws no relief whatever.
    Pitch = 40
    ; Degrees round the compass, which decides which side of a wall is the lit one.
    ; Unchanged from the vector this used to be written as.
    Yaw = 219
    StrengthPercent = 100
    ; Just over half. Below about 40 the shadowed side of everything goes to a
    ; silhouette; above about 70 the relief the pitch buys is washed out again.
    AmbientPercent = 55
    ; Warm sun, cold shade. The oldest trick there is for making a flat palette
    ; look like it has air in it, and it costs nothing.
    Colour = 0xFFF7E6
    AmbientTint = 0xE6E6FF
  End

  ; ---------------------------------------------------------------------------
  ; What the floor is built from.
  ;
  ; The kit is Kenney's Modular Dungeon Kit (CC0). Its pieces are a floor tile and
  ; walls that stand on a tile's EDGE — so a wall is drawn on the line between open
  ; ground and stone, which is exactly where the pathfinder stops the hero. The
  ; picture and the collision are then the same wall.
  ;
  ; TileSize is what the kit was modelled at. A cell is 10 world units, so a kit
  ; authored at 4 is scaled by 2.5 — the only number here that has to be right.
  ;
  ; Naming no Floor turns the whole thing off and the dungeon is drawn in plain
  ; coloured blocks again, which is what it looked like before any of this.
  ; ---------------------------------------------------------------------------

  Tiles = KayKit
    Floor = models/tiles/dungeon/floor.gltf
    Wall = models/tiles/dungeon/wall.gltf
    Stairs = models/tiles/dungeon/stairs.gltf
    TileSize = 4
    ; How tall a wall piece stands, in the same units. It is what the lid over the
    ; rock is laid at: without one you look over the wall into an empty hole, and
    ; the room reads as a house with the roof off.
    WallHeight = 4
    ; This kit's wall is a slab a unit thick, centred on its own origin, so it is
    ; pushed back half a unit to put its face on the boundary. Measured off the
    ; model: x spans -2..2, z spans -0.5..0.5, y starts at 0 — so it needs no lift.
    WallShift = -0.5
    ; No corner post: this kit's corner piece is a length of wall bent round a
    ; right angle rather than the quarter-tile plug the notch wants, and a bent
    ; wall dropped into the notch stands across both walls that meet there.
  End

  ; ---------------------------------------------------------------------------
  ; Where the monsters' movement comes from.
  ;
  ; The creature kit ships rigged models with no animation; the animation library
  ; ships animation with no creature. They meet because both were built on the same
  ; standard humanoid skeleton — every joint the monsters have, the library
  ; animates. So one library moves the whole bestiary, and a new monster needs no
  ; animation work at all.
  ;
  ; The clips named here are the defaults. A Monster block may name its own
  ; Idle, Walk, Attack or Hurt instead — the runner jogs rather than walks. Only
  ; the ones that need to differ do: every creature strikes the same way on
  ; purpose, so a blow is recognisable whichever of them threw it.
  ;
  ; Idle and Walk are STATES and loop. Attack and Hurt are MOMENTS and play once,
  ; over whatever the creature was doing: the blow when its weapon lets go, the
  ; flinch when its health drops. Nothing in a snapshot says "is swinging right
  ; now", and a moment played on a loop is not the same thing slower.
  ;
  ; A clip is fetched by name, so a name that is not in the library simply leaves
  ; that monster standing still rather than failing. The library's own names are
  ; listed in the pack, and DungeonMonsterArtTest checks every name against them.
  ;
  ; Naming no Library turns animation off and the monsters stand in their modelling
  ; pose, which is what they did before this existed.
  ; ---------------------------------------------------------------------------

  Animations = Shared
    ; The same three libraries the hero takes his movement from, because everything
    ; on two legs down here is now built on one rig. That is not a saving so much
    ; as the reason the bestiary is worth swapping: one set of clips moves the
    ; archer, the minion and the thing at the bottom of the last floor.
    ;
    ; Repeatable, because a kit sorts its clips by what the movement is for.
    Library = animations/characters/general.glb
    Library = animations/characters/movement.glb
    Library = animations/characters/melee.glb
    ; And the ranged ones, now that two of them shoot rather than swing.
    Library = animations/characters/ranged.glb
    Idle = Idle_A
    Walk = Walking_A
    ; An overhead chop: the arm goes up and comes down. Everything down here
    ; strikes the same way, from the smallest to the boss, so a blow reads as a
    ; blow wherever it comes from — a monster that merely twitches at you does not
    ; look like it hit anything, whatever the health bar says.
    ;
    ; Played ONCE, on the frame the weapon lets go — not on a loop while the
    ; monster "is attacking", which is true from the moment it notices the hero
    ; until the fight ends. The clip used to run on its own tempo, so a monster
    ; that strikes every 1.6 seconds threw a one-second punch and none of them was
    ; the blow.
    ;
    ; One-handed, because that is what every one of them carries: a blade, an axe
    ; or a staff, hung on the bone the rig keeps for it.
    Attack = Melee_1H_Attack_Chop
    ; Played once as it falls, before the body is taken away.
    Death = Death_A
    ; Hurt = Hit_A
    ;
    ; A flinch when something takes health off it. OFF on purpose, not forgotten:
    ; a flinch and a swing are the same one-shot channel, so a monster being shot
    ; while it swings drops the swing — the hit it was landing simply stops being
    ; drawn, and hitting a monster reads as cancelling its attack. It comes back
    ; as something the player buys rather than as something every arrow does for
    ; free. Naming it here is all it takes to switch on.
  End

  ; ---------------------------------------------------------------------------
  ; The live portrait — what stands in the panel's frame.
  ;
  ; Warcraft's portrait is not a picture. It is a small scene: the hero's own model
  ; with a camera up close to his face and his own animation running in it, which is
  ; the whole of why it reads as a person rather than as an icon. The frame used to
  ; hold a drawn silhouette, and that answered "which corner of the screen is mine";
  ; it could not answer "how is he doing", which is the question a player is
  ; actually asking of it between one click and the next.
  ;
  ; Portraits (plural) is the one EVERY SELECTABLE creature gets, and it is
  ; almost all of this feature: a skeleton, a boss and whatever is added next each
  ; get a properly framed face out of it, with no block of their own. Portrait...
  ; lines in a creature's own Hero or Monster block override it for that creature.
  ;
  ; The frame follows whatever is SELECTED, and "selectable" is the gate — an arrow,
  ; a chest and a barrel all have models and none of them is ever what the bar is
  ; describing.
  ;
  ; NO ART IS NAMED HERE. The model, its scale and the libraries the clips come out
  ; of are in the creature's own block, under the same name. A portrait that named
  ; its own model could drift out of step with the creature it is the face of.
  ;
  ; ---- the camera ----
  ;
  ; Measured in FRACTIONS OF WHAT IT IS LOOKING AT, never in world units — which is
  ; what lets one block frame the whole bestiary. Creatures are whatever size their
  ; kit made them, and a camera in world units would sit in one's chest and a metre
  ; over another's head.
  ;
  ;   Head   how far up it the camera looks. 1 is the top of it
  ;   Show   how much of its height fills the frame. 0.5 is its top half
  ;   Yaw    degrees round it. 0 is dead ahead — its own authored forward, so this
  ;          means the same thing for every kit whatever Facing says
  ;   Pitch  degrees ABOVE it, looking down. Negative looks up at it, which flatters
  ;   Fov    the lens. Narrow flatters a face, wide bends it outward — and it does
  ;          NOT change how much is in the frame, because Show says that outright
  ;
  ; The height is HOW FAR ITS TOP IS OFF THE GROUND, measured off the model, not how
  ; tall its box is. The two differ on anything that does not stand on its feet: the
  ; Stalker and the Reaper are modelled with something trailing below the floor they
  ; hover over, so their boxes are 3.05 tall where they stand 2.17 — measured by the
  ; box, the camera looks a third of a body too low on exactly those two.
  ;
  ; These numbers are measured off this kit, whose characters are drawn with a head
  ; nearly half their height: the head joint sits at 0.55 of the model and the top of
  ; the hair at 1.0, so a camera at 0.86 looks at the FOREHEAD. 0.74 is the face.
  ;
  ; ---- the states ----
  ;
  ; The five states are the CLIENT's — it decides what a state IS, and therefore
  ; whether its clip loops. Calm, Fight and Hurt go round; Dead and LevelUp play once
  ; and the frame keeps the pose they end on.
  ;
  ; A state with no clip named falls back to THE CREATURE'S OWN: its walking-about
  ; idle for standing, its death for dying. Which is why the block below names none
  ; and every monster in the game still breathes in the frame and falls over in it.
  ; Fighting and being hurt fall back to standing rather than to a creature's attack
  ; clip on purpose: an attack is one blow, and looped it is a monster shadow-boxing.
  ;
  ; A clip the model does not carry falls back to standing and says so once in the
  ; log, so a misspelling costs a line rather than a frozen frame.
  ; ---------------------------------------------------------------------------

  Portraits = Everyone
    Head = 0.74
    Show = 0.64
    Yaw = 22
    Pitch = -4
    Fov = 34
    ; Below a third of its health it is in trouble, which is the moment the frame is
    ; really for. There is no tired clip in the kit, so speed says "labouring"
    ; without one.
    HurtBelowPercent = 30
    HurtSpeed = 1.5
  End

  Moment = LevelUp
    Effect = GoldenPillar
    Scale = 1
  End

  Moment = BossDown
    ; The level's own light, half as big again: the floor is his.
    Effect = GoldenPillar
    Scale = 1.5
  End

  Moment = Arrived
    Effect = Descent
    Scale = 1
  End

  ; ---------------------------------------------------------------------------
  ; What all of it is allowed to cost.
  ;
  ; Ceilings, not targets. Fifty arrows in the air, each with a hundred sparks and
  ; a light of its own, is five thousand particles and fifty dynamic lights -- and
  ; dynamic lights are the expensive kind. Past a ceiling a shot flies plainer: no
  ; light, or no trail, but the same shot going to the same place.
  ;
  ; MaxLights is what the terrain shader reads, which is eight. More than that would
  ; still light the creatures, drawn as they are with the engine's own lighting, and
  ; would silently stop lighting the floor -- which is the half worth having, so the
  ; two numbers are kept equal.
  ; ---------------------------------------------------------------------------

  Effects = Budget
    ; ★ EIGHT, and the floor's own shader was widened to take eight to match. A
    ; light the floor could not see would light the skeleton standing on it and
    ; leave the stone under his feet dark, which reads as a light that is broken.
    ; This is the most expensive thing on the page: every light is another pass
    ; over everything it reaches. Past it an effect burns without lighting the room
    ; and keeps everything else.
    MaxLights = 8
    MaxPerEffect = 8
    MaxBursts = 8
    ; How many skill rings may be open across the floor at once. Its own ceiling
    ; rather than a share of the bursts', because it is a different resource: a
    ; burst is particles and a light, a ring is a vertex buffer and two materials.
    ; Six is a whirlwind, a nova and a charge overlapping with room to spare. Past
    ; it the next skill keeps its fire, its light and its damage and loses a
    ; decoration, which is the cheapest thing in the room to lose.
    MaxRings = 6
    ; Nothing beyond this from the camera gets a light or a trail. The hero's own
    ; sight is 70 and the camera sits back from him, so this reaches comfortably
    ; past anything he can see.
    MaxDistance = 320
    ; Every particle burning at once, across every layer of every effect. Each is
    ; worked out on the graphics card from where and when it was born, so what
    ; this really limits is how much of the screen is being painted over more than
    ; once -- the part of a fight that makes a laptop warm. A meteor landing is
    ; about two hundred; this is four meteors, a nova and a fireball at once.
    MaxParticles = 1500
  End

  ; ---------------------------------------------------------------------------
  ; How a fight FEELS, as against what it costs.
  ;
  ; ShakeScale is every knock of the camera at once, against what each effect asked
  ; for: 1 as written, 0 for a camera that never moves. One number rather than a
  ; ShakePower zeroed on every effect, because whether the screen moves is a
  ; question about the player rather than about any one skill.
  ;
  ; And a creature that is hit goes white for an instant. The number coming off it
  ; says how much; the flash says WHICH, in a crowd of six round a nova. Strength is
  ; how far towards the colour, 0 for no flash at all; Seconds is the whole of it,
  ; since the flash is there at once and fades as a square. Only the other side's
  ; creatures flash -- the hero's own hurt is his bar and his portrait.
  ; ---------------------------------------------------------------------------

  Effects = Feel
    ShakeScale = 1
    HitFlashColour = 0xFFFFFF
    HitFlashSeconds = 0.14
    HitFlashStrength = 0.85
    ; And a shot bursts only if it struck somebody: a blow has to land on the other
    ; side, that same frame, this near to where the shot was last drawn, and the
    ; burst goes on the body it struck, which is where its blast is centred. A shot
    ; that meets a wall or runs out of flight hurts nobody, so it bursts nowhere. A
    ; fireball covers four units a frame, so a few frames of it and a body's width.
    ; A mark that lies where it was put -- the meteor's -- lands whatever is under it.
    StrikeWithin = 30
  End

  ; ---------------------------------------------------------------------------
  ; The hero's panel.
  ;
  ; The client draws it — stone slots, a blood bar, a green one — but writes none
  ; of the words on it, because which language a dungeon speaks is the dungeon's
  ; business and client3d is shared with three other games. So the wording is here.
  ;
  ; RankSuffix is stuck straight onto the level, and onto the level an ultimate is
  ; waiting for: 7 + "-daraja" is what appears beside his name, 5 + "-daraja" is
  ; what appears on the locked slot.
  ;
  ; The hero's name itself is not here — it is DisplayName in his template, where
  ; every other name in the game already lives.
  ; ---------------------------------------------------------------------------

  Hud = Panel
    DepthWord = CHUQURLIK
    RankSuffix = -daraja
    ; The heading over the skill row and over his bag.
    SkillsWord = MAHORAT
    ; What an unspent level is called, beside the heading above.
    PointsWord = NUQTA
    ; What a slot with nothing left to buy says, and one nobody has bought yet.
    MasterWord = USTA
    ; The tooltip's rows and its footer. Every one of them a finished word, because
    ; the client serves three other games and writes none of its own.
    DamageWord = Zarar
    CooldownWord = Kuluar
    RadiusWord = Radius
    RangeWord = Masofa
    BoostWord = Kuch
    SecondsWord = s
    ; The three things the footer can say: spend one, nothing left to spend it on,
    ; nothing to spend.
    ; The foot of a card that may be raised reads "<RaiseKeyWord><letter> · <RaiseWord>"
    ; -- Ctrl+Q · 1 nuqta sarflanadi. The letter is the skill's own and is put in
    ; by the game, since only it knows which key the skill sits on.
    RaiseKeyWord = Ctrl+
    RaiseWord = 1 nuqta sarflanadi
    MaxedWord = Eng yuqori daraja
    NoPointsWord = Nuqta yo'q
    LockedWord = yopiq
    ItemsWord = NARSALAR
    ; What he is, under his name. A name says which hero; this says what he does.
    HeroTitle = O'q ustasi
    ; The drawing that stands in the portrait when the player has picked out
    ; something that is not his. An archer's silhouette on a skeleton's card would
    ; be the panel lying about what is selected.
    MonsterFace = skull
    ; The four orders on the buttons beside the map, drawn in that order. They are
    ; what a mouse already does; the buttons are there so a player can see that the
    ; orders exist, which a right-click never told him.
    CmdMoveWord = Yur
    CmdAttackWord = Hujum
    CmdStopWord = To'xta
    CmdGuardWord = Himoya
    ; And the screen before the game starts, where he chooses who to be. The roster
    ; on it is the file's — one row per Hero block — so a third hero appears
    ; there by existing. There is no way past it: a run begins by taking a row.
    ChooseHeroWord = QAHRAMONNI TANLANG
    ChooseHeroHint = YUQORI PAST tanlang    ENTER kirish    ESC ortga
    ; Before that, which of the two games. The endless descent is what this has
    ; always been; a stage is the same rooms every time, so that losing teaches
    ; something. If no stage can be played, this screen is skipped entirely and
    ; the hero screen is the whole question — see Stages.all.
    ChooseModeWord = QANDAY O'YNAYSIZ
    ChooseModeHint = YUQORI PAST tanlang    ENTER tanlash    ESC ortga
    EndlessWord = Cheksiz tushish
    EndlessBlurb = Har safar yangi qavat. Qanchaga tushasiz?
    StagesWord = Bosqich
    StagesBlurb = O'zgarmaydigan xarita. Yutqazish o'rgatadi.
    ; And the list itself. The rows are the stages' own names and descriptions,
    ; out of the files -- drop a .stage in the folder and it is on this screen.
    ChooseStageWord = BOSQICHNI TANLANG
    ChooseStageHint = YUQORI PAST tanlang    ENTER tanlash    ESC ortga
    ; The figures beside his attributes. What they are worth is worked out from the
    ; creature file and his level; what they are CALLED is here, with the rest of
    ; the words. Speed is a figure only on a creature's card: a hero's is what one of
    ; his attributes became, and it is read on that attribute's card -- SpeedNowWord.
    AttackWord = Zarba
    ArmourWord = Zirh
    SpeedWord = Tezlik
    ; What an attribute's card says while the cursor rests on it. The attributes' own
    ; words and pictures are in their Attribute sections.
    HealthWord = Jon
    PrimaryWord = Asosiy atribut
    EachPointWord = Har bir birlik beradi:
    SpeedNowWord = Hozirgi tezlik:
    ; What a skill's price is called on its card. The bar it comes out of has no
    ; word on it -- a bar with a figure in it and a colour of its own does not need
    ; telling apart from the two above it.
    ManaWord = Mana
    ; ★ AND THESE ARE PAINTED, which is the one thing the panel has to be told
    ; about a picture. It tints what it draws -- that is how ONE white drawing
    ; served a slot that is ready, one reloading and one locked, three colours of
    ; the same file. A painted picture cannot take it: multiply a blue frost burst
    ; by the torch colour and it is a gold frost burst, and the grey blades of the
    ; whirlwind come out brass.
    ;
    ; Saying Yes here leaves the hue alone and tells the states in BRIGHTNESS
    ; instead -- ready is the picture as it was drawn, reloading the same picture
    ; darker, locked darker still and half faded. The armed slot keeps its colours
    ; entirely: the rim, the stone and the brackets round it have already gone
    ; cold, and washing a fire arrow in cyan would make the one socket that matters
    ; the one you cannot read.
    PaintedSkillIcons = Yes
    ; The four order buttons and the four figures: flat
    ; gold on transparency, so these ARE tinted -- gold when they are his, cyan
    ; while one is armed, grey when the creature is not his to order.
    ; Which picture goes on which button. In the file rather than in the client,
    ; which used to hold a drawing per name and so had an opinion about what an
    ; order looks like.
    CmdMoveIcon = icons/commands/cmd_move.png
    CmdAttackIcon = icons/commands/cmd_attack.png
    CmdStopIcon = icons/commands/cmd_stop.png
    CmdGuardIcon = icons/commands/cmd_guard.png
    ; And beside each figure. Named next to the figure rather than counted off
    ; against it: the panel used to pick by position out of a list of its own, so a
    ; game's third figure was a lightning bolt whatever the game thought it was.
    AttackIcon = icons/stats/stat_attack.png
    ArmourIcon = icons/stats/stat_armor.png
    SpeedIcon = icons/stats/stat_speed.png
    ; How often the live portrait is redrawn — see Portraits. A ceiling
    ; rather than a target: at this it still breathes, and the frames in between
    ; cost nothing at all, because a viewport that is switched off is skipped
    ; before anything in it is touched. Redrawing 150 pixels of one creature on
    ; every frame of a game that is drawing a floor is work nobody can see.
    PortraitFps = 24
  End

  ; ---------------------------------------------------------------------------
  ; The bar over a creature's head
  ;
  ; Read at the edge of the eye while the player is aiming somewhere else, which
  ; is the whole brief: it has to say how dangerous a thing is BEFORE it is looked
  ; at. Three things do that, and each answers a different question.
  ;
  ;   LENGTH   how much it has altogether -- a boss's bar is long, a rat's short
  ;   MARKS    how much each division is worth, shared by every creature alive
  ;   COLOUR   whose it is, and whether it is the floor's boss
  ;
  ; ★ THE MARKS ARE THE POINT OF THE TABLE. A player who has counted one monster's
  ; bar can read the next one without counting, because both are divided in the
  ; same lots. Scale the divisions to each creature's own maximum instead and every
  ; bar looks identical -- twelve marks on everything, and twelve marks that mean
  ; nothing.
  ;
  ; ★ AND THE LENGTH IS **NOT** WORKED OUT FROM THE MARKS. It is tempting: marks x
  ; a fixed spacing makes the two agree by construction and is one rule instead of
  ; two. It inverts. Ninety health at ten a mark is nine marks; a hundred and
  ; seventy at twenty-five a mark is six -- so the weaker monster would have worn
  ; the longer bar. Two rules, and the marks are allowed to sit closer together on
  ; some bars than on others. See UnitBarLookTest, which walks the whole range.
  ; ---------------------------------------------------------------------------

  UnitBar = Look

    ; ---- how much each mark is worth ----
    ;
    ; "<health up to>:<what one mark is worth>", coarsest last. The final rung is
    ; written with * and covers everything above: a creature bigger than anything
    ; planned for still gets marks rather than none.
    ;
    ; ★ THE RUNGS ARE CHOSEN SO THE COUNT STAYS BETWEEN 8 AND 20. Eight because
    ; fewer than that is not a scale, it is four blocks; twenty because past it the
    ; marks are closer together than they are wide and the bar reads as texture.
    ; That fixes the arithmetic completely: a rung covering health from LO to HI in
    ; lots of V needs HI/V <= 20 and LO/V >= 8, which is possible only while
    ; HI <= 2.5 x LO. So every rung below steps up by two or two-and-a-half, never
    ; more, and that is why there are nine of them rather than seven.
    ;
    ; ★ MEASURED AGAINST WHAT THE GAME ACTUALLY MAKES, not against a round range.
    ; The smallest monster has 30 health and the largest is the
    ; Champion, who at the deepest floor carries 600 x 2.2 = 1320; the Knight
    ; reaches 1260 at level fifteen. Everything from 30 to 20000 lands inside 8-20
    ; marks -- checked by DungeonUnitBarTest, which loads this file and walks it.
    Segments = 40:2 100:5 200:10 500:25 1000:50 2000:100 5000:250 10000:500 *:1000

    ; ---- how long ----
    ;
    ; The two anchors, in health, and the two lengths, in interface pixels. Between
    ; them the bar grows LOGARITHMICALLY, not proportionally: the range above is
    ; forty-six-fold, and a proportional bar spends nine tenths of it inside its
    ; first quarter-inch -- every monster in the game a stub, and only the boss
    ; visibly longer. The eye compares two bars as a ratio, so the curve is the one
    ; that matches. Doubling a creature's health moves its bar the same distance
    ; wherever it started.
    ;
    ; Outside the anchors it is flat, which is also the answer to "what about a
    ; creature nobody planned for": the weakest thing still has something to look
    ; at, and the strongest cannot draw a bar across the screen.
    ShortestAt = 30
    LongestAt = 2000
    ; Seven tenths of the 95 and 215 they were, which read as too long on screen. Both
    ; ends are cut alike, so every bar is cut alike and keeps its place against the rest.
    Shortest = 66.5
    Longest = 150.5

    ; ---- how tall ----
    ;
    ; ★ THIS IS THE TROUGH, and the dark keyline stands OUTSIDE it -- so a bar on
    ; screen is this plus four. Thirteen looked right on paper and came out at
    ; seventeen against a thirty-four pixel disc, which is half the medallion and
    ; reads as a plank rather than as a gauge. Eight puts the whole thing at twelve,
    ; which is the design's proportion.
    ;
    ; The reading still sits inside it -- that is what took the numbers off the top
    ; of the creature's head, where they fought with its name -- but only just, so
    ; CountSize below moved down with it.
    Height = 8
    ; The mana bar under it, thinner on purpose: it is the second thing to look at,
    ; and a bar of equal weight would argue with the first. Set to 0 and no
    ; creature is drawn one -- which is what every other game this client serves
    ; wants. Drawn only where a creature has mana at all, so a skeleton takes up no
    ; more room than it did.
    ManaHeight = 4
    Gap = 2
    ; How far above the creature's own measured height the whole thing floats, in
    ; world units, before any of it is projected onto the screen.
    Lift = 1.4

    ; ---- the medallion at the near end ----
    ;
    ; The level, in a disc, with the experience ring around it. The number is on
    ; EVERYBODY: a monster's level is the depth it is fought at -- which is exactly
    ; what it is scaled by, see MonsterHealthPercentPerDepth, and what a stage's
    ; difficulty means, see Stage -- so the disc answers "how hard is this one"
    ; with the same number the simulation used to make it hard.
    ;
    ; The RING is only on the hero, because he is the only thing in the game that
    ; earns experience. An empty ring on a skeleton would be a promise that it
    ; could fill.
    Ring = 34
    RingEdge = 2
    RingGap = 5
    Arc = 3

    ; ---- colours ----
    ;
    ; The panel's own, so the bar and the card under it are the same game.
    ; ★ THE ALLY'S FILL IS GREEN AND THE RING IS JADE, and they are deliberately
    ; not the same colour. The fill answers "how much is left"; the ring answers
    ; "how strong is this". One colour for both would tie two questions together
    ; that a player asks at different moments.
    Enemy = 0xB8372C
    Friend = 0x4FA83C
    Mana = 0x3E6FA8
    ; Behind an unfilled bar, and the marks across the filled part. Both nearly
    ; black: the marks are a ruler, and a ruler that competes with the reading is
    ; in the way of it.
    Trough = 0x1A1210
    Tick = 0x0A0806
    RingFace = 0x0A0806
    RingRim = 0x8FC4AE
    ; ★ The one thing on the bar meant to be NOTICED rather than read. Torch, like
    ; every other "this matters" in the game, and it is the whole of how a boss is
    ; told apart at a glance.
    BossRim = 0xE8A33D
    ; A boss is torch-lit throughout -- its rim AND its name -- so BossRim is the
    ; whole of "this is the floor's boss" and there is no second colour to keep in
    ; step with it.
    Lettering = 0xD9CFBA

    ; ---- lettering ----
    NameSize = 12
    ; A boss's name is larger for the same reason its rim is a different colour.
    BossNameSize = 13
    CountSize = 8
    LevelSize = 14
  End

  ; ---------------------------------------------------------------------------
  ; What the mouse pointer looks like, and over what.
  ;
  ; The pointer used to be the operating system's white arrow, which says exactly
  ; as much over a skeleton as over a wall: nothing. Half of the controls in a
  ; game played with a mouse are "the right-click means something different here",
  ; and the pointer is the only place that can be said BEFORE the click.
  ;
  ; The situations are the client's, because what is under the pointer is a fact
  ; about the screen rather than about the world -- a unit, the bar, a skill
  ; waiting to be aimed. There are five and the client knows no others:
  ;
  ;   Point   nothing in particular: open ground, the bar, a menu
  ;   Friend  one of his own
  ;   Attack  something a right-click would set about
  ;   Aim     a skill is armed and this is somewhere it can go
  ;   Deny    a skill is armed and this is not
  ;
  ; HotX and HotY are where the tip of the pointer is IN THE PICTURE, counted from
  ; its top-left corner the way anyone looking at the file would count. Get them
  ; wrong and every click lands a little away from where it was aimed, which reads
  ; as the game being imprecise rather than as two numbers being wrong. These
  ; drawings all put the arrow's point in the top-left corner, so they are all the
  ; same pair.
  ;
  ; Delete a block and that situation keeps whatever pointer was last shown;
  ; delete them all and the game is back to the system arrow.
  ; ---------------------------------------------------------------------------

  ; Tint is what colours them. The drawings are WHITE SHAPES INSIDE A BLACK
  ; OUTLINE, and the tint is multiplied in rather than painted over: white becomes
  ; the colour, black stays black, and the grey along an anti-aliased edge comes
  ; out as a darker shade of the same colour. So a tinted pointer is a coloured
  ; arrow that keeps its black keyline -- which is the thing that lets it be read
  ; against a dark floor and a lit wall alike. Painting over the drawing instead
  ; would flood the outline too and leave a shape with no edge.
  ;
  ; 0xFFFFFF means "as drawn", and costs no arithmetic at all.
  ;
  ; The colours below are the panel's, so the pointer and the bar are the same
  ; game: bone for nothing in particular, green for his, blood for a fight, torch
  ; for a skill waiting to be aimed.
  ;
  ; ui/cursors/ holds two sizes of the same 182 drawings: default/ at 32 pixels and
  ; double/ at 64. Thirty-two is the ordinary size for a pointer; on a very large
  ; screen double/ is the same line naming a different folder.

  Cursor = Point
    ; "cursor_none" is the pack's name for the plain arrow -- an arrow with no
    ; badge on it, not the absence of a cursor.
    Image = ui/cursors/default/cursor_none.png
    HotX = 8
    HotY = 3
    Tint = 0xDCD2BC
  End

  Cursor = Friend
    ; A pointing hand: this is yours and you can take hold of it.
    Image = ui/cursors/default/hand_small_point.png
    HotX = 8
    HotY = 5
    Tint = 0x7FBF6A
  End

  Cursor = Attack
    ; A sword. The one pointer that promises something, so it is only shown over a
    ; thing the next right-click will really set about.
    Image = ui/cursors/default/tool_sword_a.png
    HotX = 2
    HotY = 2
    Tint = 0xC4564A
  End

  Cursor = Aim
    ; A crosshair, and the one pointer whose tip is its MIDDLE rather than a
    ; corner -- that is what a crosshair is for, and the numbers say so.
    Image = ui/cursors/default/target_round_a.png
    HotX = 15
    HotY = 15
    Tint = 0xE8A33D
  End

  Cursor = Deny
    ; Armed, and this is stone or somewhere he has never been.
    Image = ui/cursors/default/cursor_disabled.png
    HotX = 2
    HotY = 1
    Tint = 0xA8322B
  End

  ; ---------------------------------------------------------------------------
  ; What the panel's edges are painted with.
  ;
  ; The panel was drawn entirely out of flat colour: a lit line along a top edge,
  ; a darker one under it, and the eye asked to read stone. It reads as neat, and
  ; neat is not what a dungeon's furniture should look like. So the edges are
  ; painted from a set of carved frames -- and only the edges.
  ;
  ; THE RULE, and the reason it looks right: the picture is the FRAME and never
  ; the field. What is inside a socket stays the gradient it always was, and the
  ; picture -- white line-work on nothing -- is laid over the top and tinted. That
  ; is what a carved panel actually is: a shaded surface with a painted edge. The
  ; same set ships filled versions of every frame, and using one would flatten the
  ; socket into a single colour, which is worse than what was there before.
  ;
  ; Inset is the number that makes one file serve everything. It says how many
  ; pixels at each edge of the picture are corner, and those pixels are never
  ; stretched: the middle of each edge is repeated instead. So a 48-pixel square
  ; frames a 22-pixel chip and a 190-pixel bar without its corners melting. The
  ; value is read off the file -- it is the width of the corner motif -- and a
  ; wrong one shows up at once as either a stretched corner or a fat edge.
  ;
  ; Scale is how many panel pixels one picture pixel becomes, which is how the
  ; same file is laid on lightly for a socket and heavily for something wide.
  ;
  ; Tint is the whole palette question: the pictures are white, so this is the
  ; only thing deciding whether an edge is gold or bone. The panel's own stone
  ; colours are unchanged -- they are the field, and the field is not painted.
  ;
  ; Every one of these is optional. Delete a block and that part of the panel is
  ; drawn the way it was before there were any pictures; delete them all and the
  ; panel is exactly the one the game shipped with. A name that is not one of
  ; Minimap, Portrait, Slot, Gauge, Chip or Divider is said in the log and
  ; ignored, for the same reason.
  ; ---------------------------------------------------------------------------

  Skin = Minimap
    ; Heavy Greek-key corners. The map is the busiest square on the bar and wants
    ; the firmest edge round it.
    Texture = ui/borders/default/border/panel-border-016.png
    Inset = 16
    Scale = 1.15
    Tint = 0xC9A24B
  End

  Skin = Portrait
    ; Corner brackets, which is what this frame already had drawn in lines. The
    ; picture is the same idea carved rather than ruled.
    Texture = ui/borders/default/border/panel-border-000.png
    Inset = 10
    Scale = 1.2
    Tint = 0xC9A24B
  End

  Skin = Slot
    ; One picture for the four skill sockets AND the larger ultimate: the whole
    ; point of an inset is that the ultimate is the same frame drawn bigger, with
    ; corners that stay the size they were carved at.
    Texture = ui/borders/default/border/panel-border-013.png
    Inset = 10
    Scale = 1.1
    Tint = 0xC9A24B
  End

  Skin = Gauge
    ; The plain square, whose whole ornament is a two-pixel rule. A health bar
    ; wants a bezel and nothing else -- anything carved would be read as part of
    ; the reading.
    Texture = ui/borders/default/border/panel-border-015.png
    Inset = 2
    Scale = 1.5
    Tint = 0x8A7F6C
  End

  Skin = Button
    ; The four order buttons. Small and plain: they sit beside the map and must not
    ; compete with the skill row, which is the thing a player looks at in a fight.
    Texture = ui/borders/default/border/panel-border-011.png
    Inset = 10
    Scale = 0.85
    Tint = 0xC9A24B
  End

  Skin = Item
    ; His bag. A quieter frame than a skill socket, and bone rather than gold:
    ; what he is carrying is worth seeing and never worth looking at first.
    Texture = ui/borders/default/border/panel-border-019.png
    Inset = 12
    Scale = 0.8
    Tint = 0x8A7F6C
  End

  Skin = Chip
    ; Twenty-two pixels square, so the frame is nearly all corner. A simple one.
    Texture = ui/borders/default/border/panel-border-011.png
    Inset = 10
    Scale = 0.55
    Tint = 0xC9A24B
  End

  Skin = Divider
    ; The odd one. A divider is an ornament of a fixed length rather than a frame,
    ; so it is not cut into nine: it is drawn whole, stood on end, and mirrored
    ; about the middle of the bar. The picture fades at one end and finishes in a
    ; device at the other, so the two faded ends meet in the middle and the two
    ; devices point out. Scale sets how long each half is -- 96 picture pixels at
    ; 0.86 is 83, and two of those very nearly fill the 172-pixel band.
    Texture = ui/borders/default/divider_fade/divider-fade-002.png
    Inset = 0
    Scale = 0.86
    Tint = 0xC9A24B
  End

  ; ---- the plaque a banner is written on ------------------------------------
  ;
  ; Three of them rather than one, because the three moments a run has outside the
  ; fight are not the same news and the frame is the only thing on screen that can
  ; say which: a death is an interruption, a floor is a door, an ending is an
  ; ending. Name only "Banner" and all three get that one -- still better than the
  ; bare lettering this replaced, which was the one readable thing in the game
  ; with nothing behind it, over a dark floor with a fight on it.
  ;
  ; Heavier corners and a bigger Scale than the bar uses: this is read once, from
  ; the middle of the screen, at four times the interface size.

  Skin = Banner
    Texture = ui/borders/default/border/panel-border-016.png
    Inset = 16
    Scale = 1.8
    Tint = 0xC9A24B
  End

  Skin = BannerWon
    ; Gold, and more of it. An ending is the one banner worth looking at.
    Texture = ui/borders/default/border/panel-border-019.png
    Inset = 16
    Scale = 1.8
    Tint = 0xF0C860
  End

  Skin = BannerLost
    ; The same red the deny cursor and the attack mark are drawn in, so the colour
    ; means one thing across the whole game.
    Texture = ui/borders/default/border/panel-border-000.png
    Inset = 16
    Scale = 1.8
    Tint = 0xB03A30
  End

  ; ---------------------------------------------------------------------------
  ; The lettering the menus are set in.
  ;
  ; Carved Roman capitals, baked from the TTF into a page of glyphs and a table by
  ; BitmapFontBaker — jME cannot read a TrueType font. Named here rather than in
  ; the client because the client draws four games and none of the others is a
  ; dungeon.
  ;
  ; Naming nothing puts the menus back to the engine's own plain lettering.
  ; ---------------------------------------------------------------------------

  Menu = Style
    TitleFont = fonts/cinzel-22.fnt
    RowFont = fonts/cinzel-17.fnt
  End

  ; ---------------------------------------------------------------------------
  ; How a floor looks
  ;
  ; Every floor is the same fight; what changes is what it is made of. A theme is
  ; a kit to build the floor from, a colour for the dark, and whatever creatures
  ; are drawn differently while it lasts. It changes no room, no monster and no
  ; number the simulation reads -- which is exactly why the choice can be drawn
  ; from the seed without disturbing the world's own dice, and why a test can hold
  ; the checksum still across a change of theme.
  ;
  ; A fourth theme is three sections here and a folder of models. There is no Java.
  ;
  ;   Theme = <Name>               what the kit is and how it is placed
  ;   Tone = <Theme> <Name>        one variation inside it, drawn from the seed
  ;   ThemeMonster = <Theme> <Template>   a creature drawn differently here
  ;   Themes = Order               which depth wears which
  ;
  ; The placement numbers are the awkward part and they are awkward because kits
  ; disagree. Where a wall's origin sits, how wide a wall was modelled against its
  ; own floor tiles, whether the models carry their own colours -- every kit
  ; answers differently, and every one of those answers is measured rather than
  ; guessed. See DungeonTilesTest, which loads each of them and checks.
  ;
  ; And one of them is not a measurement at all but a question about the art:
  ; is the wall piece a SURFACE or a THING? A surface tiles -- two storeys of it is
  ; two courses, every one alike, all facing the way the boundary faces. A thing
  ; does none of that: two storeys of tree is one bigger tree, and a row of
  ; identical trees at identical spacing is an orchard rather than a wood. That is
  ; what WallFillsRock, WallClump, WallSpread and WallVariety are between them, and a
  ; kit that says none of them gets masonry, which is what every kit got before
  ; they existed.
  ; ---------------------------------------------------------------------------

  ; Worked stone, four-unit tiles, one colour atlas. The wall is a slab a unit
  ; thick centred on its own origin, so it is pushed back half a unit to put its
  ; face on the boundary; it stands on its origin, so it needs no lift.
  ;
  ; No corner post. This kit's corner piece is a length of wall bent round a right
  ; angle rather than the quarter-tile plug the notch wants, and a bent wall
  ; dropped into the notch stands across both walls that meet there.
  Theme = Dungeon
    TileSize = 4
    WallHeight = 4
    WallShift = -0.5
    Stairs = models/tiles/dungeon/stairs.gltf
    ; ★ The lid on the rock is a FLOOR TILE -- the same model and the same picture
    ; as the ground of a room, laid at the top of the walls instead of under the
    ; feet. That is right, and it is also the reason a player asked where he was
    ; allowed to walk: two surfaces, one texture, both facing up, so the one sun
    ; meets them at the same angle and shades them the same. No light fixes it --
    ; see Sun -- and a colour does, for one material and no extra geometry.
    ;
    ; Cooler and about two thirds as bright: the top of a wall is stone in shade,
    ; and it still reads as the same stone.
    CapTint = 0xA8A8B4
    ; And each storey up a little brighter, which is the same question one level
    ; out: a raised room is the same tiles higher up, and looking down a slope
    ; there is otherwise nothing to say it is not simply further away. 100 is flat.
    ;
    ; Worked DOWN from the tallest storey the map has, because a tint multiplies
    ; and multiplying can only darken -- ask a white tile to be brighter and it
    ; hands back the white it already was. So the top floor is left alone and the
    ; ones under it step down, which comes out looking like what this says.
    StoreyShadePercent = 108
    ; No WallBase: a wall is a surface here, so two storeys of rock is two courses
    ; of masonry and the mass between them is already closed in by its own faces.
    FogTint = 0x07060A
  End

  Tone = Dungeon Stone
    Floor = models/tiles/dungeon/floor.gltf
    Wall = models/tiles/dungeon/wall.gltf
  End

  Tone = Dungeon Cracked
    Floor = models/tiles/dungeon/floor_rocks.gltf
    Wall = models/tiles/dungeon/wall_cracked.gltf
  End

  ; ---------------------------------------------------------------------------
  ; The same dungeon, out of doors.
  ;
  ; Nothing is a wall here: what a body cannot cross is drawn as a tree, and the
  ; rock between the rooms is roofed at ground level rather than at wall height —
  ; so the whole map is forest floor, with tree lines standing where the corridors
  ; are not. The layout is the one the generator always draws; only what it is
  ; made of has changed, which is the whole point of a theme.
  ;
  ; WallHeight = 0 is what lays that roof on the ground. WallShift moves each tree
  ; half a cell back into the rock it stands on, so the trunk marks the edge and
  ; the canopy leans over the path rather than standing in it.
  ;
  ; The floor and the steps come from the dungeon kit — dirt and stone, which a
  ; forest has as much as a cellar does — and the trees from the forest one. Two
  ; atlases in one folder, each model naming its own.
  ; ---------------------------------------------------------------------------

  Theme = Forest
    TileSize = 4
    ; The trees are modelled on their own scale -- about three units across, where
    ; the floor is four -- so they are sized by their own module. Measured off the
    ; model, like every other number on this page.
    WallTileSize = 3.2
    WallHeight = 0
    ; Half a cell back into the rock it stands on, so the trunk marks the edge and
    ; the canopy leans over the path rather than standing in it.
    WallShift = -1.6
    Stairs = models/tiles/forest/stairs.gltf
    ; A tree is not masonry, and these four lines are the whole of that difference.
    ;
    ; WallFillsRock: a wall is a SURFACE -- one piece per face, one course per
    ; storey -- and a tree is a BODY. Both faces of a one-cell wall drew the same
    ; tree twice, once at the foot of the rock and once up on its roof with the
    ; floor between them; two storeys drew it twice more, stacked. Saying Yes here
    ; draws it once per block of rock, in the middle of it and ON TOP of it -- one
    ; tree, standing on the rock's own roof, whatever the rock is.
    ;
    ; The other three break the grid. One tree per cell, all the same size, all the
    ; same way up, reads as an orchard: the eye sees the spacing before it sees the
    ; tree. Three in a ring, each a different size and facing, and the rows go away.
    WallFillsRock = Yes
    WallClump = 3
    WallSpread = 0.28
    WallVariety = 0.5
    ; ★ WHAT THE SIDE OF A RAISED BLOCK OF ROCK IS DRAWN WITH, and the whole of
    ; the second thing the first player complained about: trees hanging in the air
    ; on the upper floors.
    ;
    ; The trouble is that a tree is a BODY. Masonry has none of it: a block of rock
    ; two storeys tall is walled in two courses, and those courses ARE its sides.
    ; There are no courses of tree -- one is drawn, on top -- so the client used to
    ; throw the faces away, and then nothing at all drew the rock. A tree crowning
    ; the block beside a room two storeys up stood at the room's own height with
    ; daylight underneath it.
    ;
    ; So the faces are kept and drawn with this instead: a retaining wall. The
    ; dungeon's own wall, borrowed -- which is why it sits in this theme's PROPS
    ; folder rather than among its tiles, and why the stone stairs already down
    ; here look like they belong beside it.
    ;
    ; Scaled by what it measures rather than by a number written here, so its
    ; height fills exactly one storey and, being a uniform scale on a square slab,
    ; its width fills exactly one cell. Two storeys is two courses.
    ;
    ; ★ Drawn ONLY where the rock stands above the foot of the face. Nearly all the
    ; rock down here is at the floor's own height -- WallHeight = 0 -- and a
    ; retaining wall under every tree would be a stone kerb round the whole forest.
    ;
    ; A theme that leaves this out is drawn exactly as it always was.
    RockFace = models/props/forest/wall.gltf
    ; ★ NO CapTint HERE, deliberately, and it was tried. The lid on the rock is what
    ; every tree stands on, and tinting it put a dark SQUARE under each one -- which
    ; hands the player back the very grid that WallClump, WallSpread and WallVariety
    ; above exist to hide. In the cellar the tint costs nothing, because masonry is
    ; laid on cell boundaries and the grid is already on show; in a wood it undoes
    ; the art. What says "you cannot walk here" out of doors is the tree itself, and
    ; at the edge of a terrace it is the wall above.
    StoreyShadePercent = 108
    ; Green in the dark, because everything here grows.
    FogTint = 0x060B06
  End

  Tone = Forest Wooded
    Floor = models/tiles/forest/floor.gltf
    Wall = models/tiles/forest/tree.gltf
  End

  Tone = Forest Stony
    Floor = models/tiles/forest/floor_rocky.gltf
    Wall = models/tiles/forest/tree_round.gltf
  End

  ; ---------------------------------------------------------------------------
  ; What walks the ship.
  ;
  ; The game's own creatures, unchanged.
  ;
  ; A theme may name a different model for a kind -- that is what
  ; ThemeMonster is for, and it works: the section is read, the look is
  ; swapped, and nothing the simulation reads moves. This theme names none, which
  ; is a choice rather than a gap. The skeletons that walk the stone walk the
  ; corridors too, and the floor around them is what says where you are.
  ; ---------------------------------------------------------------------------

  ; ---------------------------------------------------------------------------
  ; Which depth wears which.
  ;
  ; Two floors each, then round again. WhenExhausted is the answer to a real
  ; question in a game with no bottom: Repeat begins the list over, Last stays in
  ; the deepest look for ever.
  ; ---------------------------------------------------------------------------

  ; ---------------------------------------------------------------------------
  ; What stands about in the rooms.
  ;
  ; A room with nothing in it is a floor with a fight on it. These are ordinary
  ; templates (ini/props/) with a shape and no body, which means the engine makes
  ; them solid — paths go round them, bodies stop at them — and neither brain will
  ; ever shoot at one, because both look for a candidate with a body.
  ;
  ; How each is drawn is the theme's business: ThemeMonster re-skins any
  ; template, and a prop is a template. A theme that names no model for one gets
  ; the engine's plain shape, which for a cylinder is a pillar already.
  ; ---------------------------------------------------------------------------

  Props = Scatter
    ; Per room, including the one the hero starts in. Kept low: things to walk
    ; round are furniture, and a room full of furniture is a room you cannot fight
    ; in.
    MinPerRoom = 0
    MaxPerRoom = 3
  End

  ; ---- what stands about, theme by theme ------------------------------------
  ;
  ; The templates are the same three either way (ini/props/); what a Pillar is made
  ; of is the theme's business. Scales are measured off the models: a pillar four
  ; units tall wants 2.5 to stand a storey high, a barrel two units wants 3.

  ThemeMonster = Dungeon Pillar
    Model = models/props/dungeon/pillar.gltf
    ModelScale = 2.5
  End

  ThemeMonster = Dungeon Statue
    Model = models/props/dungeon/pillar_decorated.gltf
    ModelScale = 2.5
  End

  ThemeMonster = Dungeon Barrel
    Model = models/props/dungeon/barrel.gltf
    ModelScale = 3.0
  End

  ; The chest a monster leaves behind. It has been a torch-coloured box since the
  ; game was written, because no kit shipped with one; this one does.
  ThemeMonster = Dungeon Chest
    Model = models/props/dungeon/chest.gltf
    ModelScale = 5.0
  End

  ThemeMonster = Forest Pillar
    Model = models/props/forest/tree_bare.gltf
    ModelScale = 3.5
  End

  ThemeMonster = Forest Statue
    Model = models/props/forest/rock.gltf
    ; A boulder about as wide as the Statue template is round, so what you see and
    ; what you walk into are the same stone.
    ModelScale = 6.5
  End

  ThemeMonster = Forest Barrel
    Model = models/props/forest/rock_small.gltf
    ModelScale = 9.0
  End

  ThemeMonster = Forest Chest
    Model = models/props/forest/chest.gltf
    ModelScale = 5.0
  End

  Themes = Order
    ; Two floors out of doors, then two of stone, then round again. Out of doors
    ; first because the first floor is the one everybody sees and nobody chose to
    ; see -- the descent reads better as going in than as going further in.
    Order = Forest Forest Dungeon Dungeon
    WhenExhausted = Repeat
  End

  ; ===========================================================================
  ; What the dungeon sounds like.
  ;
  ; The client raises moments by name -- an arrow left a bow, a floor changed, a
  ; key was pressed -- and has never heard of a bow. What each moment sounds like
  ; is here, and adding one is a block rather than a line of Java. That division
  ; is the same one the models follow, and for the same reason: client3d draws
  ; four games and cannot hold any of their opinions.
  ;
  ; A name may be dotted. The client asks for `died.Boss` and takes `died` when
  ; nobody wrote the first -- so a game is as particular as it wants to be and no
  ; more, and no creature's name appears in the client.
  ;
  ; Channel is which knob turns it down: Effects, Voice, Ui or Music. Four rather
  ; than one because the same person wants them at different volumes -- keeping
  ; the music low while still hearing what is behind you is an ordinary thing to
  ; want, and so is silencing a hero who will not stop talking.
  ;
  ; Positional says whether it happened somewhere. A shot did; a menu click did
  ; not, and giving it a position would make it quieter when the camera moved.
  ;
  ; Several File lines means several ways it can sound, and the client never plays
  ; the same one twice running. That matters most where it is heard most: the bow
  ; goes hundreds of times in a run, and one unvarying sample stops being a bow
  ; and becomes a click.
  ;
  ; Gain is per cue because four packs recorded by four people are not mastered to
  ; each other. GapSeconds is the least time between two of the same moment -- a
  ; footstep needs a stride, or a walk is a buzz.
  ; ===========================================================================

  Sounds = Settings
    ; One voice at a time. A player clicking around the floor gives an order every
    ; frame he likes; she answers the first and then keeps quiet.
    VoiceGapSeconds = 1.6
  End
End
