; The crossbow skeleton's bolt and the mage's fire. The same creature again --
; no body, no geometry, one ArrowUpdate -- because what a thing in flight IS has
; nothing to do with what threw it or what it looks like on the way.
Projectile Bolt
  DisplayName = Bolt
  VisionRange = 0
  Update = ArrowUpdate Tag
  End


  ; The crossbow skeleton's. The same shaft as the hero's, shorter and duller:
  ; what is coming at you should be recognisable as a shot without being
  ; mistaken for one of yours.
  Model = models/heroes/arrow.gltf
  Scale = 4.2
  Facing = 90
  ; Crossbow height rather than bow height: it is held level at the shoulder.
  Height = 7.5
  Tint = 0x9A8F7A
End
