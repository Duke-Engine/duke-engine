; Duke Dungeon — the things standing about in the rooms.
;
; A dungeon of bare floors is a dungeon of corridors with fights in them. What
; makes a room a place is what is in it: a pillar to walk round, a statue that
; was somebody's, a barrel nobody has opened in a hundred years.
;
; Every one of these is a template like any other, which is what makes them cost
; nothing. They have a Geometry, so the engine bakes them into the navigation
; grid and paths go round them and bodies stop at them — no new mechanism, and
; the same one that already made buildings solid.
;
; And every one of them has **no Body**. That is the whole of why nothing shoots
; at them: both brains look for a candidate with a body, so a thing without one
; is not a target, cannot be hurt and cannot be killed. The loot chest has worked
; that way since it was written.
;
; How they are drawn is the theme's business (DungeonThemeMonster in dungeon.ini
; re-skins any template, and a prop is a template). A theme that names no model
; for one gets the engine's plain shape, which for a cylinder is a pillar
; already.

Object Pillar
  DisplayName = Pillar
  KindOf = STRUCTURE
  VisionRange = 0
  Geometry = CYLINDER
  ; Three across, so two of them do not close a two-cell corridor — they are
  ; scattered in rooms rather than in corridors, but a room's edge is a doorway.
  GeometryMajorRadius = 3
  GeometryHeight = 12
End

Object Statue
  DisplayName = Statue
  KindOf = STRUCTURE
  VisionRange = 0
  Geometry = CYLINDER
  GeometryMajorRadius = 3.5
  GeometryHeight = 14
End

Object Barrel
  DisplayName = Barrel
  KindOf = STRUCTURE
  VisionRange = 0
  Geometry = CYLINDER
  GeometryMajorRadius = 2.5
  GeometryHeight = 6
End
