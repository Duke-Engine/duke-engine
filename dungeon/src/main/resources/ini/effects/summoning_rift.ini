; A rift: the column a level rises in, turned purple and a size smaller, with a
; skeleton climbing out of it. While the rift lies open it swirls on the floor and
; glows; when it lands the column goes up, the ring opens and the motes rise, on the
; frame the skeleton stands there. Kind names an orb only because a thing with no
; model has to; drawn in layers, the orb is never shown.
DungeonEffect SummoningRift
  Kind = GLOW_ORB
  Colour = 0xC890FF
  OrbSize = 1
End

