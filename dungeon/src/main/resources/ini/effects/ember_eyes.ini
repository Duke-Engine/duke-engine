DungeonEffect EmberEyes
  ; What is looking at you out of the dark. Every skeleton in the pack ships an
  ; Eyes mesh of its own -- Skeleton_Warrior_Eyes, Skeleton_Mage_Eyes -- so Part
  ; matches a WORD in the name rather than the whole of it, and one line here
  ; lights all four.
  ;
  ; No light and no particles on purpose. There may be twenty skeletons on a
  ; floor: a torch each is over the budget before the second one, and this costs
  ; one material apiece. It also reads better than a light would, because what
  ; you see across a dark room is two points of fire moving, which is exactly
  ; what the dark is for.
  Kind = GLOW_PARTS
  Part = Eyes
  Colour = 0xFF7A18
End
