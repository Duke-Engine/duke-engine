; ---- the knight ----

DungeonEffect KnightCleave
  ; Q. Short, wide and white-hot: it is a swing, so it is over before it is read
  ; and what is left is the size of the arc. The shortest wave on the page.
  Kind = SHOCKWAVE
  Kind = IMPACT_BURST
  Colour = 0xFFF0D0
  LightColour = 0xFFD08A
  LightPower = 2.0
  LightRadius = 52
  BurstParticles = 24
  BurstSize = 3.2
  BurstSeconds = 0.26
  WaveFrom = 6
  WaveTo = 26
  WaveSeconds = 0.28
  WaveEase = 3.0
  WaveEdge = 1.0
  WaveWash = 0.20
  ShakeSeconds = 0.12
  ShakePower = 0.7
End

; The cut, laid flat across the blow and facing the way it went: a white arc as
; wide as the skill reaches, a fainter one a breath behind it, a flash where the
; blade bit, sparks thrown on along the swing and a scuff of dust off the stone.
DungeonEffectLayer KnightCleave Arc
  Type = ARC
  Measure = Reach
  Texture = effects/particles/slash_04.png
  Blend = Additive
  Cover = 0.2
