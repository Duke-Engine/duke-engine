; ---- moving about ---------------------------------------------------------

DungeonSound walking.Hero
  Channel = Effects
  Positional = Yes
  Gain = 0.35
  ; His stride. Without this the client would play one per frame and a walk
  ; would be a buzz rather than a walk.
  GapSeconds = 0.34
  File = audio/sfx/footstep_1.ogg
  File = audio/sfx/footstep_2.ogg
  File = audio/sfx/footstep_3.ogg
  File = audio/sfx/footstep_4.ogg
  File = audio/sfx/footstep_5.ogg
End

