; The drawn shot Q looses -- one sound, because it happens once in a while and
; wants to be recognised rather than varied.
DungeonSound spawned.HeavyArrow
  Channel = Effects
  Positional = Yes
  Gain = 0.8
  File = audio/sfx/bow_shot_heavy.ogg
End

DungeonSound struck.Arrow
  Channel = Effects
  Positional = Yes
  Gain = 0.7
  File = audio/sfx/arrow_hit_1.ogg
  File = audio/sfx/arrow_hit_2.ogg
  File = audio/sfx/arrow_hit_3.ogg
End

; ---- being hit, and dying -------------------------------------------------

DungeonSound hurt.Hero
  Channel = Effects
  Positional = Yes
  Gain = 0.9
  ; Half a second apart at most: three arrows landing at once should sound like
  ; trouble, not like a rattle.
  GapSeconds = 0.35
  File = audio/sfx/hero_hurt_1.ogg
  File = audio/sfx/hero_hurt_2.ogg
End

; Death, by what died. The client asks for died.<Template> and falls through to
; died, so a creature nobody wrote a line for still makes a noise.
DungeonSound died
  Channel = Effects
  Positional = Yes
  Gain = 0.7
  File = audio/sfx/death_generic.ogg
End

