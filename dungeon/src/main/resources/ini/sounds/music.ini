; ---- and what it sounds like underneath -----------------------------------
;
; Three of them, and which one plays is the player's to say from the settings
; screen -- the one channel where the choice is taste rather than a moment. Add
; a fourth by writing a fourth block; the screen lists whatever is here, in the
; order it is written, and Label is what it calls them.

DungeonSound music.industrial
  Channel = Music
  Positional = No
  Gain = 0.5
  Label = Industrial
  File = audio/music/dungeon_loop.ogg
End

DungeonSound music.uncertainty
  Channel = Music
  Positional = No
  Gain = 0.6
  Label = Uncertainty
  File = audio/music/uncertainty.ogg
End

DungeonSound music.sentinel
  Channel = Music
  Positional = No
  Gain = 0.6
  Label = The Sentinel
  File = audio/music/sentinel.ogg
End
